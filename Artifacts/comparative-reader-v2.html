<style>

    --bg: #ffffff; --panel: #f6f8fa; --text: #1f2328; --muted: #656d76;

  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel);

  .header-left h1 { font-size: 16px; font-weight: 600; }
  .header-left .subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .toolbar { display: flex; gap: 6px; }
  .icon-btn {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .icon-btn:hover, .icon-btn.active { border-color: var(--accent); color: var(--accent); }

  .topbar {
    display: flex; gap: 12px; align-items: center; padding: 8px 16px;
    border-bottom: 1px solid var(--border); font-size: 13px; flex-wrap: wrap;
  }
  .topbar select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; border-radius: 6px; font-size: 13px;
  }
  .legend { display: flex; gap: 10px; margin-left: auto; font-size: 12px; color: var(--muted); flex-wrap: wrap; }

  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--border); }
  .legend-item[data-tag="g1"] .legend-swatch { background: var(--hl-bg-1); border-color: var(--hl-1); }
  .legend-item[data-tag="g2"] .legend-swatch { background: var(--hl-bg-2); border-color: var(--hl-2); }
  .legend-item[data-tag="g3"] .legend-swatch { background: var(--hl-bg-3); border-color: var(--hl-3); }
  .legend-item[data-tag="g4"] .legend-swatch { background: var(--hl-bg-4); border-color: var(--hl-4); }

  .reader {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr;
    gap: 1px; background: var(--border); overflow: hidden;
  }
  .pane {
    background: var(--bg); overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column;
  }
  .pane-header {
    position: sticky; top: -20px; background: var(--bg); padding: 8px 0 10px;
    margin-bottom: 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; z-index: 10;
  }
  .cefr {
    display: inline-block; font-size: 11px; padding: 3px 8px;
    background: var(--accent); color: var(--bg); border-radius: 4px;
    font-weight: 700;
  }
  .cefr.a2 { background: #3fb950; }
  .cefr.b1 { background: #d29922; }
  .pane-title { font-size: 14px; font-weight: 600; }
  .pane-source { font-size: 11px; color: var(--muted); margin-left: auto; }

  .chapter-label {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 6px; margin-top: 16px;
    border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  .chapter-label:first-child { margin-top: 0; }

  .pane p {
    font-size: 16px; line-height: 1.8; margin-bottom: 14px;
  }
  .pane.right p { font-size: 17px; }

  .seg {
    cursor: pointer; border-radius: 3px; padding: 1px 2px;
    transition: background 0.15s, outline 0.1s;
  }
  .seg[data-tag="g1"] { background: var(--hl-bg-1); border-bottom: 1.5px solid var(--hl-1); }
  .seg[data-tag="g2"] { background: var(--hl-bg-2); border-bottom: 1.5px solid var(--hl-2); }
  .seg[data-tag="g3"] { background: var(--hl-bg-3); border-bottom: 1.5px solid var(--hl-3); }
  .seg[data-tag="g4"] { background: var(--hl-bg-4); border-bottom: 1.5px solid var(--hl-4); }
  .seg.active { background: var(--hl-active) !important; outline: 2px solid var(--accent); }
  .seg.tag-hidden { background: transparent !important; border-bottom: none !important; }

  .footer-bar {
    border-top: 1px solid var(--border); padding: 10px 16px;
    background: var(--panel); font-size: 13px;
    display: flex; gap: 12px; align-items: center; min-height: 52px; flex-wrap: wrap;
  }
  .seg-info { color: var(--muted); flex: 1; }
  .seg-info strong { color: var(--accent); }
  .seg-info em { color: var(--text); font-style: normal; }
  .seg-counter { font-size: 12px; color: var(--muted); }

  @media (max-width: 720px) {
    .reader { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .legend { display: none; }
  }
  @media print {
    .toolbar, .topbar, .footer-bar { display: none; }
    .reader { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>

      // ── Chapter: Aftermath ──
      {
        chapter: 5,
        left: [
          { text: "Sancho Panza " },
          { id: 26, text: "hurried over", tag: "g3" },
          { text: " to help his master. 'Did I not " },
          { id: 27, text: "warn you", tag: "g4" },
          { text: "?' he cried. 'Those were windmills, and only someone " },
          { id: 28, text: "who had windmills in their head", tag: "g4" },
          { text: " could have made such a terrible mistake!'" }
        ],
        right: [
          { text: "Sancho Panza " },
          { id: 26, text: "ran to help", tag: "g3" },
          { text: " Don Quixote. 'I told you!' he said. 'They were windmills! Only a person " },
          { id: 28, text: "who does not think carefully", tag: "g4" },
          { text: " could make this mistake!'" }
        ]
      },
      {
        chapter: 5,
        left: [
          { text: "'Peace, friend Sancho,' " },
          { id: 29, text: "replied", tag: "g4" },
          { text: " Don Quixote, who was already " },
          { id: 30, text: "struggling to his feet", tag: "g3" },
          { text: ". 'The affairs of war are, more than any others, " },
          { id: 31, text: "subject to", tag: "g2" },
          { text: " constant change. And besides, I think that a certain " },
          { id: 32, text: "sage", tag: "g2" },
          { text: " — my enemy — has " },
          { id: 33, text: "transformed", tag: "g2" },
          { text: " those giants into windmills in order to " },
          { id: 34, text: "rob me of the glory", tag: "g3" },
          { text: " of the victory.'" }
        ],
        right: [
          { text: "'It's OK, Sancho,' " },
          { id: 29, text: "said", tag: "g4" },
          { text: " Don Quixote. He was slowly " },
          { id: 30, text: "getting up", tag: "g3" },
          { text: " from the ground. 'War always changes. And I think my enemy — a " },
          { id: 32, text: "wise man", tag: "g2" },
          { text: " — " },
          { id: 33, text: "changed", tag: "g2" },
          { text: " those giants into windmills. He wanted to " },
          { id: 34, text: "take away my win", tag: "g3" },
          { text: ".'" }
        ]
      }
    ]
  }
};

// ===================== STATE =====================
const KEY = 'comparative-reader-v2';
let state = loadState();

function loadState() {
  try {
    return Object.assign({
      textKey: 'atomic', tagFilter: '', sync: true,
      theme: 'dark', activeId: null, segClicks: {}
    }, JSON.parse(localStorage.getItem(KEY) || '{}'));
  } catch { return { textKey: 'atomic', tagFilter: '', sync: true, theme: 'dark', activeId: null, segClicks: {} }; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ===================== RENDER =====================
function renderTextSelect() {
  const sel = document.getElementById('textSel');
  sel.innerHTML = Object.entries(TEXTS).map(([k, t]) =>
    `<option value="${k}" ${k === state.textKey ? 'selected' : ''}>${t.title}</option>`
  ).join('');
}

function renderLegend() {
  const t = TEXTS[state.textKey];
  document.getElementById('legend').innerHTML = Object.entries(t.legend).map(([k, label]) =>
    `<span class="legend-item" data-tag="${k}" title="Filtrele: ${esc(label)}"><span class="legend-swatch"></span>${esc(label)}</span>`
  ).join('');
}

function renderText() {
  const t = TEXTS[state.textKey];
  document.getElementById('leftCefr').textContent = t.leftCefr;
  document.getElementById('rightCefr').textContent = t.rightCefr;
  document.getElementById('leftSrc').textContent = t.source;
  document.getElementById('rightSrc').textContent = `A2 Uyarlama`;
  renderLegend();

  let lastChapterLeft = -1, lastChapterRight = -1;
  let leftHtml = '', rightHtml = '';

  t.pairs.forEach(p => {
    // Chapter label
    if (p.chapter !== undefined && p.chapter !== lastChapterLeft) {
      lastChapterLeft = p.chapter;
      leftHtml += `<div class="chapter-label">${esc(t.chapters[p.chapter]?.label || '')}</div>`;
    }
    leftHtml += '<p>' + p.left.map(s => renderSeg(s)).join('') + '</p>';
  });

  t.pairs.forEach(p => {
    if (p.chapter !== undefined && p.chapter !== lastChapterRight) {
      lastChapterRight = p.chapter;
      rightHtml += `<div class="chapter-label">${esc(t.chapters[p.chapter]?.label || '')}</div>`;
    }
    rightHtml += '<p>' + p.right.map(s => renderSeg(s)).join('') + '</p>';
  });

  document.getElementById('leftBody').innerHTML = leftHtml;
  document.getElementById('rightBody').innerHTML = rightHtml;

  // Seg counter
  const total = document.querySelectorAll('.seg[data-id]').length / 2;
  document.getElementById('segCounter').textContent = `${total} yapı · ${t.pairs.length} paragraf çifti`;

  attachSegEvents();
  applyTagFilter();
}

function renderSeg(s) {
  if (!s.id) return esc(s.text);
  const tagAttr = s.tag ? ` data-tag="${s.tag}"` : '';
  return `<span class="seg" data-id="${s.id}"${tagAttr}>${esc(s.text)}</span>`;
}

function attachSegEvents() {
  document.querySelectorAll('.seg').forEach(el => {
    el.onclick = () => activateSeg(parseInt(el.dataset.id));
  });
  if (state.activeId !== null) highlightActive();
}

function applyTagFilter() {
  document.querySelectorAll('.seg').forEach(el => {
    const tag = el.dataset.tag;
    if (state.tagFilter && tag !== state.tagFilter) {
      el.classList.add('tag-hidden');
    } else {
      el.classList.remove('tag-hidden');
    }
  });
}

function activateSeg(id) {
  state.activeId = (state.activeId === id) ? null : id;
  const k = `${state.textKey}:${id}`;
  state.segClicks[k] = (state.segClicks[k] || 0) + 1;
  save();
  highlightActive();
  updateSegInfo(id);
  if (state.sync && state.activeId !== null) scrollPairIntoView(id);
}

function highlightActive() {
  document.querySelectorAll('.seg.active').forEach(e => e.classList.remove('active'));
  if (state.activeId === null) { clearSegInfo(); return; }
  document.querySelectorAll(`.seg[data-id="${state.activeId}"]`).forEach(e => e.classList.add('active'));
}

function clearSegInfo() {
  document.getElementById('segInfo').textContent = 'Vurgulu bir kelime/yapıya tıkla → her iki panelde eş segment aydınlanır · keyboard: ← → gezilebilir';
}

function updateSegInfo(id) {
  const t = TEXTS[state.textKey];
  let leftText = '', rightText = '', tag = '', tagLabel = '';

  for (const p of t.pairs) {
    for (const s of p.left) { if (s.id === id) { leftText = s.text; tag = s.tag || ''; } }
    for (const s of p.right) { if (s.id === id) { rightText = s.text; } }
  }
  if (tag) tagLabel = t.legend[tag] ? ` [${t.legend[tag]}]` : '';

  const info = document.getElementById('segInfo');
  if (leftText) {
    info.innerHTML = `<strong>${esc(tag.toUpperCase())}${esc(tagLabel)}</strong> &nbsp; B1: <em>"${esc(leftText)}"</em> &nbsp;↔&nbsp; A2: <em>"${esc(rightText)}"</em>`;
  }
}

function scrollPairIntoView(id) {
  ['paneLeft','paneRight'].forEach(pid => {
    const pane = document.getElementById(pid);
    const el = pane.querySelector(`.seg[data-id="${id}"]`);
    if (el) {
      const r = el.getBoundingClientRect(), pr = pane.getBoundingClientRect();
      if (r.top < pr.top + 40 || r.bottom > pr.bottom - 20) {
        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }
  });
}

// Keyboard navigation across segments
let allSegIds = [];
function buildSegIds() {
  const t = TEXTS[state.textKey];
  const seen = new Set();
  allSegIds = [];
  t.pairs.forEach(p => p.left.forEach(s => { if (s.id && !seen.has(s.id)) { seen.add(s.id); allSegIds.push(s.id); } }));
}

// ===================== EVENTS =====================
document.getElementById('textSel').addEventListener('change', e => {
  state.textKey = e.target.value; state.activeId = null; save();
  buildSegIds(); renderText();
});
document.getElementById('tagSel').addEventListener('change', e => {
  state.tagFilter = e.target.value; save(); applyTagFilter();
  document.getElementById('tagSel').value = state.tagFilter;
});
document.getElementById('syncBtn').addEventListener('click', () => {
  state.sync = !state.sync; save();
  document.getElementById('syncBtn').classList.toggle('active', state.sync);
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t); state.theme = t; save();
});
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ version: 'comparative-reader-v2', texts: TEXTS, state }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `comparative-reader-v2-${Date.now()}.json`; a.click();
});
document.querySelectorAll('.legend-item').forEach(li => {
  li.addEventListener('click', () => {
    const tag = li.dataset.tag;
    state.tagFilter = (state.tagFilter === tag) ? '' : tag;
    document.getElementById('tagSel').value = state.tagFilter;
    save(); applyTagFilter();
  });
});
document.addEventListener('keydown', e => {
  if (e.key === 'T' || e.key === 't') document.getElementById('themeBtn').click();
  if (e.key === 'S' || e.key === 's') document.getElementById('syncBtn').click();
  if (e.key === 'ArrowRight') {
    const cur = allSegIds.indexOf(state.activeId);
    const next = allSegIds[cur + 1] || allSegIds[0];
    activateSeg(next);
  }
  if (e.key === 'ArrowLeft') {
    const cur = allSegIds.indexOf(state.activeId);
    const prev = allSegIds[cur - 1] || allSegIds[allSegIds.length - 1];
    activateSeg(prev);
  }
});

// Sync scroll
['paneLeft','paneRight'].forEach(pid => {
  document.getElementById(pid).addEventListener('scroll', function() {
    if (!state.sync) return;
    const other = pid === 'paneLeft' ? 'paneRight' : 'paneLeft';
    const otherEl = document.getElementById(other);
    const ratio = this.scrollTop / (this.scrollHeight - this.clientHeight);
    otherEl.scrollTop = ratio * (otherEl.scrollHeight - otherEl.clientHeight);
  });
});

// ===================== INIT =====================
if (state.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
if (state.sync) document.getElementById('syncBtn').classList.add('active');
document.getElementById('tagSel').value = state.tagFilter;
renderTextSelect();
buildSegIds();
renderText();
</script>
</body>
</html>
