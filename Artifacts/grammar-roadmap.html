<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İngilizce Gramer Haritası</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Verdana', Geneva, sans-serif;
    background: #0f0f1a;
    min-height: 100vh;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 20% 50%, rgba(120, 40, 200, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 180, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(255, 80, 120, 0.1) 0%, transparent 50%);
    animation: bgShift 12s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes bgShift {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-3%, 2%) rotate(2deg); }
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 60px;
    animation: fadeDown 0.8s ease both;
  }

  .header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #ff6b9d, #c44dff, #4dc8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .header p {
    color: rgba(255,255,255,0.4);
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Topic Cards */
  .topics-grid {
    display: grid;
    gap: 16px;
  }

  .topic-card {
    border-radius: 16px;
    overflow: hidden;
    animation: fadeUp 0.6s ease both;
  }

  .topic-card:nth-child(1) { animation-delay: 0.1s; }
  .topic-card:nth-child(2) { animation-delay: 0.2s; }
  .topic-card:nth-child(3) { animation-delay: 0.3s; }
  .topic-card:nth-child(4) { animation-delay: 0.4s; }
  .topic-card:nth-child(5) { animation-delay: 0.5s; }
  .topic-card:nth-child(6) { animation-delay: 0.6s; }
  .topic-card:nth-child(7) { animation-delay: 0.7s; }
  .topic-card:nth-child(8) { animation-delay: 0.8s; }
  .topic-card:nth-child(9) { animation-delay: 0.9s; }
  .topic-card:nth-child(10) { animation-delay: 1.0s; }

  .topic-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(10px);
  }

  .topic-header:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.15);
    transform: translateX(4px);
  }

  .topic-card.open .topic-header {
    border-radius: 16px 16px 0 0;
    border-bottom-color: transparent;
  }

  .topic-number {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .topic-titles {
    flex: 1;
  }

  .topic-title-en {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 3px;
  }

  .topic-title-tr {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.5px;
  }

  .topic-badge {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    opacity: 0.8;
  }

  .chevron {
    width: 20px;
    height: 20px;
    color: rgba(255,255,255,0.3);
    transition: transform 0.3s ease;
    flex-shrink: 0;
  }

  .topic-card.open .chevron {
    transform: rotate(180deg);
  }

  /* Content Panel */
  .topic-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(255,255,255,0.08);
    border-top: none;
    border-radius: 0 0 16px 16px;
    background: rgba(0,0,0,0.3);
  }

  .topic-card.open .topic-content {
    max-height: 800px;
  }

  .content-inner {
    padding: 28px 28px 28px 84px;
  }

  .content-desc {
    font-size: 0.88rem;
    line-height: 1.8;
    color: rgba(255,255,255,0.7);
    margin-bottom: 20px;
    border-left: 3px solid;
    padding-left: 16px;
  }

  .examples-title {
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 12px;
    font-weight: 700;
  }

  .examples {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .example-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .example-box {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.82rem;
  }

  .example-en {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff;
    font-style: italic;
  }

  .example-tr {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.5);
  }

  .tip-box {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 0.8rem;
    line-height: 1.7;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .tip-icon { flex-shrink: 0; font-size: 1rem; }

  /* Color themes */
  .c1 .topic-number { background: linear-gradient(135deg, #ff6b9d, #ff4d6d); color: #fff; }
  .c1 .topic-badge { background: rgba(255,107,157,0.15); color: #ff6b9d; border: 1px solid rgba(255,107,157,0.3); }
  .c1 .content-desc { border-color: #ff6b9d; }
  .c1 .tip-box { background: rgba(255,107,157,0.08); border: 1px solid rgba(255,107,157,0.2); color: rgba(255,150,180,0.9); }

  .c2 .topic-number { background: linear-gradient(135deg, #c44dff, #9b36f5); color: #fff; }
  .c2 .topic-badge { background: rgba(196,77,255,0.15); color: #c44dff; border: 1px solid rgba(196,77,255,0.3); }
  .c2 .content-desc { border-color: #c44dff; }
  .c2 .tip-box { background: rgba(196,77,255,0.08); border: 1px solid rgba(196,77,255,0.2); color: rgba(200,150,255,0.9); }

  .c3 .topic-number { background: linear-gradient(135deg, #4dc8ff, #1a9fe0); color: #fff; }
  .c3 .topic-badge { background: rgba(77,200,255,0.15); color: #4dc8ff; border: 1px solid rgba(77,200,255,0.3); }
  .c3 .content-desc { border-color: #4dc8ff; }
  .c3 .tip-box { background: rgba(77,200,255,0.08); border: 1px solid rgba(77,200,255,0.2); color: rgba(150,220,255,0.9); }

  .c4 .topic-number { background: linear-gradient(135deg, #ff9f43, #ee5a24); color: #fff; }
  .c4 .topic-badge { background: rgba(255,159,67,0.15); color: #ff9f43; border: 1px solid rgba(255,159,67,0.3); }
  .c4 .content-desc { border-color: #ff9f43; }
  .c4 .tip-box { background: rgba(255,159,67,0.08); border: 1px solid rgba(255,159,67,0.2); color: rgba(255,200,130,0.9); }

  .c5 .topic-number { background: linear-gradient(135deg, #00d2d3, #01abc4); color: #fff; }
  .c5 .topic-badge { background: rgba(0,210,211,0.15); color: #00d2d3; border: 1px solid rgba(0,210,211,0.3); }
  .c5 .content-desc { border-color: #00d2d3; }
  .c5 .tip-box { background: rgba(0,210,211,0.08); border: 1px solid rgba(0,210,211,0.2); color: rgba(100,230,230,0.9); }

  .c6 .topic-number { background: linear-gradient(135deg, #ff6348, #e84118); color: #fff; }
  .c6 .topic-badge { background: rgba(255,99,72,0.15); color: #ff6348; border: 1px solid rgba(255,99,72,0.3); }
  .c6 .content-desc { border-color: #ff6348; }
  .c6 .tip-box { background: rgba(255,99,72,0.08); border: 1px solid rgba(255,99,72,0.2); color: rgba(255,160,140,0.9); }

  .c7 .topic-number { background: linear-gradient(135deg, #5f27cd, #341f97); color: #fff; }
  .c7 .topic-badge { background: rgba(95,39,205,0.2); color: #a29bfe; border: 1px solid rgba(95,39,205,0.4); }
  .c7 .content-desc { border-color: #a29bfe; }
  .c7 .tip-box { background: rgba(95,39,205,0.1); border: 1px solid rgba(95,39,205,0.3); color: rgba(180,170,255,0.9); }

  .c8 .topic-number { background: linear-gradient(135deg, #00b894, #00a381); color: #fff; }
  .c8 .topic-badge { background: rgba(0,184,148,0.15); color: #00b894; border: 1px solid rgba(0,184,148,0.3); }
  .c8 .content-desc { border-color: #00b894; }
  .c8 .tip-box { background: rgba(0,184,148,0.08); border: 1px solid rgba(0,184,148,0.2); color: rgba(100,220,190,0.9); }

  .c9 .topic-number { background: linear-gradient(135deg, #fd79a8, #e84393); color: #fff; }
  .c9 .topic-badge { background: rgba(253,121,168,0.15); color: #fd79a8; border: 1px solid rgba(253,121,168,0.3); }
  .c9 .content-desc { border-color: #fd79a8; }
  .c9 .tip-box { background: rgba(253,121,168,0.08); border: 1px solid rgba(253,121,168,0.2); color: rgba(255,170,210,0.9); }

  .c10 .topic-number { background: linear-gradient(135deg, #fdcb6e, #e17055); color: #fff; }
  .c10 .topic-badge { background: rgba(253,203,110,0.15); color: #fdcb6e; border: 1px solid rgba(253,203,110,0.3); }
  .c10 .content-desc { border-color: #fdcb6e; }
  .c10 .tip-box { background: rgba(253,203,110,0.08); border: 1px solid rgba(253,203,110,0.2); color: rgba(255,220,150,0.9); }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .footer {
    text-align: center;
    margin-top: 50px;
    color: rgba(255,255,255,0.2);
    font-size: 0.75rem;
    letter-spacing: 1px;
    animation: fadeDown 1s ease 1.2s both;
  }

  @media (max-width: 600px) {
    .content-inner { padding: 20px 20px; }
    .example-row { grid-template-columns: 1fr; }
    .header h1 { font-size: 1.6rem; }
    .topic-badge { display: none; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>İngilizce Gramer Haritası</h1>
    <p>Ana güzergahın dışındaki kritik konular — tıklayarak keşfet</p>
  </div>

  <div class="topics-grid" id="grid"></div>

  <div class="footer">Bir konuya tıkla → detayları gör</div>
</div>

<script>
const topics = [
  {
    color: "c1",
    num: "01",
    en: "Participles",
    tr: "Ortaçlar",
    badge: "Şu an buradayız",
    desc: "Fiilden türeyip sıfat veya zarf gibi görev yapan yapılardır. Present (-ing), Past (V3) ve Perfect (having + V3) olmak üzere üç türü vardır. Passive voice'un kalbi burasıdır.",
    examples: [
      { en: "The sleeping baby is cute.", tr: "Uyuyan bebek sevimli." },
      { en: "Having finished the exam, she left.", tr: "Sınavı bitirip ayrıldı." },
      { en: "A broken window was found.", tr: "Kırık bir pencere bulundu." },
    ],
    tip: "💡 -ing → duyguyu yaratan şey | -ed → duyguyu yaşayan kişi. (boring film ≠ bored I)"
  },
  {
    color: "c2",
    num: "02",
    en: "Gerunds vs Infinitives",
    tr: "İsim-Fiil Yapıları",
    badge: "Çok Karıştırılan",
    desc: "Bazı fiiller arkasına -ing, bazıları to+fiil alır. En kritik kısım: ikisini de alan fiiller anlam değiştirir!",
    examples: [
      { en: "I enjoy swimming.", tr: "Yüzmeyi severim." },
      { en: "I stopped smoking.", tr: "Sigara içmeyi bıraktım." },
      { en: "I stopped to smoke.", tr: "Sigara içmek için durdum." },
    ],
    tip: "💡 stop, remember, forget, try, mean — bu fiillerin arkasına ne geldiğine çok dikkat et."
  },
  {
    color: "c3",
    num: "03",
    en: "Relative Clauses",
    tr: "Sıfat Cümleleri",
    badge: "Ortaçla Akraba",
    desc: "who, which, that, whose, whom kullanarak bir ismi cümleyle nitelersin. Ortaç gibi çalışır ama daha uzun ve detaylı bilgi verir.",
    examples: [
      { en: "The man who called you is outside.", tr: "Seni arayan adam dışarıda." },
      { en: "The book whose cover is red is mine.", tr: "Kapağı kırmızı olan kitap benim." },
      { en: "This is the city where I was born.", tr: "Bu doğduğum şehir." },
    ],
    tip: "💡 Defining (virgülsüz) = olmadan anlam değişir. Non-defining (virgüllü) = ek bilgi verir."
  },
  {
    color: "c4",
    num: "04",
    en: "Conditionals",
    tr: "Koşul Cümleleri",
    badge: "4 Tip",
    desc: "0, 1, 2 ve 3. tip koşullar. Gerçek ve gerçek dışı durumları anlatmak için kullanılır. 3. tip özellikle geçmişe yönelik pişmanlık ifade eder.",
    examples: [
      { en: "If I study, I pass. (0. tip)", tr: "Çalışırsam geçerim." },
      { en: "If I studied, I would pass. (2. tip)", tr: "Çalışsaydım geçerdim." },
      { en: "If I had studied, I would have passed. (3. tip)", tr: "Çalışmış olsaydım geçmiş olurdum." },
    ],
    tip: "💡 Mixed conditional: geçmiş koşul + şimdiki sonuç. If I had slept, I would feel better now."
  },
  {
    color: "c5",
    num: "05",
    en: "Inversion",
    tr: "Devrik Cümle",
    badge: "Vurgu Sanatı",
    desc: "Vurgu veya resmiyet için özne-yardımcı fiil yer değiştirir. Edebi metinlerde ve resmi konuşmalarda çok yaygındır. Olumsuz bir zarf cümle başına geldiğinde zorunlu olur.",
    examples: [
      { en: "Never have I seen such a thing.", tr: "Böyle bir şey hiç görmedim." },
      { en: "Not only did he lie, but he also stole.", tr: "Sadece yalan söylemekle kalmadı, çaldı da." },
      { en: "Rarely does she complain.", tr: "Nadiren şikayet eder." },
    ],
    tip: "💡 Tetikleyici kelimeler: Never, Rarely, Not only, Hardly, Only then, No sooner..."
  },
  {
    color: "c6",
    num: "06",
    en: "Causative Structures",
    tr: "Ettirgen Yapılar",
    badge: "have / get / make",
    desc: "Bir işi başkasına yaptırmayı anlatır. have, get, make, let fiilleriyle kurulur. Her birinin ince farkı vardır.",
    examples: [
      { en: "I had my car repaired.", tr: "Arabamı tamir ettirdim." },
      { en: "She got him to apologize.", tr: "Onu özür dilettti." },
      { en: "He made me cry.", tr: "Beni ağlattı." },
    ],
    tip: "💡 have/make + nesne + V1 | get + nesne + to+V1 | have + nesne + V3 (passive anlam)"
  },
  {
    color: "c7",
    num: "07",
    en: "Subjunctive Mood",
    tr: "Dilek Kipi",
    badge: "Gizli Kalan",
    desc: "Öneri, istek, zorunluluk cümlelerinde fiilin yalın halde kullanılmasıdır. Türkçede çok doğal hissettiren bu yapı İngilizce öğreticilerinin sıkça atladığı bir konudur.",
    examples: [
      { en: "I suggest that he be present.", tr: "Orada bulunmasını öneriyorum." },
      { en: "It is essential that she submit the form.", tr: "Formu teslim etmesi şarttır." },
      { en: "The doctor insisted that he rest.", tr: "Doktor dinlenmesi konusunda ısrar etti." },
    ],
    tip: "💡 suggest, recommend, insist, demand, require + that + özne + V1 (yalın fiil)"
  },
  {
    color: "c8",
    num: "08",
    en: "Nominalization",
    tr: "Fiil/Sıfatları İsme Dönüştürme",
    badge: "Akademik Dil",
    desc: "Fiil ve sıfatlardan isim türetme sanatı. Akademik yazı, iş dünyası ve resmi dilde cümleleri çok daha güçlü kılar.",
    examples: [
      { en: "decide → decision", tr: "karar vermek → karar" },
      { en: "The decision to leave was difficult.", tr: "Ayrılma kararı zordu." },
      { en: "important → importance of education", tr: "eğitimin önemi" },
    ],
    tip: "💡 -tion, -ment, -ance, -ness, -ity ekleri en yaygın nominalization sonekleridir."
  },
  {
    color: "c9",
    num: "09",
    en: "Cleft Sentences",
    tr: "Bölünmüş Vurgu Cümleleri",
    badge: "Vurgu Yapısı",
    desc: "Cümlenin bir unsurunu öne çıkarmak için kullanılan özel yapılardır. 'It was... that/who' kalıbıyla çalışır.",
    examples: [
      { en: "It was John who broke the window.", tr: "Pencereyi kıran Johndı." },
      { en: "It is money that they need.", tr: "İhtiyaç duydukları şey paradır." },
      { en: "What I need is a long holiday.", tr: "İhtiyacım olan şey uzun bir tatildir." },
    ],
    tip: "💡 'What I want is...' yapısı da cleft cümledir — çok doğal ve akıcı hissettirir."
  },
  {
    color: "c10",
    num: "10",
    en: "Ellipsis & Substitution",
    tr: "Eksiltili Yapılar",
    badge: "Doğal Konuşma",
    desc: "Tekrarı önlemek için cümle parçalarını silme veya yerine koyma sanatı. Doğal ve akıcı İngilizce için şarttır.",
    examples: [
      { en: "— Did you finish? — Yes, I did.", tr: "— Bitirdin mi? — Evet." },
      { en: "She can swim and so can he.", tr: "O yüzebilir, o da öyle." },
      { en: "I wanted to go but decided not to.", tr: "Gitmek istedim ama gitmemeye karar verdim." },
    ],
    tip: "💡 'so do I / neither do I / I did too / I didn't either' — günlük konuşmada çok kullanılır."
  }
];

const grid = document.getElementById('grid');

topics.forEach((t, i) => {
  const card = document.createElement('div');
  card.className = `topic-card ${t.color}`;
  card.innerHTML = `
    <div class="topic-header" onclick="toggle(this)">
      <div class="topic-number">${t.num}</div>
      <div class="topic-titles">
        <div class="topic-title-en">${t.en}</div>
        <div class="topic-title-tr">${t.tr}</div>
      </div>
      <div class="topic-badge">${t.badge}</div>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>
    <div class="topic-content">
      <div class="content-inner">
        <p class="content-desc">${t.desc}</p>
        <div class="examples-title">Örnekler</div>
        <div class="examples">
          ${t.examples.map(ex => `
            <div class="example-row">
              <div class="example-box example-en">${ex.en}</div>
              <div class="example-box example-tr">${ex.tr}</div>
            </div>
          `).join('')}
        </div>
        <div class="tip-box">
          <span class="tip-icon">⚡</span>
          <span>${t.tip}</span>
        </div>
      </div>
    </div>
  `;
  grid.appendChild(card);
});

function toggle(header) {
  const card = header.parentElement;
  const isOpen = card.classList.contains('open');
  document.querySelectorAll('.topic-card.open').forEach(c => c.classList.remove('open'));
  if (!isOpen) card.classList.add('open');
}
</script>
</body>
</html>
