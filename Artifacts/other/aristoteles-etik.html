<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aristoteles — Etik Külliyatı</title>
<style>
:root {
  --bg: #06101f;
  --bg2: #0a1828;
  --bg3: #0e2040;
  --card: rgba(12,28,68,0.65);
  --card2: rgba(18,42,100,0.55);
  --border: rgba(70,140,255,0.18);
  --border2: rgba(70,140,255,0.45);
  --b1: #4da8ff;
  --b2: #00caff;
  --b3: #1466e8;
  --text: #d8eaff;
  --text2: #7a98cc;
  --text3: #3d5888;
  --gold: #f0c060;
  --gold2: #d4960a;
  --green: #00d4a0;
  --red: #ff6080;
  --fn: 'Verdana', Geneva, sans-serif;
}
[data-theme="light"] {
  --bg: #eef3ff;
  --bg2: #dce8ff;
  --bg3: #c8daff;
  --card: rgba(200,220,255,0.55);
  --card2: rgba(180,210,255,0.7);
  --border: rgba(30,80,200,0.18);
  --border2: rgba(30,80,200,0.45);
  --text: #071430;
  --text2: #2a4070;
  --text3: #6078a8;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--fn);background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;line-height:1.75}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(6,16,31,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2rem}
[data-theme="light"] nav{background:rgba(238,243,255,0.92)}
.nav-inner{display:flex;align-items:center;gap:1rem;max-width:1400px;margin:0 auto;height:56px;overflow-x:auto}
.nav-logo{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--b1);white-space:nowrap;margin-right:.5rem;text-transform:uppercase}
.nav-logo span{color:var(--gold)}
.nav-tabs{display:flex;gap:.15rem;flex:1;overflow-x:auto}
.nav-tabs::-webkit-scrollbar{height:2px}
.nav-tabs::-webkit-scrollbar-thumb{background:var(--b3)}
.tab-btn{background:none;border:none;color:var(--text2);font-family:var(--fn);font-size:.68rem;padding:.4rem .7rem;cursor:pointer;border-radius:6px;white-space:nowrap;transition:all .2s;border-bottom:2px solid transparent}
.tab-btn:hover{color:var(--text);background:var(--card)}
.tab-btn.active{color:var(--b1);border-bottom-color:var(--b1);background:rgba(77,168,255,0.07)}
.theme-btn{background:var(--card);border:1px solid var(--border);color:var(--text2);font-size:.75rem;padding:.3rem .6rem;border-radius:6px;cursor:pointer;white-space:nowrap;margin-left:auto;flex-shrink:0}
.theme-btn:hover{border-color:var(--b1);color:var(--b1)}

/* LAYOUT */
main{max-width:1400px;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.page{display:none;animation:fadeIn .4s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* HERO */
.hero{text-align:center;padding:3rem 1rem 2.5rem;position:relative}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 20%,rgba(30,80,200,0.2),transparent);pointer-events:none}
.hero-eyebrow{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--b2);margin-bottom:.8rem}
.hero-title{font-size:2rem;font-weight:700;line-height:1.25;background:linear-gradient(135deg,var(--b2),var(--b1),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1rem}
.hero-sub{font-size:.82rem;color:var(--text2);max-width:720px;margin:0 auto 1.5rem;line-height:1.85}
.hero-badge{display:inline-flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.badge{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:.3rem .85rem;font-size:.67rem;color:var(--text2);letter-spacing:.06em}

/* CARDS */
.grid{display:grid;gap:1rem}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.4rem 1.6rem;transition:border-color .25s,background .25s}
.card:hover{border-color:var(--border2);background:var(--card2)}
.card-icon{font-size:1.4rem;margin-bottom:.6rem}
.card-title{font-size:.78rem;font-weight:700;color:var(--b1);margin-bottom:.5rem;letter-spacing:.04em;text-transform:uppercase}
.card-body{font-size:.77rem;color:var(--text2);line-height:1.9}
.card-body em{color:var(--gold);font-style:normal}
.card-body strong{color:var(--text);font-size:.75rem}

/* SECTION */
.section{margin:2.5rem 0}
.section-title{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--b2);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.section-h2{font-size:1.25rem;font-weight:700;color:var(--text);margin-bottom:.5rem}
.section-lead{font-size:.8rem;color:var(--text2);max-width:800px;line-height:1.9;margin-bottom:1.5rem}

/* SPINE / FLOWCHART */
.spine{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0;margin:2rem auto;max-width:900px}
.spine-node{background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:.7rem 1.1rem;text-align:center;min-width:110px;position:relative}
.spine-node .greek{font-size:.65rem;color:var(--b2);letter-spacing:.05em;display:block}
.spine-node .latin{font-size:.73rem;font-weight:700;color:var(--text);display:block;margin:.15rem 0}
.spine-node .tr{font-size:.6rem;color:var(--text2)}
.spine-arrow{color:var(--b1);font-size:1.1rem;padding:.2rem .1rem;flex-shrink:0}

/* BOOK ACCORDION */
.book-list{display:flex;flex-direction:column;gap:.5rem}
.book-item{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.book-header{display:flex;align-items:center;gap.8rem;padding:1rem 1.2rem;cursor:pointer;user-select:none;transition:background .2s}
.book-header:hover{background:var(--card2)}
.book-num{background:linear-gradient(135deg,var(--b3),var(--b1));color:#fff;font-size:.65rem;font-weight:700;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:.8rem}
.book-name{font-size:.8rem;font-weight:700;color:var(--text);flex:1}
.book-gr{font-size:.65rem;color:var(--text2);margin-left:.5rem}
.book-toggle{color:var(--text3);font-size:.75rem;transition:transform .25s}
.book-item.open .book-toggle{transform:rotate(180deg)}
.book-content{display:none;padding:1.2rem 1.5rem;font-size:.76rem;color:var(--text2);line-height:1.95;border-top:1px solid var(--border)}
.book-item.open .book-content{display:block}
.book-content p{margin-bottom:.8rem}
.book-content em{color:var(--gold);font-style:normal}
.book-content strong{color:var(--b1)}
.book-content blockquote{border-left:2px solid var(--b1);padding-left:1rem;margin:1rem 0;color:var(--text);font-style:italic;font-size:.74rem}

/* PHILOSOPHER TABS */
.phil-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.phil-tab{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.5rem 1rem;font-size:.72rem;cursor:pointer;color:var(--text2);font-family:var(--fn);transition:all .2s}
.phil-tab.active{border-color:var(--gold);color:var(--gold);background:rgba(240,192,96,0.08)}
.phil-pane{display:none}
.phil-pane.active{display:block}
.phil-header{display:flex;flex-wrap:wrap;align-items:flex-start;gap:1.5rem;margin-bottom:1.5rem;padding:1.5rem;background:var(--card);border:1px solid var(--border);border-radius:14px}
.phil-meta{flex:1;min-width:200px}
.phil-name{font-size:1.15rem;font-weight:700;color:var(--gold);margin-bottom:.2rem}
.phil-dates{font-size:.68rem;color:var(--text3);margin-bottom:.5rem}
.phil-desc{font-size:.73rem;color:var(--text2);line-height:1.8}
.phil-works{background:var(--bg3);border-radius:8px;padding:.8rem 1rem;min-width:200px}
.phil-works-title{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--b1);margin-bottom:.5rem}
.phil-work-item{font-size:.68rem;color:var(--text2);margin-bottom:.25rem}
.phil-work-item em{color:var(--gold);font-style:italic}

/* RELATION MAP */
.rel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.rel-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.3rem;border-top:3px solid var(--b1)}
.rel-card.gold-top{border-top-color:var(--gold)}
.rel-card.green-top{border-top-color:var(--green)}
.rel-card.red-top{border-top-color:var(--red)}
.rel-title{font-size:.75rem;font-weight:700;color:var(--text);margin-bottom:.3rem}
.rel-gr{font-size:.63rem;color:var(--text3);margin-bottom:.6rem}
.rel-body{font-size:.73rem;color:var(--text2);line-height:1.85}
.rel-body em{color:var(--b1);font-style:normal}
.rel-body strong{color:var(--gold)}

/* COMPARE TABLE */
.ctable{width:100%;border-collapse:collapse;font-size:.71rem;margin-top:1rem}
.ctable th{background:var(--bg3);color:var(--b1);text-align:left;padding:.7rem .9rem;font-weight:700;font-size:.65rem;letter-spacing:.07em;border:1px solid var(--border)}
.ctable td{border:1px solid var(--border);padding:.6rem .9rem;color:var(--text2);vertical-align:top}
.ctable tr:nth-child(even) td{background:rgba(10,25,60,0.3)}
[data-theme="light"] .ctable tr:nth-child(even) td{background:rgba(100,150,255,0.07)}
.ctable td em{color:var(--gold);font-style:normal}

/* QUOTE */
.aquote{background:rgba(77,168,255,0.06);border:1px solid var(--border);border-left:3px solid var(--b1);border-radius:0 10px 10px 0;padding:1rem 1.4rem;margin:1rem 0;font-size:.76rem;color:var(--text);line-height:2;font-style:italic}
.aquote cite{display:block;margin-top:.5rem;font-size:.65rem;color:var(--text3);font-style:normal;letter-spacing:.05em}
.gquote{background:rgba(240,192,96,0.06);border:1px solid rgba(240,192,96,0.2);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:1rem 1.4rem;margin:1rem 0;font-size:.76rem;color:var(--text);line-height:2}
.gquote cite{display:block;margin-top:.5rem;font-size:.65rem;color:var(--text3);font-style:normal}

/* KEYWORD PILL */
.kw{display:inline-block;background:rgba(77,168,255,0.12);border:1px solid rgba(77,168,255,0.25);border-radius:4px;padding:.1rem .4rem;font-size:.64rem;color:var(--b1);margin:.1rem}
.kw-gold{background:rgba(240,192,96,0.1);border-color:rgba(240,192,96,0.3);color:var(--gold)}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:2rem 0}

/* PROPOSITION CARD */
.prop{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.3rem 1.6rem;display:flex;gap:1rem;align-items:flex-start;transition:border-color .2s}
.prop:hover{border-color:var(--border2)}
.prop-num{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,var(--b2),var(--b1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0;line-height:1;margin-top:.1rem}
.prop-body{flex:1}
.prop-title{font-size:.8rem;font-weight:700;color:var(--text);margin-bottom:.4rem}
.prop-gr{font-size:.65rem;color:var(--b2);margin-bottom:.4rem;letter-spacing:.03em}
.prop-text{font-size:.75rem;color:var(--text2);line-height:1.9}
.prop-text em{color:var(--gold);font-style:normal}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b3);border-radius:3px}

/* RESPONSIVE */
@media(max-width:640px){
  .hero-title{font-size:1.35rem}
  .spine{gap:.2rem}
  .spine-node{min-width:80px;padding:.5rem .6rem}
  main{padding:1.5rem 1rem 3rem}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-logo">Ἀριστοτέλης &nbsp;<span>Etik</span></div>
    <div class="nav-tabs" id="navTabs"></div>
    <button class="theme-btn" id="themeBtn">☀ Açık</button>
  </div>
</nav>

<main>
  <div id="home" class="page"></div>
  <div id="nikomakhos" class="page"></div>
  <div id="eudemus" class="page"></div>
  <div id="magna" class="page"></div>
  <div id="baginti" class="page"></div>
  <div id="islam" class="page"></div>
</main>

<script>
// ======================= ROUTER =======================
const TABS = [
  {id:'home',    label:'🏛 Ana Çerçeve'},
  {id:'nikomakhos', label:'📜 Nikomakhos\'a Etik'},
  {id:'eudemus', label:'📚 Eudemus\'a Etik'},
  {id:'magna',   label:'📗 Magna Moralia'},
  {id:'baginti', label:'🔗 Eserler Arası Bağıntı'},
  {id:'islam',   label:'☪ İslam Filozofları'},
];

function buildNav(){
  const nav = document.getElementById('navTabs');
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.className='tab-btn'; b.dataset.page=t.id; b.textContent=t.label;
    b.onclick=()=>goTo(t.id);
    nav.appendChild(b);
  });
}

function goTo(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));
  window.scrollTo({top:0,behavior:'smooth'});
}

// THEME
const themeBtn = document.getElementById('themeBtn');
let dark = true;
themeBtn.onclick=()=>{
  dark=!dark;
  document.documentElement.dataset.theme = dark?'dark':'light';
  themeBtn.textContent = dark?'☀ Açık':'🌙 Koyu';
};

// ACCORDION
function initAccordion(){
  document.querySelectorAll('.book-header').forEach(h=>{
    h.onclick=()=>{
      const item = h.closest('.book-item');
      item.classList.toggle('open');
    };
  });
}

// PHIL TABS
function initPhilTabs(){
  document.querySelectorAll('.phil-tab').forEach(t=>{
    t.onclick=()=>{
      const group = t.closest('.phil-tabs').dataset.group;
      document.querySelectorAll(`[data-group="${group}"] .phil-tab`).forEach(x=>x.classList.remove('active'));
      document.querySelectorAll(`[data-phil="${group}"]`).forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById(t.dataset.target).classList.add('active');
    };
  });
}

// ======================= PAGE: HOME =======================
document.getElementById('home').innerHTML = `
<div class="hero">
  <div class="hero-eyebrow">Stageira, M.Ö. 384 — Khalkis, M.Ö. 322</div>
  <h1 class="hero-title">Etik Külliyatının<br>Büyük Çerçevesi</h1>
  <p class="hero-sub">
    "İnsan için iyinin ne olduğunu araştırmak, yalnızca temaşa etmek için değil, eyleme geçmek için bir ilimdir.
    Zira bilmek yetmez; bilgiyi hayata geçirmek ve bilgiden hareketle iyi insanlar olmak isteriz."
    Bu rehberde söz alan ben, Aristoteles'im; etik üzerine kaleme aldığım külliyatı, kendi sesimle sunuyorum.
  </p>
  <div class="hero-badge">
    <span class="badge">Nikomakhos'a Etik (ΗΝ)</span>
    <span class="badge">Eudemus'a Etik (ΗΕ)</span>
    <span class="badge">Magna Moralia (ΜΜ)</span>
    <span class="badge">M.Ö. 4. Yüzyıl Atina</span>
  </div>
</div>

<div class="section">
  <div class="section-title">Omurga — Kavramsal Akış</div>
  <p class="section-lead">Etik külliyatımın merkezinde duran kavramsal zincir aşağıdaki gibi okunabilir.
  Her halka, bir öncekini zorunlu kılarak sonrakini mümkün kılar; telos'tan kopuk hiçbir kavram anlaşılamaz.</p>
  <div class="spine">
    <div class="spine-node"><span class="greek">ἀγαθόν</span><span class="latin">Agathon</span><span class="tr">İyi — Gaye</span></div>
    <div class="spine-arrow">→</div>
    <div class="spine-node"><span class="greek">εὐδαιμονία</span><span class="latin">Eudaimonia</span><span class="tr">Mutluluk — Refah</span></div>
    <div class="spine-arrow">→</div>
    <div class="spine-node"><span class="greek">ἀρετή</span><span class="latin">Aretê</span><span class="tr">Erdem — Fazilet</span></div>
    <div class="spine-arrow">→</div>
    <div class="spine-node"><span class="greek">φρόνησις</span><span class="latin">Phronesis</span><span class="tr">Pratik Hikmet</span></div>
    <div class="spine-arrow">→</div>
    <div class="spine-node"><span class="greek">πόλις</span><span class="latin">Polis</span><span class="tr">Şehir — Toplum</span></div>
    <div class="spine-arrow">→</div>
    <div class="spine-node"><span class="greek">θεωρία</span><span class="latin">Theoria</span><span class="tr">Nazari Hayat</span></div>
  </div>
</div>

<div class="section">
  <div class="section-title">Altı Temel Önerme</div>
  <div class="grid grid-2" style="gap:.8rem">

    <div class="prop">
      <div class="prop-num">1</div>
      <div class="prop-body">
        <div class="prop-title">Her Şeyin Yöneldiği Nihai Gaye</div>
        <div class="prop-gr">πᾶσα τέχνη καὶ πᾶσα μέθοδος... ἀγαθοῦ τινος ἐφίεσθαι δοκεῖ</div>
        <div class="prop-text">Her sanat, her araştırma, her eylem ve her seçim, bir iyiyi hedefler görünür. Bu nedenle <em>iyi</em>, tüm şeylerin nihai yöneldiği şey diye güzelce tanımlanmıştır. Ancak iyiler arasında bir hiyerarşi mevcuttur: kimileri araçsal, kimileri ise kendileri için arzu edilir. İşte bu ikinci türün doruk noktasında <em>eudaimonia</em> durur.</div>
      </div>
    </div>

    <div class="prop">
      <div class="prop-num">2</div>
      <div class="prop-body">
        <div class="prop-title">Eudaimonia: Tam ve Yetkin Faaliyet</div>
        <div class="prop-gr">εὐδαιμονία ψυχῆς ἐνέργεια κατ' ἀρετήν</div>
        <div class="prop-text">Mutluluk ne duygu ne de pasif bir hal değil, <em>ruhun erdem ile uyumlu faaliyetidir</em>. Erdemli olmak yeterli değil; erdemce eylemek gerekir; tıpkı güzel bir bedene sahip olmakla güzel görünmek arasındaki fark gibi. Bunun yanı sıra tam bir hayat süresi gerekir: bir günlük erdem yeterli değildir.</div>
      </div>
    </div>

    <div class="prop">
      <div class="prop-num">3</div>
      <div class="prop-body">
        <div class="prop-title">Erdem İtiyad ile Kazanılır</div>
        <div class="prop-gr">αἱ ἀρεταὶ γίνονται ἐξ ἔθους — ἠθική ἀπὸ τοῦ ἔθους</div>
        <div class="prop-text">Ahlaki erdem ne doğadan gelir ne de doğaya aykırıdır; <em>itiyad (alışkanlık)</em> yoluyla elde edilir. Adil eylemler yaparak adil, cesur eylemler yaparak cesur oluruz. Ethik kelimesi bile ethos'tan, yani alışkanlıktan türer. Karakteri şekillendiren de çocukluktan itibaren edinilen <em>itiyatlar</em> bütünüdür.</div>
      </div>
    </div>

    <div class="prop">
      <div class="prop-num">4</div>
      <div class="prop-body">
        <div class="prop-title">Orta Yol: Mesotes Doktrini</div>
        <div class="prop-gr">ἡ ἀρετὴ μεσότης τίς ἐστιν</div>
        <div class="prop-text">Erdem, iki uç arasındaki <em>orta yol</em>dur. Hem kendiliğindeki orta (matematiksel orta) değil, <em>bize göre orta</em>: fazla ile eksik arasında, bireye ve duruma göre değişen dengeli nokta. Cesaret, korkaklık ile pervasızlığın; cömertlik, cimrilik ile savurganlığın arasındaki erdeme karşılık gelir.</div>
      </div>
    </div>

    <div class="prop">
      <div class="prop-num">5</div>
      <div class="prop-body">
        <div class="prop-title">Phronesis: Erdem ve Aklın Kesişimi</div>
        <div class="prop-gr">οὐκ ἔστιν ἀγαθὸς ἄνευ φρονήσεως</div>
        <div class="prop-text">Hiç kimse <em>phronesis</em> (pratik bilgelik) olmaksızın gerçek anlamda erdemli olamaz; phronesis de ahlaki erdem olmaksızın işleyemez. Phronesis, değişken ve tikel olan pratik alanda <em>doğru öncül ve doğru arzuyu</em> bir arada tutarak harekete geçiren entelektüel erdemdir. O, bilimsel zorunlulukla değil, var olabildiği gibi de olabilirle ilgilenir.</div>
      </div>
    </div>

    <div class="prop">
      <div class="prop-num">6</div>
      <div class="prop-body">
        <div class="prop-title">Theoria: İnsana Özgü En Yüce Hayat</div>

        <p>Dostluk (φιλία), bir erdem ya da erdemle birlikte olan bir şeydir ve hayat için zorunludur. Hiç kimse dost olmaksızın yaşamayı tercih etmez; hatta zenginlerin, yöneticilerin ve egemen olanların bile dostluğa ihtiyacı vardır. Varlıklı olduğunuzda dostluğa ne gerek var denilemez; zira varlık, iyilik yapmak için kullanılabilmeli, bunu yapabilmek için de dosta ihtiyaç vardır.</p>
        <p><em>Dostluğun Üç Türü:</em></p>

        <p><strong>3. Erdem Dostluğu (Agathos):</strong> Birbirlerini iyi ve birbirlerine benzer oldukları için seven, her ikisinin de kendi başına iyi olduğu kişiler arasındaki dostluktur. Bu tür dostluk kalıcıdır; zira her iki taraf da iyi niteliğini sürdürür. İşte bu gerçek dostluktur; diğerleri yalnızca benzerliği bakımından dostluk adını alır.</p>

        <p><em>Saf ve En Yüce Mutluluk — Theoria:</em> Eğer eudaimonia, erdemle uyumlu faaliyet ise, o zaman en yüce erdemle uyumlu faaliyet en yüce mutluluğu verecektir. Bu da <em>nous</em> ile uyumlu <em>theoria</em>'dır. Theoria, kesintisiz sürdürülebilir en yüksek etkinliktir; zira zihinsel yorgunluk bedensel yorgunluktan yavaş gelir. Theoria, hiçbir pratik amaca hizmet etmez; değeri kendindedir. Anaksagoras ve Thalês bu tür hayatın temsilcileridir; pratik açıdan naif görünebilirler, ama ilahi olanı tanımaları bakımından bilgesidir.</p>
        <p>İnsan olarak salt theoria yapabilmek için tanrısal bir doğaya ihtiyaç vardır. Ancak en iyiyi hedeflemek ve olduğunuzdan fazlasını olmaya çalışmak gerekir. "İnsan olduğun için insan düşün!" diyenlere kulak vermemeli; ölümsüzü olabildiğince yaşatmalısın.</p>

        <blockquote>İnsan ölçüsünde yaşamak değil, içindeki en ilahi olana göre yaşamak gerekir. Zira o, her ne kadar küçük olsa da güç ve değer bakımından her şeyin üzerindedir.</blockquote>

</div>

        etik öğretisine katkım, öncelikle <em>nefs (ruh) psikolojisi</em>ni derinleştirmek
        ve <em>aşk (işk) metafiziğini</em> ahlaki yetkinleşmenin zirve noktası olarak sunmak
        üzerine kuruludur.
      </div>
    </div>
    <div class="phil-works">
      <div class="phil-works-title">Temel Eserler</div>
      <div class="phil-work-item"><em>eş-Şifâ</em> — İlahiyyât bölümü</div>
      <div class="phil-work-item"><em>en-Necât</em> — Kurtarış</div>
      <div class="phil-work-item"><em>Risâle fi'l-Ahlâk</em> — Ahlak Üzerine</div>
      <div class="phil-work-item"><em>el-İşârât ve't-Tenbîhât</em> — İşaretler</div>
    </div>
  </div>

  <div class="gquote">
    "Bil ki nefs, her ne kadar bedene taalluk etse de özü itibarıyla bedenden bağımsız bir cevherdir.
    Ahlakî kemâl, bu cevherin kendi özüne dönmesi ve Faâl Akıl ile ittisâl kurmasıdır.
    Aristoteles 'theoria' dedi; ben buna 'mükâşefe' ve 'ittisâl' derim."
    <cite>İbn Sînâ — el-İşârât ve't-Tenbîhât, Kısım IX (Makâmât)</cite>
  </div>

  <div class="section">
    <div class="section-title">Aristoteles'in Psikolojisini Derinleştirme</div>
    <div class="grid grid-2" style="gap:.8rem">
      <div class="card">
        <div class="card-title">Nefs Tahlili — De Anima'nın Genişletilmesi</div>
        <div class="card-body">
          Aristoteles'in ruh üçlüsünü (bitkisel, hayvanî, natıka) devraldım; ancak <em>Uçan Adam</em>
          (el-İnsânü't-Tâir) düşünce deneyimiyle ruhun bedensel olmayan, öz-bilgili bir cevher
          olduğunu kanıtladım. Bedeninden soyutlanmış, duyulardan yoksun biri bile kendisinin
          var olduğunu bilir: bu saf nefs (nefs-i nâtıka) hem Aristoteles'i hem de onun sınırlarını gösterir.
          Aristoteles'in ruhsal kuvvelerini <em>on kuvveye</em> kadar ayrıntılandırdım.
        </div>
      </div>
      <div class="card">
        <div class="card-title">Aklın Mertebeleri — Aristoteles'in İzinde</div>
        <div class="card-body">
          Aristoteles'in <em>nous</em> analizini (De Anima III) geliştirerek dört akıl mertebesi
          kurdum: <em>Heyulânî Akıl</em> (salt kapasite), <em>Müleke Akıl</em> (ilk ilkelere sahip),
          <em>Bil-Fiil Akıl</em> (fiilî kavrama), <em>Müstefad Akıl</em> (Faâl Akıl'dan taşan ilim).
          Etik açısından en yüksek ahlakî kemâl, Müstefad Akıl aşamasına ulaşmak demektir;
          bu da tam anlamıyla Aristoteles'in <em>theoria</em>sının içselleştirilmesidir.
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Ahlak Anlayışım — Aristoteles'ten Farklılaşma</div>
    <div class="card" style="margin-bottom:1rem">
      <div class="card-title">İşk (Aşk) Metafiziği Olarak Ahlak</div>
      <div class="card-body">
        Aristoteles, eudaimonia'yı rasyonel faaliyetle özdeşleştirdi. Ben bunu kabul etmekle birlikte,
        ahlaki yetkinleşmenin nihai noktasını <em>işk</em> (ilahî aşk) kavramıyla tanımladım.
        Her varlık, kendi kemâlini arzular; bu arzu en nihayetinde Tanrı'ya yönelir.
        <em>Risâle fi'l-Aşk</em>'ta bu argümanı geliştirdim: aşk evrensel bir ilkedir,
        yalnızca insana özgü değil. Aristoteles'in <em>eros</em>'u (ΗΝ'de yalnızca bir tür philia
        olarak konu edilir) benim sistemimde evrensel bir ontolojik prensibe dönüşür.
        <br><br>
        Ahlakî erdemler (ahlâk-ı hamîde), nefsin ilahî akılla ilişkisinin önünü açar.
        Aristoteles'in mesotes doktrini geçerliliğini korur; ama nihai hedef artık salt eudaimonia
        değil, <em>kurbet-i ilahî</em> (Tanrı'ya yakınlık) ve nefsin ebedî yetkinliğidir.
        Ölüm sonrası nefs yaşamaya devam eder; Aristoteles bu konuda belirsizdir, ben ise
        nefsin bekāsını felsefî olarak kanıtlarım.
      </div>
    </div>
  </div>

  <div class="section">

    <div class="grid grid-2" style="gap:.8rem">

      <div class="phil-desc">
        Ben "el-Şârih" — Yorumcu'yum. Aristoteles'i ne Fârâbî gibi Neoplatoncu tahrîfle
        ne de İbn Sînâ gibi mistik bir örtüyle sunmak istemiyorum. Aristoteles'e olan borcum şudur:

  <div class="gquote">
    "Aristoteles'i yanlış anlayanlara şunu söylerim: Felsefe hakikati araştırma sanatıdır
    ve hakikat, kendi kendisiyle çelişmez. Aristoteles'in söylediğini anlamak için
    önce dili anlayın; yanlış çeviri ve yanlış yorumun zararı, anlaşılmamaktan büyüktür.
    Ben onu olduğu gibi sunmaya çalışırım."
    <cite>İbn Rüşd — Telhîsü'l-Ahlâk, Önsöz</cite>

  <div class="section">
    <div class="section-title">Aristoteles'i Kurtarma Projesi</div>
    <div class="card" style="margin-bottom:1rem">
      <div class="card-title">Fârâbî ve İbn Sînâ'ya Yönelik Eleştiriler</div>
      <div class="card-body">
        Fârâbî, Aristoteles'i Platon'a yakınlaştırmak için sudûr teorisini içeri sokmuş; oysa
        Aristoteles sudûru reddeder. <em>Faâl Akıl</em>'ı kozmik bir ilke olarak sunmak Aristoteles'e
        aykırıdır; o, faâl aklı (nous poiêtikos) bireysel ruhun bir kuvvesi olarak konumlandırır —
        en azından yorumum bu yöndedir. İbn Sînâ ise nefsin bedenî bağımsızlığını öyle ileri
        götürmüştür ki Aristoteles'in hylomorfik (madde-form) insan anlayışını ortadan kaldırmıştır.
        Ben hylomorfizme bağlı kalırım: nefs, bedenin formu olarak var olur; Aristoteles bunu açıkça söyler.
        <br><br>
        Etik açısından: Aristoteles'in <em>theoria</em>sı, tasavvuf neşvesiyle karıştırılmamalıdır.
        Theoria, aklın en yüce faaliyetidir; ilahî bir aşkın pasif temaşası değil, <em>aktif ve rasyonel
        kavramanın</em> doruk noktasıdır.
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Telhîsü'l-Ahlâk — ΗΝ Yorumunun Ana Hatları</div>
    <div class="book-list">
      <div class="book-item">
        <div class="book-header">
          <div class="book-num">I</div>
          <div class="book-name">Saâdet ve Hayır Üzerine — İbn Rüşd'ün Yorumu</div>
          <div class="book-toggle">▾</div>
        </div>
        <div class="book-content">
          <p>Aristoteles der ki her sanat ve her araştırma bir hayrı hedefler. Ben buna şunu eklerim:
          hayırların en yücesi, yalnızca başkası için değil, kendi için istenen şeydir. Aristoteles'in
          bu temel önermesini olduğu gibi kabul ederim; zira bu, aklın doğal işleyişinin gözleminden
          çıkan bir gerçektir.</p>
          <p>Saâdetin tanımında ise Aristoteles'e tamamen sadık kalırım: <em>ruhun erdemle uyumlu faaliyeti.</em>
          Bu tanım, İbn Sînâ'nın nefsin ölümsüzlüğüyle ya da Fârâbî'nin peygamberlik teorisiyle
          değiştirilmemelidir. Aristoteles burada dünyevî saâdeti kastetmektedir; ötedünya meselesi
          felsefenin değil, dinin konusudur. Felsefe ve din ayrı yetki alanlarına sahiptir.</p>
        </div>
      </div>
      <div class="book-item">
        <div class="book-header">
          <div class="book-num">II–V</div>
          <div class="book-name">Erdem, Adalet ve Pratik Hayat</div>
          <div class="book-toggle">▾</div>
        </div>
        <div class="book-content">
          <p>Mesotes doktrini, İslam geleneğinde <em>i'tidâl</em> (denge) olarak karşılık bulur.
          Ben bu karşılığın doğru olduğunu düşünürüm; ama i'tidâl, yalnızca dinî bir kavram değil,
          öncelikle aklın pratik işleyişinin gerektirdiği bir ilkedir.</p>
          <p>Adalet (ΗΝ V), Arapçaya <em>adl</em> ve <em>insâf</em> olarak çevrilmiştir.
          Dağıtıcı ve düzeltici adalet ayrımını ben de aynen koruyorum; üstelik Endülüs şehirlerinin
          yönetim sorunlarını bu çerçeveyle ele almaya çalışırım. Aristoteles'in <em>epieikeia</em>sı,
          İslam hukuk geleneğindeki <em>istihsân</em> ya da <em>maslahat</em> kavramlarıyla kısmi
          örtüşme içindedir; ama bunlar özdeş değildir.</p>
          <p>Entelektüel erdemler analizinde (ΗΝ VI) ben Aristoteles'i savunurum: <em>phronesis</em>,
          pratik alanın kendi özerk erdemidir ve ilahî vahiyden bağımsız işleyebilir. İbn Sînâ'nın
          phronesis'i nübüvvete bağlaması, bu özerkliği ortadan kaldırır; bu kabul edilemez.</p>
        </div>
      </div>
      <div class="book-item">
        <div class="book-header">
          <div class="book-num">VI</div>
          <div class="book-name">Akıl ve Saâdet — En Tartışmalı Konu</div>
          <div class="book-toggle">▾</div>
        </div>
        <div class="book-content">
          <p>Aristoteles'in <em>nous</em> (akıl) teorisi, benim en tartışmalı yorumuma konu olan
          alandır. Faâl Aklın (nous poiêtikos) bireysel mi yoksa evrensel mi olduğu sorusu,
          ömrüm boyunca değiştirdiğim bir pozisyondur. Son görüşüm şudur: Faâl Akıl, bireysel
          ruha dışarıdan işleyen ayrık bir akıldır; ama bu, Aristocu hylomorfizmi yıkmaz.
          İnsanın saâdeti, bu ayrık akılla birleşmek (ittihâd ya da ittisâl) değil,
          <em>onun ışığında en yüce tümelleri kavramak</em>tır.</p>
          <p>Gazzâlî, Aristoteles'i küfürle itham etmiştir. Ben ise Tehâfütü't-Tehâfüt'te gösteririm:
          Gazzâlî'nin itirazları, ya Aristoteles'in değil Fârâbî'nin ve İbn Sînâ'nın görüşlerini
          hedef almaktadır; ya da felsefeyi yanlış anlamaktan kaynaklanmaktadır. Aristoteles'in etiği,
          dini zayıflatmaz; aksine, aklın insan için hayırlı olanı nasıl bilebileceğini gösterir.</p>
        </div>
      </div>
    </div>
  </div>
