<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Laboratuvar Kit Takip Sistemi</title>
<style>
  @page { size: A4 portrait; margin: 0; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 210mm;
    min-height: 297mm;
    background: #fff;
    font-family: 'Segoe UI', Calibri, 'Helvetica Neue', Arial, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    color-adjust: exact;
  }

  .page {
    width: 210mm;
    height: 297mm;
    padding: 7mm 10mm 5mm 10mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─── HEADER ─── */
  .header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding-bottom: 3.5mm;
    border-bottom: 3px solid #0D3B6E;
    margin-bottom: 3mm;
    flex-shrink: 0;
  }
  .logo-box {
    width: 40px;
    height: 40px;
    background: linear-gradient(145deg, #0D3B6E 0%, #1565C0 100%);
    border-radius: 9px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hdr-text h1 {
    font-size: 13pt;
    color: #0D3B6E;
    font-weight: 700;
    letter-spacing: 0.3px;
    line-height: 1.15;
  }
  .hdr-text p {
    font-size: 7pt;
    color: #7a8fa6;
    margin-top: 2px;
    letter-spacing: 0.4px;
  }
  .hdr-badges {
    margin-left: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  .badge {
    font-size: 6.5pt;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }
  .badge-blue { background: #E3F0FF; color: #0D3B6E; }
  .badge-gray { background: #F0F3F7; color: #6B7C93; }

  /* ─── DIAGRAM ─── */
  .diagram {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow: hidden;
  }
  .diagram svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ─── LEGEND ─── */
  .legend {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 4px 13px;
    border-top: 1px solid #e0e7ef;
    padding-top: 2mm;
    margin-top: 2mm;
  }
  .li {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 6.5pt;
    color: #4a5568;
  }
  .lc {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* ─── FOOTER ─── */
  .footer {
    flex-shrink: 0;
    text-align: center;
    font-size: 6pt;
    color: #b0bec5;
    padding-top: 1.5mm;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }

  @media print {
    body { margin: 0; }
    .page { page-break-after: always; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- ═══ HEADER ═══ -->
  <div class="header">
    <div class="logo-box">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M9 3h6v5l4 7v3a1 1 0 01-1 1H6a1 1 0 01-1-1v-3l4-7V3z"
              stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <line x1="9" y1="8" x2="15" y2="8" stroke="white" stroke-width="1.2" opacity=".7"/>
        <circle cx="10" cy="16" r="1" fill="white" opacity=".9"/>
        <circle cx="13.5" cy="14.5" r=".7" fill="white" opacity=".7"/>
      </svg>
    </div>
    <div class="hdr-text">
      <h1>Laboratuvar Kit Takip Sistemi</h1>
      <p>Süreç Akış Diyagramı &nbsp;·&nbsp; Laboratory Kit Tracking &amp; Workflow</p>
    </div>
    <div class="hdr-badges">
      <span class="badge badge-blue">GAZİANTEP LAB</span>
      <span class="badge badge-gray">v 1.0</span>
    </div>
  </div>

  <!-- ═══ DIAGRAM ═══ -->
  <div class="diagram">
    <svg viewBox="0 0 556 592" xmlns="http://www.w3.org/2000/svg"
         font-family="'Segoe UI', Calibri, Arial, sans-serif">
      <defs>
        <!-- Arrow: default (slate) -->
        <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <polygon points="0 0,9 3.5,0 7" fill="#4A6FA5"/>
        </marker>
        <!-- Arrow: orange -->
        <marker id="ao" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <polygon points="0 0,9 3.5,0 7" fill="#C0440A"/>
        </marker>
        <!-- Arrow: purple -->
        <marker id="ap" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <polygon points="0 0,9 3.5,0 7" fill="#4A148C"/>
        </marker>
        <!-- Arrow: teal dashed -->
        <marker id="at" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <polygon points="0 0,9 3.5,0 7" fill="#00897B"/>
        </marker>
        <!-- Shadow -->
        <filter id="sh" x="-6%" y="-6%" width="118%" height="130%">
          <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0D3B6E" flood-opacity="0.13"/>
        </filter>
        <!-- Phase bg clip -->
        <clipPath id="clipAll"><rect x="0" y="0" width="556" height="592"/></clipPath>
      </defs>

      <!-- ══════════════════════════════════════════════════
           PHASE BACKGROUND BANDS
      ══════════════════════════════════════════════════ -->

      <!-- GİRİŞ band: y=6 to y=128 -->
      <rect x="30" y="6" width="520" height="122" rx="7"
            fill="#EBF2FC" stroke="#BDD3F0" stroke-width="0.6"/>
      <text x="38" y="17.5" font-size="6.5" font-weight="700" fill="#0D3B6E"
            letter-spacing="0.9">GİRİŞ &amp; STOK ALMA</text>

      <!-- GÜNLÜK band: y=132 to y=344 -->
      <rect x="30" y="132" width="520" height="212" rx="7"
            fill="#E8F6F3" stroke="#AADDD6" stroke-width="0.6"/>
      <text x="38" y="143.5" font-size="6.5" font-weight="700" fill="#00695C"
            letter-spacing="0.9">GÜNLÜK OPERASYONLAR</text>

      <!-- HAFTALIK band: y=348 to y=437 -->
      <rect x="30" y="348" width="520" height="89" rx="7"
            fill="#F4ECF9" stroke="#D7B8EF" stroke-width="0.6"/>
      <text x="38" y="359.5" font-size="6.5" font-weight="700" fill="#4A148C"
            letter-spacing="0.9">HAFTALIK İŞLEMLER</text>

      <!-- AYLIK band: y=440 to y=588 -->
      <rect x="30" y="440" width="520" height="148" rx="7"
            fill="#FEF0EE" stroke="#F5C0B8" stroke-width="0.6"/>
      <text x="38" y="451.5" font-size="6.5" font-weight="700" fill="#B71C1C"
            letter-spacing="0.9">AYLIK RAPORLAMA</text>

      <!-- ══════════════════════════════════════════════════
           MAIN SPINE NODES
           Center x=199, width=176 → left=111, right=287
      ══════════════════════════════════════════════════ -->

      <!-- NODE 1: İrsaliye ile Giriş  top=18 -->
      <rect x="111" y="18" width="176" height="48" rx="9" fill="#0D3B6E" filter="url(#sh)"/>
      <text x="199" y="37" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">① İrsaliye ile Giriş</text>
      <text x="199" y="52" text-anchor="middle" font-size="7" fill="rgba(255,255,255,.7)">Tedarik belgesiyle ürün kabulü</text>

      <!-- Arrow 1 → 2 -->
      <line x1="199" y1="66" x2="199" y2="88" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#a)"/>

      <!-- NODE 2: Sayarak Teslim Alma ve Stok Kaydı  top=90 -->
      <rect x="111" y="90" width="176" height="48" rx="9" fill="#1565C0" filter="url(#sh)"/>
      <text x="199" y="109" text-anchor="middle" font-size="9" font-weight="700" fill="white">② Sayarak Teslim Alma</text>
      <text x="199" y="125" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(255,255,255,.9)">ve Stok Kaydı</text>

      <!-- Arrow 2 → 3 -->
      <line x1="199" y1="138" x2="199" y2="158" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#a)"/>

      <!-- NODE 3: Günlük Teslimat  top=160 -->
      <rect x="111" y="160" width="176" height="48" rx="9" fill="#00695C" filter="url(#sh)"/>
      <text x="199" y="179" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">③ Günlük Teslimat</text>
      <text x="199" y="195" text-anchor="middle" font-size="7" fill="rgba(255,255,255,.7)">Kitlerin günlük dağıtımı</text>

      <!-- Arrow 3 → 4 -->
      <line x1="199" y1="208" x2="199" y2="228" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#a)"/>

      <!-- NODE 4: Teslim Alınanın Teyidi  top=230 -->
      <rect x="111" y="230" width="176" height="52" rx="9" fill="#00796B" filter="url(#sh)"/>
      <text x="199" y="249" text-anchor="middle" font-size="9" font-weight="700" fill="white">④ Teslim Alınanın Kişi</text>
      <text x="199" y="264" text-anchor="middle" font-size="9" font-weight="700" fill="white">Tarafından Teyidi</text>
      <text x="199" y="278" text-anchor="middle" font-size="7" fill="rgba(255,255,255,.65)">Alındı onayı ve geri bildirim</text>

      <!-- Arrow 4 → 5 -->
      <line x1="199" y1="282" x2="199" y2="302" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#a)"/>

      <!-- NODE 5: Geri Bildirimlerin Forma İşlenmesi  top=304 -->
      <rect x="111" y="304" width="176" height="52" rx="9" fill="#00897B" filter="url(#sh)"/>
      <text x="199" y="322" text-anchor="middle" font-size="9" font-weight="700" fill="white">⑤ Geri Bildirimlerin</text>
      <text x="199" y="337" text-anchor="middle" font-size="9" font-weight="700" fill="white">Gün Sonu Forma İşlenmesi</text>
      <text x="199" y="351" text-anchor="middle" font-size="7" fill="rgba(255,255,255,.65)">Tüm veriler günlük forma aktarılır</text>

      <!-- ──────────────────────────────────────────────────
           LOOP BACK: Node 5 → Node 3  (left side)
      ────────────────────────────────────────────────── -->
      <path d="M 111,330 H 54 V 184 H 111"
            fill="none" stroke="#26A69A" stroke-width="1.3"
            stroke-dasharray="5,3" marker-end="url(#at)"/>
      <!-- Loop label background + text -->
      <rect x="32" y="242" width="20" height="36" rx="3" fill="white" opacity=".92"/>
      <text x="42" y="253" text-anchor="middle" font-size="5.5" fill="#00897B"
            font-style="italic" transform="rotate(-90,42,260)">yeni teslimat</text>

      <!-- ──────────────────────────────────────────────────
           SIDE BRANCHES FROM NODE 5
      ────────────────────────────────────────────────── -->
      <!-- Arrow 5 → Side A (Günlük Takip) -->
      <path d="M 287,320 H 388" fill="none" stroke="#C0440A" stroke-width="1.4" marker-end="url(#ao)"/>
      <!-- Arrow 5 → Side B (Azalan Stok) -->
      <path d="M 287,340 H 340 V 368 H 388" fill="none" stroke="#C0440A" stroke-width="1.4" marker-end="url(#ao)"/>

      <!-- SIDE A: Günlük Takip Ve Denetim  (right) top=300 -->
      <rect x="388" y="300" width="142" height="44" rx="8" fill="#BF360C" filter="url(#sh)"/>
      <text x="459" y="318" text-anchor="middle" font-size="8.5" font-weight="700" fill="white">Günlük Takip</text>
      <text x="459" y="332" text-anchor="middle" font-size="8.5" font-weight="700" fill="white">ve Denetim</text>
      <text x="459" y="342" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,.7)">İzleme &amp; kontrol raporu</text>

      <!-- SIDE B: Azalan Stok Talebi  (right) top=352 -->
      <rect x="388" y="352" width="142" height="44" rx="8" fill="#E64A19" filter="url(#sh)"/>
      <text x="459" y="370" text-anchor="middle" font-size="8.5" font-weight="700" fill="white">Azalan Stok</text>
      <text x="459" y="384" text-anchor="middle" font-size="8.5" font-weight="700" fill="white">Talebi</text>
      <text x="459" y="394" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,.7)">Yeniden sipariş bildirimi</text>

      <!-- Arrow 5 → 6 -->
      <line x1="199" y1="356" x2="199" y2="378" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#a)"/>
      <!-- Transition label -->
      <text x="209" y="371" font-size="5.8" fill="#4A148C" font-style="italic" opacity=".9">↓ haftalık süreç</text>

      <!-- NODE 6: Haftalık Excel'de Birleştirme  top=380 -->
      <rect x="111" y="380" width="176" height="50" rx="9" fill="#4A148C" filter="url(#sh)"/>
      <text x="199" y="399" text-anchor="middle" font-size="9" font-weight="700" fill="white">⑥ Haftalık Excel</text>
      <text x="199" y="415" text-anchor="middle" font-size="9" font-weight="700" fill="white">Tablosunda Birleştirme</text>
      <text x="199" y="427" text-anchor="middle" font-size="7" fill="rgba(255,255,255,.65)">Veriler haftalık konsolide edilir</text>

      <!-- Arrow 6 → Side C -->
      <path d="M 287,405 H 388" fill="none" stroke="#4A148C" stroke-width="1.4" marker-end="url(#ap)"/>

      <!-- SIDE C: Haftalık Takip Kontrolü  top=384 -->
      <rect x="388" y="384" width="142" height="44" rx="8" fill="#6A1B9A" filter="url(#sh)"/>
      <text x="459" y="402" text-anchor="middle" font-size="8.5" font-weight="700" fill="white">Haftalık Takip</text>
      <text x="459" y="416" text-anchor="middle" font-size="8.5" font-weight="700" fill="white">Kontrolü</text>
      <text x="459" y="426" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,.7)">Haftalık denetim raporu</text>

      <!-- Arrow 6 → 7 -->
      <line x1="199" y1="430" x2="199" y2="458" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#a)"/>
      <!-- Transition label -->
      <text x="209" y="449" font-size="5.8" fill="#880E4F" font-style="italic" opacity=".9">↓ aylık raporlama</text>

      <!-- NODE 7: Stok Durumu Kontrol ve Raporlama  top=460 -->
      <rect x="111" y="460" width="176" height="50" rx="9" fill="#880E4F" filter="url(#sh)"/>
      <text x="199" y="479" text-anchor="middle" font-size="9" font-weight="700" fill="white">⑦ Stok Durumu Kontrol</text>
      <text x="199" y="495" text-anchor="middle" font-size="9" font-weight="700" fill="white">ve Raporlama</text>
      <text x="199" y="507" text-anchor="middle" font-size="7" fill="rgba(255,255,255,.65)">Kapsamlı stok analizi</text>

      <!-- Arrow 7 → 8 -->
      <line x1="199" y1="510" x2="199" y2="528" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#a)"/>

      <!-- NODE 8: Ay Sonu Durumu ve Toplu Sayım Raporu  top=530 -->
      <rect x="111" y="530" width="176" height="52" rx="9" fill="#B71C1C" filter="url(#sh)"/>
      <text x="199" y="549" text-anchor="middle" font-size="9" font-weight="700" fill="white">⑧ Ay Sonu Durumu ve</text>
      <text x="199" y="565" text-anchor="middle" font-size="9" font-weight="700" fill="white">Toplu Sayım Raporu</text>
      <text x="199" y="578" text-anchor="middle" font-size="7" fill="rgba(255,255,255,.65)">Aylık nihai rapor &amp; arşiv</text>

      <!-- ══════════════════════════════════════════════════
           CONNECTOR DOTS at junction points
      ══════════════════════════════════════════════════ -->
      <!-- Junction on node 5 right edge going to A and B -->
      <circle cx="287" cy="330" r="3.5" fill="#00897B"/>

    </svg>
  </div>

  <!-- ═══ LEGEND ═══ -->
  <div class="legend">
    <div class="li"><div class="lc" style="background:#0D3B6E"></div>Giriş &amp; Stok Alma</div>
    <div class="li"><div class="lc" style="background:#00695C"></div>Günlük Operasyon</div>
    <div class="li"><div class="lc" style="background:#BF360C"></div>İzleme &amp; Talep Çıktısı</div>
    <div class="li"><div class="lc" style="background:#4A148C"></div>Haftalık İşlem</div>
    <div class="li"><div class="lc" style="background:#B71C1C"></div>Aylık Raporlama</div>
    <div class="li">
      <svg width="22" height="8" style="flex-shrink:0">
        <line x1="1" y1="4" x2="21" y2="4" stroke="#26A69A" stroke-width="1.4" stroke-dasharray="4,2.5"/>
      </svg>
      Tekrar döngüsü
    </div>
  </div>

  <!-- ═══ FOOTER ═══ -->
  <div class="footer">
    Laboratuvar Kit Takip Sistemi &nbsp;·&nbsp; Süreç Akış Diyagramı &nbsp;·&nbsp; Gaziantep
  </div>

</div>
</body>
</html>
