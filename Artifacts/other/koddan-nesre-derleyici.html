<script>
/* ============================================================
   KODDAN NESRE DERLEYİCİ — The Code-to-Prose Compiler
   Laravel söz dizimi ↔ İngilizce gramer
   ============================================================ */

/* ---------- Verb Engine (minik konjugasyon motoru) ---------- */
const IRREGULAR = {
  'be':    {past:'was', pastPl:'were', pp:'been', s:'is', ing:'being'},
  'have':  {past:'had', pp:'had', s:'has', ing:'having'},
  'do':    {past:'did', pp:'done', s:'does', ing:'doing'},
  'go':    {past:'went', pp:'gone', s:'goes', ing:'going'},
  'eat':   {past:'ate', pp:'eaten', s:'eats', ing:'eating'},
  'see':   {past:'saw', pp:'seen', s:'sees', ing:'seeing'},
  'know':  {past:'knew', pp:'known', s:'knows', ing:'knowing'},
  'take':  {past:'took', pp:'taken', s:'takes', ing:'taking'},
  'give':  {past:'gave', pp:'given', s:'gives', ing:'giving'},
  'come':  {past:'came', pp:'come', s:'comes', ing:'coming'},
  'win':   {past:'won', pp:'won', s:'wins', ing:'winning'},
  'buy':   {past:'bought', pp:'bought', s:'buys', ing:'buying'},
  'drive': {past:'drove', pp:'driven', s:'drives', ing:'driving'},
  'read':  {past:'read', pp:'read', s:'reads', ing:'reading'},
  'write': {past:'wrote', pp:'written', s:'writes', ing:'writing'},
  'speak': {past:'spoke', pp:'spoken', s:'speaks', ing:'speaking'},
  'leave': {past:'left', pp:'left', s:'leaves', ing:'leaving'},
  'make':  {past:'made', pp:'made', s:'makes', ing:'making'},
  'find':  {past:'found', pp:'found', s:'finds', ing:'finding'},
  'think': {past:'thought', pp:'thought', s:'thinks', ing:'thinking'},
  'feel':  {past:'felt', pp:'felt', s:'feels', ing:'feeling'},
  'sleep': {past:'slept', pp:'slept', s:'sleeps', ing:'sleeping'},
  'run':   {past:'ran', pp:'run', s:'runs', ing:'running'},
  'swim':  {past:'swam', pp:'swum', s:'swims', ing:'swimming'},
  'meet':  {past:'met', pp:'met', s:'meets', ing:'meeting'},
  'tell':  {past:'told', pp:'told', s:'tells', ing:'telling'},
  'say':   {past:'said', pp:'said', s:'says', ing:'saying'},
  'get':   {past:'got', pp:'gotten', s:'gets', ing:'getting'},
  'bring': {past:'brought', pp:'brought', s:'brings', ing:'bringing'},
  'build': {past:'built', pp:'built', s:'builds', ing:'building'},
  'catch': {past:'caught', pp:'caught', s:'catches', ing:'catching'},
  'teach': {past:'taught', pp:'taught', s:'teaches', ing:'teaching'},
};

function conjugate(verb, form, subject) {
  verb = (verb || '').trim().toLowerCase();
  if (!verb) return '';
  const irr = IRREGULAR[verb];
  const isThird = /^(he|she|it|the |a |an )/.test((subject||'').toLowerCase().trim()) ||
                  (!['i','you','we','they'].includes((subject||'').toLowerCase().trim()));
  const pluralSubj = /^(we|they|you)$/.test((subject||'').toLowerCase().trim()) ||
                      (subject||'').toLowerCase().trim().endsWith('s');

  switch(form) {
    case 'base': return verb;
    case 'present':
      if (verb === 'be') {
        const s = (subject||'').toLowerCase().trim();
        if (s === 'i') return 'am';
        if (s === 'you' || s === 'we' || s === 'they' || s.endsWith('s')) return 'are';
        return 'is';
      }
      if (irr && isThird && !pluralSubj) return irr.s;
      if (isThird && !pluralSubj) return regularThird(verb);
      return verb;
    case 'past':
      if (verb === 'be') {
        const s = (subject||'').toLowerCase().trim();
        if (s === 'you' || s === 'we' || s === 'they' || s.endsWith('s')) return 'were';
        return 'was';
      }
      if (irr) return irr.past;
      return regularPast(verb);
    case 'wereForm': // Type 2 conditional: all persons use 'were'
      if (verb === 'be') return 'were';
      if (irr) return irr.past;
      return regularPast(verb);
    case 'pp':
      if (irr) return irr.pp;
      return regularPast(verb);
    case 'ing':
      if (irr) return irr.ing;
      return regularIng(verb);
  }
  return verb;
}
function regularPast(v) {
  if (v.endsWith('e')) return v + 'd';
  if (v.endsWith('y') && !/[aeiou]y$/.test(v)) return v.slice(0,-1) + 'ied';
  return v + 'ed';
}
function regularThird(v) {
  if (/[sxz]$|sh$|ch$/.test(v)) return v + 'es';
  if (v.endsWith('y') && !/[aeiou]y$/.test(v)) return v.slice(0,-1) + 'ies';
  return v + 's';
}
function regularIng(v) {
  if (v.endsWith('e') && v.length > 2) return v.slice(0,-1) + 'ing';
  return v + 'ing';
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---------- Syntax Highlighter for generated Laravel-ish code ---------- */
function hl(code) {
  return code
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(\/\/[^\n]*)/g, '<span class="com">$1</span>')
    .replace(/('[^']*')/g, '<span class="str">$1</span>')
    .replace(/\b(\d+)\b/g, '<span class="num">$1</span>')
    .replace(/(-&gt;)/g, '<span class="arr">$1</span>')
    .replace(/\b(Conditional|Tense|Passive|Relative|Modal|Reported|Article|Sentence)\b/g, '<span class="cls">$1</span>')
    .replace(/(::[\w]+|-&gt;<\/span>[\w]+)/g, m => m.replace(/([\w]+)$/, '<span class="mth">$1</span>'))
    .replace(/\b(new|return|function|public)\b/g, '<span class="kw">$1</span>');
}

/* ===========================================================
   TOPIC: CONDITIONALS (full: compile, decompile, debug, AST)
   =========================================================== */
const TOPICS = {};

TOPICS.conditionals = {
  title: 'Conditionals',
  metafor: `
    <h3>📘 Laravel Metaforu</h3>
    <p>Bir <code>Conditional</code> yapısı, Blade'deki <code>@if / @elseif</code> direktifine benzer: bir şartı (condition) alır, değerlendirir ve bir sonuç (consequence) üretir. <strong>Tip numarası</strong>, derleyicinin hangi <em>tense pipeline</em>'ını uygulayacağını belirler — tıpkı farklı middleware grupları gibi.</p>
    <p style="margin-top:8px"><strong>Tip 0:</strong> <code>@if(true)</code> — evrensel gerçek. <strong>Tip 1:</strong> gerçekçi gelecek. <strong>Tip 2:</strong> şimdi/gelecek için hipotez (<code>were</code> tüm özneler için). <strong>Tip 3:</strong> geçmişte olmamış şey için hipotez (<code>had + V3</code>).</p>
  `,
  modes: ['compile','decompile','debug'],
  defaultMode: 'compile'
};

function compileConditional(data) {
  const {type, ifS, ifV, ifC, thenS, thenV, thenC} = data;
  if (!ifS || !ifV || !thenS || !thenV) {
    throw new Error('SubjectOrVerbMissing: if ve then bloklarında özne ve fiil zorunludur.');
  }
  let ifClause, thenClause;
  switch(Number(type)) {
    case 0:
      ifClause = `if ${ifS} ${conjugate(ifV,'present',ifS)}${ifC?' '+ifC:''}`;
      thenClause = `${thenS} ${conjugate(thenV,'present',thenS)}${thenC?' '+thenC:''}`;
      break;
    case 1:
      ifClause = `if ${ifS} ${conjugate(ifV,'present',ifS)}${ifC?' '+ifC:''}`;
      thenClause = `${thenS} will ${thenV}${thenC?' '+thenC:''}`;
      break;
    case 2:
      ifClause = `if ${ifS} ${conjugate(ifV,'wereForm',ifS)}${ifC?' '+ifC:''}`;
      thenClause = `${thenS} would ${thenV}${thenC?' '+thenC:''}`;
      break;
    case 3:
      ifClause = `if ${ifS} had ${conjugate(ifV,'pp',ifS)}${ifC?' '+ifC:''}`;
      thenClause = `${thenS} would have ${conjugate(thenV,'pp',thenS)}${thenC?' '+thenC:''}`;
      break;
    default: throw new Error('UnknownConditionalType: tip 0, 1, 2 veya 3 olmalı.');
  }
  return cap(`${ifClause}, ${thenClause}.`);
}

function conditionalCode(data) {
  const {type, ifS, ifV, ifC, thenS, thenV, thenC} = data;
  return `Conditional::type(${type})
  ->if(subject: '${ifS}', verb: '${ifV}', complement: '${ifC}')
  ->then(subject: '${thenS}', verb: '${thenV}', complement: '${thenC}')
  ->compile();`;
}

function conditionalAST(data, compiled) {
  const {type, ifS, ifV, ifC, thenS, thenV, thenC} = data;
  const typeLabels = {
    0: 'ZERO (Universal truth)',
    1: 'FIRST (Real future)',
    2: 'SECOND (Hypothetical present)',
    3: 'THIRD (Hypothetical past)'
  };
  return `<span class="node-type">Sentence</span> <span class="node-val">"${compiled}"</span>
<span class="node-line">├──</span> <span class="node-type">Type</span>: <span class="node-val">${typeLabels[type]}</span>
<span class="node-line">├──</span> <span class="node-type">IfClause</span> <span class="node-val">(condition)</span>
<span class="node-line">│   ├──</span> Subject: <span class="node-val">"${ifS}"</span>
<span class="node-line">│   ├──</span> Verb: <span class="node-val">"${ifV}"</span> → <span class="node-val">"${conditionalVerbForm(type,'if',ifV,ifS)}"</span>
<span class="node-line">│   └──</span> Complement: <span class="node-val">"${ifC||'∅'}"</span>
<span class="node-line">└──</span> <span class="node-type">ThenClause</span> <span class="node-val">(consequence)</span>
<span class="node-line">    ├──</span> Subject: <span class="node-val">"${thenS}"</span>
<span class="node-line">    ├──</span> Modal: <span class="node-val">"${conditionalModal(type)}"</span>
<span class="node-line">    ├──</span> Verb: <span class="node-val">"${thenV}"</span> → <span class="node-val">"${conditionalVerbForm(type,'then',thenV,thenS)}"</span>
<span class="node-line">    └──</span> Complement: <span class="node-val">"${thenC||'∅'}"</span>`;
}
function conditionalVerbForm(type, slot, verb, subj) {
  type = Number(type);
  if (slot === 'if') {
    if (type === 0 || type === 1) return conjugate(verb,'present',subj);
    if (type === 2) return conjugate(verb,'wereForm',subj);
    if (type === 3) return 'had ' + conjugate(verb,'pp',subj);
  } else {
    if (type === 0) return conjugate(verb,'present',subj);
    if (type === 1) return 'will ' + verb;
    if (type === 2) return 'would ' + verb;
    if (type === 3) return 'would have ' + conjugate(verb,'pp',subj);
  }
  return verb;
}
function conditionalModal(type) {
  type = Number(type);
  if (type === 0) return '∅ (present)';
  if (type === 1) return 'will';
  if (type === 2) return 'would';
  if (type === 3) return 'would have';
  return '';
}

TOPICS.tenses = {
  title: 'Tenses & Aspects',
  metafor: `
    <h3>📘 Laravel Metaforu</h3>
    <p>Bir cümle Laravel'deki <code>Request</code> gibi bir <em>lifecycle</em>'dan geçer. <code>->aspect('perfect')</code> çağrısı, referans anından önce tamamlanmış olma damgasını basan bir middleware'dir. <code>->aspect('continuous')</code> ise o anda çalışmakta olan bir job gibidir.</p>
    <p style="margin-top:8px">12 tense = <strong>3 zaman</strong> (past, present, future) × <strong>4 aspect</strong> (simple, continuous, perfect, perfect-continuous).</p>
  `,
  modes: ['compile'],
  defaultMode: 'compile'
};

function compileTense(data) {
  const {time, aspect, subject, verb, object} = data;
  if (!subject || !verb) throw new Error('Özne ve fiil zorunlu.');
  const obj = object ? ' ' + object : '';
  let vp;
  const key = time + '_' + aspect;
  switch(key) {
    case 'present_simple':
      vp = conjugate(verb,'present',subject); break;
    case 'present_continuous':
      vp = conjugate('be','present',subject) + ' ' + conjugate(verb,'ing'); break;
    case 'present_perfect':
      vp = conjugate('have','present',subject) + ' ' + conjugate(verb,'pp'); break;
    case 'present_perfectContinuous':
      vp = conjugate('have','present',subject) + ' been ' + conjugate(verb,'ing'); break;
    case 'past_simple':
      vp = conjugate(verb,'past',subject); break;
    case 'past_continuous':
      vp = conjugate('be','past',subject) + ' ' + conjugate(verb,'ing'); break;
    case 'past_perfect':
      vp = 'had ' + conjugate(verb,'pp'); break;
    case 'past_perfectContinuous':
      vp = 'had been ' + conjugate(verb,'ing'); break;
    case 'future_simple':
      vp = 'will ' + verb; break;
    case 'future_continuous':
      vp = 'will be ' + conjugate(verb,'ing'); break;
    case 'future_perfect':
      vp = 'will have ' + conjugate(verb,'pp'); break;
    case 'future_perfectContinuous':
      vp = 'will have been ' + conjugate(verb,'ing'); break;
    default: throw new Error('Bilinmeyen tense kombinasyonu.');
  }
  return cap(`${subject} ${vp}${obj}.`);
}
function tenseCode(data) {
  return `Tense::${data.time}()
  ->aspect('${data.aspect}')
  ->subject('${data.subject}')
  ->verb('${data.verb}')
  ->object('${data.object}')
  ->compile();`;
}

TOPICS.passive = {
  title: 'Passive Voice',
  metafor: `
    <h3>📘 Laravel Metaforu</h3>
    <p><strong>Facade pattern</strong>. Nasıl <code>Cache::get()</code> çağırdığında arkadaki gerçek sınıfı görmüyorsan, <em>passive voice</em> de gerçek özneyi (faili) gizler. "The cake was eaten" — kim yedi? Facade gibi, gerçek fail gizlenmiş.</p>
    <p style="margin-top:8px">Formül: <code>be + past participle (V3)</code>. Aktiften pasife dönüşüm: <em>object</em> subject olur, <em>subject</em> 'by' ile optional hale gelir.</p>
  `,
  modes: ['compile'],
  defaultMode: 'compile'
};
function compilePassive(data) {
  const {tense, object, verb, agent} = data;
  if (!object || !verb) throw new Error('Nesne ve fiil zorunlu.');
  let beForm;
  switch(tense) {
    case 'present': beForm = conjugate('be','present',object); break;
    case 'past': beForm = conjugate('be','past',object); break;
    case 'presentPerfect': beForm = conjugate('have','present',object) + ' been'; break;
    case 'pastPerfect': beForm = 'had been'; break;
    case 'future': beForm = 'will be'; break;
    case 'modal': beForm = 'can be'; break;
  }
  const pp = conjugate(verb,'pp');
  const by = agent ? ' by ' + agent : '';
  return cap(`${object} ${beForm} ${pp}${by}.`);
}
function passiveCode(data) {
  return `Passive::make()
  ->tense('${data.tense}')
  ->object('${data.object}')
  ->verb('${data.verb}')
  ->agent('${data.agent}')
  ->compile();`;
}

    <p style="margin-top:8px"><strong>who</strong> = insanlar · <strong>which</strong> = nesneler · <strong>that</strong> = ikisi de · <strong>whose</strong> = aitlik · <strong>where</strong> = yer · <strong>when</strong> = zaman.</p>

    <h3>📘 Laravel Metaforu</h3>

    <p style="margin-top:8px">Modal sonrası <strong>her zaman base form</strong> (yalın hal) gelir: <em>she can swim</em> (✓), <em>she can swims</em> (✗).</p>
  `,
  modes: ['compile'],
  defaultMode: 'compile'
};
function compileModal(data) {
  const {subject, modal, verb, complement, form} = data;
  if (!subject || !modal || !verb) throw new Error('Özne, modal ve fiil zorunlu.');
  const c = complement ? ' ' + complement : '';
  let vp;
  switch(form) {
    case 'simple': vp = modal + ' ' + verb; break;
    case 'perfect': vp = modal + ' have ' + conjugate(verb,'pp'); break;
    case 'continuous': vp = modal + ' be ' + conjugate(verb,'ing'); break;
    case 'perfectContinuous': vp = modal + ' have been ' + conjugate(verb,'ing'); break;
    case 'passive': vp = modal + ' be ' + conjugate(verb,'pp'); break;
  }
  return cap(`${subject} ${vp}${c}.`);
}
function modalCode(data) {

  ->subject('${data.subject}')
  ->verb('${data.verb}')
  ->form('${data.form}')

TOPICS.reported = {
  title: 'Reported Speech',
  metafor: `
    <h3>📘 Laravel Metaforu</h3>
    <p><strong>Events & Listeners</strong>. Bir event fire edildiğinde (direct speech), listener onu kaydeder ama <em>serialize</em> ederken zaman damgasını bir adım geri alır — buna <strong>tense backshift</strong> denir. <code>is → was</code>, <code>has → had</code>, <code>will → would</code>.</p>
    <p style="margin-top:8px">Ayrıca zamir kaydırması: <code>I → he/she</code>, <code>you → I/they</code>, <code>we → they</code>.</p>
  `,
  modes: ['compile'],
  defaultMode: 'compile'
};
function compileReported(data) {
  const {reporter, reportVerb, innerSubject, innerTense, innerVerb, innerRest} = data;
  if (!reporter || !innerSubject || !innerVerb) throw new Error('Reporter, inner subject ve verb zorunlu.');
  // backshift
  let shiftedVerb;
  switch(innerTense) {
    case 'present': shiftedVerb = conjugate(innerVerb,'past',innerSubject); break;
    case 'past': shiftedVerb = 'had ' + conjugate(innerVerb,'pp'); break;
    case 'presentPerfect': shiftedVerb = 'had ' + conjugate(innerVerb,'pp'); break;
    case 'will': shiftedVerb = 'would ' + innerVerb; break;
    case 'can': shiftedVerb = 'could ' + innerVerb; break;
    case 'must': shiftedVerb = 'had to ' + innerVerb; break;
  }
  const rest = innerRest ? ' ' + innerRest : '';
  return cap(`${reporter} ${conjugate(reportVerb,'past',reporter)} that ${innerSubject} ${shiftedVerb}${rest}.`);
}
function reportedCode(data) {
  return `Reported::from('${data.reporter} ${data.reportVerb}s: "${data.innerSubject} ${data.innerVerb}..."')
  ->backshift('${data.innerTense}')
  ->compile();`;
}

  metafor: `
    <h3>📘 Laravel Metaforu</h3>
    <p><strong>Eloquent retrieval methods</strong>. <code>Model::find(1)</code> = bilinen, spesifik bir kayıt → <strong>the</strong>. <code>Model::create()</code> = yeni, henüz tanıtılmamış bir kayıt → <strong>a/an</strong>. <code>Model::all()</code> = genel, jenerik koleksiyon → <strong>tanımlıksız çoğul</strong>.</p>
    <p style="margin-top:8px"><strong>a</strong> = ünsüz sesle başlayan kelimeler, <strong>an</strong> = ünlü <em>sesle</em> başlayanlar (yazılış değil ses: "an hour", "a university").</p>
  `,
  modes: ['compile'],
  defaultMode: 'compile'
};
function compileArticle(data) {
  const {method, noun} = data;
  if (!noun) throw new Error('İsim zorunlu.');
  const n = noun.trim().toLowerCase();
  const firstChar = n.charAt(0);
  // crude vowel sound check
  const vowelSound = /^[aeio]/.test(n) || n.startsWith('hour') || n.startsWith('honest');
  const consonantSound = /^u[nr]i/.test(n); // university, unique → 'a'
  let result;
  switch(method) {
    case 'find':
      result = 'the ' + n; break;
    case 'create':
      result = (vowelSound && !consonantSound ? 'an ' : 'a ') + n; break;
    case 'all':
      // crude pluralization
      let plural;
      if (n.endsWith('y') && !/[aeiou]y$/.test(n)) plural = n.slice(0,-1) + 'ies';
      else if (/[sxz]$|sh$|ch$/.test(n)) plural = n + 'es';
      else plural = n + 's';
      result = plural; break;
  }
  return cap(result);
}
function articleCode(data) {
  return `Article::${data.method}('${data.noun}');
// ${data.method === 'find' ? 'Known specific → the' : data.method === 'create' ? 'New instance → a/an' : 'Generic collection → ∅ plural'}`;
}

/* ===========================================================
   EVENT HANDLING (delegation — NO inline handlers)
   =========================================================== */
let conditionalType = 0;
let currentDecompileAnswer = null;
let currentDebugBug = null;

document.addEventListener('click', function(e) {
  const t = e.target;

  // theme toggle
  if (t.id === 'themeToggle') {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'light' ? '' : 'light';
    if (next) document.documentElement.setAttribute('data-theme','light');
    else document.documentElement.removeAttribute('data-theme');
    t.textContent = next === 'light' ? '☀️ Tema' : '🌙 Tema';
    return;
  }

  // topic tab
  const topicTab = t.closest('.topic-tab');
  if (topicTab) {
    $$('.topic-tab').forEach(b => b.classList.remove('active'));
    topicTab.classList.add('active');
    currentTopic = topicTab.dataset.topic;
    currentMode = 'compile';
    renderTopic();
    return;
  }

  // mode tab
  const modeTab = t.closest('.mode-tab');
  if (modeTab) {
    currentMode = modeTab.dataset.mode;
    renderTopic();
    return;
  }

  // conditional type selector
  const typeBtn = t.closest('.type-btn');
  if (typeBtn) {
    const parent = typeBtn.parentElement;
    $$('.type-btn', parent).forEach(b => b.classList.remove('active'));
    typeBtn.classList.add('active');
    conditionalType = Number(typeBtn.dataset.type);
    if (currentMode === 'compile') runCurrent();
    return;
  }

  // run / compile
  if (t.dataset.action === 'run') { runCurrent(); return; }
  if (t.dataset.action === 'check') { checkDecompile(); return; }
  if (t.dataset.action === 'checkFix') { checkDebugFix(); return; }

  // presets
  if (t.dataset.preset) { applyPreset(t.dataset.preset); return; }
  if (t.dataset.dchallenge) { loadDecompileChallenge(t.dataset.dchallenge); return; }
  if (t.dataset.debug === 'next') { loadDebugBug(); return; }
});

// Live-update on input change
document.addEventListener('input', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
    if (currentMode === 'compile') runCurrent();
  }
});

function runCurrent() {
  try {
    if (currentTopic === 'conditionals') runConditional();
    else if (currentTopic === 'tenses') runTense();
    else if (currentTopic === 'passive') runPassive();
    else if (currentTopic === 'relative') runRelative();
    else if (currentTopic === 'modals') runModal();
    else if (currentTopic === 'reported') runReported();
    else if (currentTopic === 'articles') runArticle();
  } catch (err) {
    const out = $('#englishOut');
    if (out) { out.classList.add('error'); out.textContent = '⚠ ' + err.message; }
  }
}

  const data = {

    thenS: $('#c_thenS').value.trim(),

    const compiled = compileConditional(data);

    if ($('#astOut')) $('#astOut').innerHTML = conditionalAST(data, compiled);
  } catch (err) {
    const out = $('#englishOut');

    out.textContent = '⚠ CompilerError: ' + err.message;

    '1': {type:1, ifS:'it', ifV:'rain', ifC:'tomorrow', thenS:'I', thenV:'stay', thenC:'home'},
    '2': {type:2, ifS:'I', ifV:'be', ifC:'you', thenS:'I', thenV:'tell', thenC:'the truth'},
    '3': {type:3, ifS:'she', ifV:'study', ifC:'harder', thenS:'she', thenV:'pass', thenC:'the exam'},
  },
  tenses: {
    'pp': {time:'present',aspect:'perfect',subject:'I',verb:'finish',object:'my book'},
    'pc': {time:'past',aspect:'continuous',subject:'they',verb:'play',object:'football'},
    'fp': {time:'future',aspect:'perfect',subject:'she',verb:'write',object:'three novels by 2030'},
  },
  passive: {
    'built': {tense:'past',object:'the bridge',verb:'build',agent:'Romans'},

  },
  relative: {

    'man': {article:'the',noun:'man',pronoun:'whose',clauseVerb:"car broke",clauseRest:'down'},
  },
  modals: {
    'regret': {subject:'I',modal:'should',verb:'study',form:'perfect',complement:'harder'},
    'deduction': {subject:'he',modal:'must',verb:'sleep',form:'continuous',complement:'right now'},
    'ability': {subject:'she',modal:'can',verb:'speak',form:'simple',complement:'three languages'},
  },
  reported: {
    'happy': {reporter:'she',reportVerb:'say',innerSubject:'she',innerTense:'present',innerVerb:'be',innerRest:'happy'},
    'finished': {reporter:'he',reportVerb:'tell',innerSubject:'he',innerTense:'presentPerfect',innerVerb:'finish',innerRest:'the project'},
    'come': {reporter:'they',reportVerb:'say',innerSubject:'they',innerTense:'will',innerVerb:'come',innerRest:'later'},

  articles: {
    'hour': {method:'create',noun:'hour'},
    'uni': {method:'create',noun:'university'},

function applyPreset(key) {
  const p = PRESETS[currentTopic] && PRESETS[currentTopic][key];
  if (!p) return;
  if (currentTopic === 'conditionals') {
    conditionalType = p.type;
    $$('.type-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.type) === p.type));
    $('#c_ifS').value = p.ifS;
    $('#c_ifV').value = p.ifV;
    $('#c_ifC').value = p.ifC;
    $('#c_thenS').value = p.thenS;
    $('#c_thenV').value = p.thenV;
    $('#c_thenC').value = p.thenC;
  } else if (currentTopic === 'tenses') {
    $('#t_time').value = p.time;
    $('#t_aspect').value = p.aspect;
    $('#t_subject').value = p.subject;
    $('#t_verb').value = p.verb;
    $('#t_object').value = p.object;
  } else if (currentTopic === 'passive') {
    $('#p_tense').value = p.tense;
    $('#p_object').value = p.object;
    $('#p_verb').value = p.verb;
    $('#p_agent').value = p.agent;
  } else if (currentTopic === 'relative') {
    $('#r_article').value = p.article;
    $('#r_noun').value = p.noun;
    $('#r_pronoun').value = p.pronoun;
    $('#r_verb').value = p.clauseVerb;
    $('#r_rest').value = p.clauseRest;
  } else if (currentTopic === 'modals') {
    $('#m_subject').value = p.subject;
    $('#m_modal').value = p.modal;
    $('#m_verb').value = p.verb;
    $('#m_form').value = p.form;
    $('#m_complement').value = p.complement;
  } else if (currentTopic === 'reported') {
    $('#rs_reporter').value = p.reporter;
    $('#rs_reportVerb').value = p.reportVerb;
    $('#rs_innerSubject').value = p.innerSubject;
    $('#rs_innerTense').value = p.innerTense;
    $('#rs_innerVerb').value = p.innerVerb;
    $('#rs_innerRest').value = p.innerRest;
  } else if (currentTopic === 'articles') {
    $('#a_method').value = p.method;
    $('#a_noun').value = p.noun;
  }
  runCurrent();
}

/* ---------- Decompile Mode (conditionals) ---------- */
const DECOMPILE_CHALLENGES = {
  '0': {
    target: 'If you mix red and blue, you get purple.',
    answer: {type:0,ifS:'you',ifV:'mix',ifC:'red and blue',thenS:'you',thenV:'get',thenC:'purple'}
  },
  '1': {
    target: 'If it snows tomorrow, we will build a snowman.',
    answer: {type:1,ifS:'it',ifV:'snow',ifC:'tomorrow',thenS:'we',thenV:'build',thenC:'a snowman'}
  },
  '2': {
    target: 'If I were a bird, I would fly to the mountains.',
    answer: {type:2,ifS:'I',ifV:'be',ifC:'a bird',thenS:'I',thenV:'fly',thenC:'to the mountains'}
  },
  '3': {
    target: 'If she had left earlier, she would have caught the train.',
    answer: {type:3,ifS:'she',ifV:'leave',ifC:'earlier',thenS:'she',thenV:'catch',thenC:'the train'}
  }
};
function loadDecompileChallenge(type) {
  const ch = DECOMPILE_CHALLENGES[type];
  if (!ch) return;
  currentDecompileAnswer = ch.answer;
  $('#decompileTarget').textContent = ch.target;
  conditionalType = ch.answer.type;
  $$('.type-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.type) === ch.answer.type));
  ['c_ifS','c_ifV','c_ifC','c_thenS','c_thenV','c_thenC'].forEach(id => { $('#'+id).value = ''; });
  $('#decompileResult').innerHTML = '';
  $('#englishOut').textContent = 'Kodu yaz ve kontrol et…';
  $('#codeOut').innerHTML = '// your code will appear here';
}
function checkDecompile() {
  if (!currentDecompileAnswer) currentDecompileAnswer = DECOMPILE_CHALLENGES['3'].answer;
  const data = {
    type: conditionalType,
    ifS: $('#c_ifS').value.trim(),
    ifV: $('#c_ifV').value.trim(),
    ifC: $('#c_ifC').value.trim(),
    thenS: $('#c_thenS').value.trim(),
    thenV: $('#c_thenV').value.trim(),
    thenC: $('#c_thenC').value.trim(),
  };
  try {
    const compiled = compileConditional(data);
    $('#codeOut').innerHTML = hl(conditionalCode(data));
    $('#englishOut').textContent = compiled;
    const target = $('#decompileTarget').textContent.trim().toLowerCase().replace(/[.,]/g,'');
    const mine = compiled.trim().toLowerCase().replace(/[.,]/g,'');
    const resultBox = $('#decompileResult');
    if (mine === target) {
      resultBox.innerHTML = '<div class="success-box">✅ Mükemmel! Kodun hedef cümleyi tam olarak compile etti.</div>';
    } else {
      resultBox.innerHTML = `<div class="error-box"><div class="err-title">⚠ Eşleşmedi.</div>Hedef: <em>${$('#decompileTarget').textContent}</em><br>Senin: <em>${compiled}</em><br><br>İpucu: Tip doğru mu? Base form fiil mi yazdın (past/pp değil)?</div>`;
    }
  } catch (err) {
    $('#decompileResult').innerHTML = `<div class="error-box"><div class="err-title">⚠ CompilerError</div>${err.message}</div>`;
  }
}

/* ---------- Debug Mode (conditionals) ---------- */
const DEBUG_BUGS = [
  {
    code: `Conditional::type(2)
  ->if(subject: 'I', verb: 'was', complement: 'you')
  ->then(subject: 'I', verb: 'help', complement: 'you')
  ->compile();`,
    error: 'TenseMismatchException at if.verb\nExpected: Type 2 requires "were" for all persons (formal)\nFound: "was"\nFix the verb field.',
    field: 'if.verb',
    expected: 'be',
    hint: 'Tip 2\'de derleyici fiili kendisi "were" formuna çevirir. Sen base form ver: "be".'
  },
  {
    code: `Conditional::type(1)
  ->if(subject: 'it', verb: 'rain')
  ->then(subject: 'I', verb: 'will stay')
  ->compile();`,
    error: 'DoubleModalException at then.verb\nType 1 compiler already injects "will" as modal.\nFound: "will stay" (contains modal)\nExpected: base form only.',
    field: 'then.verb',
    expected: 'stay',
    hint: 'Tip 1 compiler\'ı "will"i kendisi ekler. Sen sadece base form fiil ver.'
  },
  {
    code: `Conditional::type(3)
  ->if(subject: 'he', verb: 'studied', complement: 'harder')
  ->then(subject: 'he', verb: 'passed', complement: 'the exam')
  ->compile();`,
    error: 'VerbFormException at if.verb\nType 3 compiler handles past participle itself (had + V3).\nFound: "studied" (already past tense)\nExpected: base form.',
    field: 'if.verb',
    expected: 'study',
    hint: 'Tip 3\'te <had + V3> dönüşümünü compiler yapar. Sen base form ("study") ver; "studied" veya "passed" değil.'
  },
  {
    code: `Conditional::type(0)
  ->if(subject: 'you', verb: 'heats', complement: 'water')
  ->then(subject: 'it', verb: 'boils')
  ->compile();`,
    error: 'SubjectAgreementException at if.verb\nFound: "heats" with subject "you"\n3rd person -s suffix does not match 2nd person subject.',
    field: 'if.verb',
    expected: 'heat',
    hint: 'Özne "you" olduğu için 3. tekil -s eki gelmez. Base form ver; compiler gerekirse eki ekler.'
  }
];
let debugIndex = 0;
function loadDebugBug() {
  debugIndex = Math.floor(Math.random() * DEBUG_BUGS.length);
  const bug = DEBUG_BUGS[debugIndex];
  currentDebugBug = bug;
  $('#brokenCode').innerHTML = hl(bug.code);
  $('#errorBox').innerHTML = `<div class="err-title">⚠ CompilerError</div>${bug.error.replace(/\n/g,'<br>')}`;
  $('#fixLabel').textContent = bug.field + ':';
  $('#fixInput').value = '';
  $('#debugResult').innerHTML = '';
  $('#englishOut').textContent = 'Düzeltmeyi gir ve kontrol et…';
  $('#englishOut').classList.remove('error');
}
function checkDebugFix() {
  if (!currentDebugBug) return;
  const val = $('#fixInput').value.trim().toLowerCase();
  const resultBox = $('#debugResult');
  if (val === currentDebugBug.expected.toLowerCase()) {
    resultBox.innerHTML = `<div class="success-box">✅ Doğru! ${currentDebugBug.hint}</div>`;
    $('#englishOut').textContent = '✓ Compiled successfully.';
  } else {
    resultBox.innerHTML = `<div class="error-box"><div class="err-title">⚠ Henüz değil.</div>İpucu: ${currentDebugBug.hint}</div>`;
  }
}

/* ---------- Init ---------- */
renderTopic();
// Initialize debug bug on first debug mode entry
document.addEventListener('click', function(e) {
  const modeTab = e.target.closest('.mode-tab');
  if (modeTab && modeTab.dataset.mode === 'debug' && currentTopic === 'conditionals') {
    setTimeout(loadDebugBug, 50);
  }
}, true);

</script>
