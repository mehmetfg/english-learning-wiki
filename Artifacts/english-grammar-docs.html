<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="İngilizce gramerin 56 çekirdek konusu — Laravel dokümantasyon düzeninde, Türkçe açıklamalı referans.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>English Grammar Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#f9322c;
  --brand-soft:rgba(249,50,44,.08);
  --bg:#ffffff;
  --bg-alt:#fdfdfc;
  --panel:#ffffff;
  --text:#1b1b18;
  --text-muted:#706f6c;
  --text-soft:#8b8a86;
  --border:#e6e5e2;
  --border-soft:#f1f0ee;
  --code-bg:#0f1115;
  --code-text:#e7e5e4;
  --inline-code:#c2410c;
  --inline-code-bg:#f6f5f3;
  --note:#3b82f6;
  --note-bg:rgba(59,130,246,.07);
  --warn:#d97706;
  --warn-bg:rgba(217,119,6,.08);
  --good:#16a34a;
  --good-bg:rgba(22,163,74,.08);
  --bad:#dc2626;
  --bad-bg:rgba(220,38,38,.07);
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --header-h:64px;
  color-scheme:light;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0a0a0a; --bg-alt:#111110; --panel:#131312;
    --text:#EDEDEC; --text-muted:#a1a09a; --text-soft:#7b7a76;
    --border:#262624; --border-soft:#1d1d1b;
    --code-bg:#161615; --code-text:#e7e5e4;
    --inline-code:#fb923c; --inline-code-bg:#1c1c1a;
    --inline-code-bg:#1c1c1a;
    --note-bg:rgba(59,130,246,.12); --warn-bg:rgba(217,119,6,.12);
    --good-bg:rgba(22,163,74,.13); --bad-bg:rgba(220,38,38,.13);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --bg-alt:#111110; --panel:#131312;
  --text:#EDEDEC; --text-muted:#a1a09a; --text-soft:#7b7a76;
  --border:#262624; --border-soft:#1d1d1b;
  --code-bg:#161615; --code-text:#e7e5e4;
  --inline-code:#fb923c; --inline-code-bg:#1c1c1a;
  --note-bg:rgba(59,130,246,.12); --warn-bg:rgba(217,119,6,.12);
  --good-bg:rgba(22,163,74,.13); --bad-bg:rgba(220,38,38,.13);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

/* ---------- header ---------- */
header.top{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:60;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.brand-mark{width:26px;height:26px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--text-soft);letter-spacing:0}
.top nav.links{display:flex;gap:22px;margin-left:26px;font-size:14px;font-weight:500;color:var(--text-muted)}
.top nav.links a:hover{color:var(--brand)}
.top .spacer{flex:1}
.search-wrap{position:relative}
#search{
  width:230px;height:38px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg-alt);color:var(--text);padding:0 34px 0 34px;font:inherit;font-size:14px;
}
#search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search-wrap svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--text-soft)}
.search-wrap kbd{
  position:absolute;right:9px;top:9px;font-size:11px;font-family:'JetBrains Mono',monospace;
  border:1px solid var(--border);border-radius:5px;padding:2px 5px;color:var(--text-soft);background:var(--bg)
}
.pill{
  height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;font-weight:600;
  border:1px solid var(--border);border-radius:8px;background:var(--bg-alt);color:var(--text-muted);cursor:pointer
}
.pill:hover{border-color:var(--brand);color:var(--brand)}
#menuBtn{display:none}

/* ---------- layout ---------- */
.shell{display:flex;max-width:1560px;margin:0 auto;padding-top:var(--header-h)}
aside.side{
  width:290px;flex:none;position:sticky;top:var(--header-h);align-self:flex-start;
  height:calc(100vh - var(--header-h));overflow-y:auto;
  border-right:1px solid var(--border);padding:28px 18px 80px 24px;
}
aside.side::-webkit-scrollbar{width:8px}
aside.side::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.nav-group{margin-bottom:22px}
.nav-group > button{
  all:unset;display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text);
  padding:5px 6px;border-radius:6px;
}
.nav-group > button:hover{color:var(--brand)}
.nav-group .chev{width:12px;height:12px;transition:transform .18s;color:var(--text-soft)}
.nav-group.collapsed .chev{transform:rotate(-90deg)}
.nav-group.collapsed ul{display:none}
.nav-group .count{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0}
.nav-group ul{list-style:none;margin:6px 0 0;padding:0 0 0 6px;border-left:1px solid var(--border-soft)}
.nav-group li a{
  display:block;padding:5px 10px;margin-left:-1px;border-left:2px solid transparent;
  font-size:14.5px;color:var(--text-muted);line-height:1.45;
}
.nav-group li a:hover{color:var(--text)}
.nav-group li a.active{color:var(--brand);font-weight:600;border-left-color:var(--brand);background:var(--brand-soft);border-radius:0 6px 6px 0}
.nav-empty{font-size:13px;color:var(--text-soft);padding:8px 10px}

main{flex:1;min-width:0;padding:44px 56px 120px;max-width:900px}
aside.toc{
  width:250px;flex:none;position:sticky;top:var(--header-h);align-self:flex-start;
  height:calc(100vh - var(--header-h));overflow-y:auto;padding:44px 24px 60px 8px;
}
aside.toc h4{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--text);margin:0 0 12px}
aside.toc a{display:block;font-size:13.5px;color:var(--text-muted);padding:4px 0 4px 12px;border-left:2px solid var(--border-soft);line-height:1.4}
aside.toc a.active{color:var(--brand);border-left-color:var(--brand)}
aside.toc a:hover{color:var(--text)}

/* ---------- content ---------- */
.crumbs{font-size:13px;color:var(--text-soft);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.crumbs .sep{opacity:.5}
h1{font-size:38px;line-height:1.2;letter-spacing:-.025em;margin:0 0 6px;font-weight:700}
.subtitle{font-size:18px;color:var(--text-muted);margin:0 0 18px}
h2{font-size:26px;letter-spacing:-.02em;margin:52px 0 14px;padding-top:12px;font-weight:700;scroll-margin-top:88px}
h3{font-size:19px;margin:30px 0 10px;font-weight:600;scroll-margin-top:88px}
p{margin:0 0 16px;color:var(--text-muted)}
main strong{color:var(--text);font-weight:600}
ul.body,ol.body{color:var(--text-muted);padding-left:22px;margin:0 0 18px}
ul.body li,ol.body li{margin-bottom:7px}
code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.87em;color:var(--inline-code);background:var(--inline-code-bg);padding:2px 6px;border-radius:5px;border:1px solid var(--border-soft)}
pre{
  background:var(--code-bg);color:var(--code-text);border-radius:10px;padding:18px 20px;overflow-x:auto;
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.65;margin:0 0 20px;border:1px solid var(--border);
}
pre code{background:none;border:none;color:inherit;padding:0;font-size:inherit}
pre .k{color:#ff8064;font-weight:500}
pre .c{color:#8b8a86;font-style:italic}
pre .s{color:#7dd3a0}

.badges{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);background:var(--bg-alt)}
.badge.level{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 35%,transparent);background:var(--brand-soft)}

.callout{border-left:4px solid var(--note);background:var(--note-bg);border-radius:0 8px 8px 0;padding:14px 18px;margin:0 0 20px}
.callout p:last-child{margin-bottom:0}
.callout .ct{font-weight:700;color:var(--text);display:block;margin-bottom:4px;font-size:14px}
.callout.warn{border-left-color:var(--warn);background:var(--warn-bg)}

table.grid{width:100%;border-collapse:collapse;margin:0 0 22px;font-size:14.5px;display:table}
.tablewrap{overflow-x:auto;margin-bottom:22px}
.tablewrap table.grid{margin-bottom:0;min-width:520px}
table.grid th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);border-bottom:1px solid var(--border);padding:9px 12px;font-weight:700}
table.grid td{border-bottom:1px solid var(--border-soft);padding:10px 12px;color:var(--text-muted);vertical-align:top}
table.grid td:first-child{color:var(--text);font-weight:500;white-space:nowrap}

.ex{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:0 0 20px;background:var(--panel);box-shadow:var(--shadow)}
.ex-row{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--border-soft)}
.ex-row:last-child{border-bottom:none}
.ex-en,.ex-tr{padding:12px 16px}
.ex-en{font-weight:500;color:var(--text);border-right:1px solid var(--border-soft)}
.ex-tr{color:var(--text-muted);font-size:14.5px;background:var(--bg-alt)}
.ex-head{display:grid;grid-template-columns:1fr 1fr;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft);background:var(--bg-alt);border-bottom:1px solid var(--border);font-weight:700}
.ex-head span{padding:8px 16px}
.ex-head span:first-child{border-right:1px solid var(--border-soft)}
.hl{color:var(--brand);font-weight:600}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 20px}
.pair > div{border-radius:10px;padding:14px 16px;font-size:15px;border:1px solid var(--border)}
.pair .no{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.pair .yes{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.pair .tag{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.pair .no .tag{color:var(--bad)}
.pair .yes .tag{color:var(--good)}
.pair .why{display:block;font-size:13.5px;color:var(--text-muted);margin-top:6px}

.related{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.related a{font-size:13.5px;font-weight:500;border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text-muted);background:var(--bg-alt)}
.related a:hover{border-color:var(--brand);color:var(--brand)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:64px;padding-top:26px;border-top:1px solid var(--border)}
.pager a{border:1px solid var(--border);border-radius:10px;padding:14px 18px;background:var(--panel)}
.pager a:hover{border-color:var(--brand)}
.pager span{display:block;font-size:12px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.pager b{font-size:15.5px;color:var(--text);font-weight:600}
.pager .next{text-align:right}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:0 0 24px}
.cards a{border:1px solid var(--border);border-radius:12px;padding:16px 18px;background:var(--panel);box-shadow:var(--shadow)}
.cards a:hover{border-color:var(--brand)}
.cards b{display:block;font-size:15.5px;margin-bottom:4px}
.cards span{font-size:13.5px;color:var(--text-muted);line-height:1.5;display:block}

.backdrop{display:none;position:fixed;inset:var(--header-h) 0 0;background:rgba(0,0,0,.45);z-index:45}
.backdrop.open{display:block}

@media (max-width:1279px){aside.toc{display:none}main{max-width:none;padding:40px 40px 110px}}
@media (max-width:1023px){
  #menuBtn{display:inline-flex}
  .top nav.links{display:none}
  #search{width:150px}
  aside.side{
    position:fixed;top:var(--header-h);bottom:0;left:0;z-index:50;width:300px;background:var(--bg);
    transform:translateX(-102%);transition:transform .22s ease;height:auto;
  }
  aside.side.open{transform:translateX(0);box-shadow:0 12px 40px rgba(0,0,0,.18)}
  main{padding:32px 22px 100px}
  h1{font-size:31px}
  h2{font-size:23px;margin-top:44px}
}
@media (max-width:639px){
  header.top{gap:10px;padding:0 12px}
  .brand small{display:none}
  .brand{min-width:0;font-size:15px}
  .brand span{display:none}
  .search-wrap{flex:1;min-width:0}
  .search-wrap kbd{display:none}
  #search{width:100%;min-width:0;padding-right:10px}
  .ex-row,.ex-head{grid-template-columns:1fr}
  .ex-en{border-right:none;border-bottom:1px dashed var(--border-soft)}
  .ex-head span:first-child{border-right:none}
  .ex-head span:last-child{display:none}
  .pair{grid-template-columns:1fr}
  .pager{grid-template-columns:1fr}
  .pager .next{text-align:left}
  main{padding:26px 16px 90px}
  h1{font-size:27px}
  .subtitle{font-size:16px}
}
</style>
</head>

{
  id:"how-to-use", title:"How to Use", tr:"Nasıl Kullanılır", level:"Tüm seviyeler", tags:["overview"],
  intro:"Bu sayfa dokümanı verimli kullanma yöntemini anlatır. Gramer referansı baştan sona okunmaz; <strong>ihtiyaç anında</strong> (just-in-time) açılır.",

    {h:"Örnekleri okuma biçimi", p:["Her örnek tablosunda solda İngilizce cümle, sağda Türkçe karşılığı yer alır. Hedef yapı <span class='hl'>renkli</span> gösterilir. Türkçe karşılıklar <strong>birebir çeviri değil</strong>, anlam karşılığıdır — İngilizceyi Türkçe dizilişle kurmaya çalışmak en yaygın hata kaynağıdır."],

    {h:"Çalışma ritmi önerisi", list:["Günde <strong>1 konu</strong> — 15 dakika okuma, 10 dakika kendi cümlelerini yazma","Yazdığın her cümlede kullandığın yapının sayfasını aç ve Form tablosuyla karşılaştır","Haftada bir <strong>Cheat Sheet</strong> sayfasını gözden geçir","Aynı hatayı 3. kez yaptığında o sayfayı yeniden baştan oku — tekrar eden hata, eksik kural bilgisidir"],
      callout:{t:"Disiplin notu",b:"Gramer bilgisi ile gramer kullanımı ayrı becerilerdir. Bu dokümanı okumak ikincisini vermez; okuduğun her kuralı aynı gün en az 5 cümlede kullanmazsan bilgi 48 saat içinde erişilemez hâle gelir."}}

{
  id:"present-simple", title:"Present Simple", tr:"Geniş Zaman", level:"A1", tags:["tense","present"],
  intro:"Present Simple (Geniş Zaman), <strong>tekrar eden eylemleri, alışkanlıkları, değişmez gerçekleri ve programları</strong> anlatır. İngilizcedeki en yüksek frekanslı zamandır: konuşmanın yaklaşık yarısı bu zamanla kurulur.",
  sections:[
    {h:"Form", p:["Yapının tamamı tek bir kurala dayanır: üçüncü tekil şahısta (he / she / it) fiile <code>-s</code> eklenir, diğer tüm şahıslarda fiil yalın kalır."],
      code:"<span class='c'>// Olumlu</span>\nS + V1        I / You / We / They <span class='k'>work</span>\nS + V1-s      He / She / It <span class='k'>works</span>\n\n<span class='c'>// Olumsuz</span>\nS + do not + V1        They <span class='k'>don't work</span>\nS + does not + V1      She <span class='k'>doesn't work</span>\n\n<span class='c'>// Soru</span>\nDo + S + V1?           <span class='k'>Do</span> they <span class='k'>work</span>?\nDoes + S + V1?         <span class='k'>Does</span> she <span class='k'>work</span>?",
      callout:{t:"Kritik kural",b:"<code>does</code> ya da <code>doesn't</code> cümlede varsa <code>-s</code> zaten yardımcı fiile geçmiştir; ana fiil yalın kalır. ❌ <em>She doesn't works</em> → ✅ <em>She doesn't work</em>."}},
    {h:"-s eki yazım kuralları", table:{head:["Fiil sonu","Kural","Örnek"],rows:[
      ["-s, -sh, -ch, -x, -z","<code>-es</code>","watch → watch<strong>es</strong>, miss → miss<strong>es</strong>"],
      ["ünsüz + y","y düşer, <code>-ies</code>","study → stud<strong>ies</strong>, try → tr<strong>ies</strong>"],
      ["ünlü + y","normal <code>-s</code>","play → play<strong>s</strong>, buy → buy<strong>s</strong>"],
      ["-o","<code>-es</code>","go → go<strong>es</strong>, do → do<strong>es</strong>"],
      ["diğer","<code>-s</code>","run → run<strong>s</strong>"]]}},
    {h:"Usage", p:["Present Simple'ın beş temel kullanımı vardır:"],
      list:["<strong>Habits / routines</strong> — düzenli tekrar eden eylemler","<strong>Permanent situations</strong> — kalıcı durumlar (iş, ikamet)","<strong>General truths</strong> — bilimsel gerçekler, değişmezler","<strong>Timetables</strong> — sabit programlar (tren, ders, uçuş) — gelecek anlamı taşır","<strong>State verbs</strong> — durum fiilleri (know, want, believe) continuous'a girmez"],
      ex:[["I <span class='hl'>get up</span> at six every morning.","Her sabah altıda kalkarım. (alışkanlık)"],
        ["My brother <span class='hl'>works</span> for a bank in Ankara.","Kardeşim Ankara'da bir bankada çalışıyor. (kalıcı durum)"],
        ["Water <span class='hl'>boils</span> at 100 degrees Celsius.","Su 100 derecede kaynar. (genel gerçek)"],
        ["The train <span class='hl'>leaves</span> at 7:40 tomorrow.","Tren yarın 7:40'ta kalkıyor. (program — gelecek anlamı)"],
        ["She <span class='hl'>doesn't understand</span> the question.","Soruyu anlamıyor. (state verb)"],
        ["<span class='hl'>Do</span> you <span class='hl'>speak</span> German?","Almanca konuşuyor musun?"]]},
    {h:"Sıklık zarfları", p:["Present Simple ile en sık kullanılan zarflar ve cümledeki yeri: <strong>ana fiilden önce, <em>be</em> fiilinden sonra</strong>."],
      table:{head:["Zarf","Sıklık","Örnek"],rows:[
        ["always","%100","She <strong>always</strong> arrives early."],
        ["usually / normally","%80","I <strong>usually</strong> walk to work."],
        ["often / frequently","%60","We <strong>often</strong> eat out."],
        ["sometimes","%40","He <strong>sometimes</strong> forgets."],
        ["rarely / seldom","%10","They <strong>rarely</strong> complain."],
        ["never","%0","I <strong>never</strong> drink coffee at night."]]},
      ex:[["He is <span class='hl'>always</span> late.","Her zaman geç kalır. (<em>be</em> fiilinden sonra)"],["He <span class='hl'>always</span> comes late.","Her zaman geç gelir. (ana fiilden önce)"]]},
    {h:"Common Mistakes", pairs:[
      ["She go to school by bus.","She goes to school by bus.","3. tekil şahısta <code>-s</code> zorunludur."],
      ["Does he plays football?","Does he play football?","<em>does</em> varken ana fiil yalındır."],
      ["I am go to work every day.","I go to work every day.","<em>be</em> + V1 diye bir yapı yoktur."],
      ["I am knowing the answer.","I know the answer.","<em>know</em> bir state verb'dür, continuous almaz."],
      ["Every day I am playing tennis.","Every day I play tennis.","Düzenli tekrar Present Simple ister."]]}
  ],
  related:["present-continuous","adverbs","question-formation","negation"]
},
{
  id:"present-continuous", title:"Present Continuous", tr:"Şimdiki Zaman", level:"A1", tags:["tense","present"],
  intro:"Present Continuous (Şimdiki Süregelen Zaman), <strong>şu anda devam eden</strong>, <strong>geçici</strong> ya da <strong>planlanmış yakın gelecekteki</strong> eylemleri anlatır. Türkçedeki \"-yor\" ekinin birebir karşılığı değildir: Türkçede \"-yor\" ile söylenen çoğu cümle İngilizcede Present Simple'dır.",
  sections:[
    {h:"Form", code:"<span class='c'>// Olumlu</span>\nS + am/is/are + V-ing      I <span class='k'>am working</span> / She <span class='k'>is working</span> / They <span class='k'>are working</span>\n\n<span class='c'>// Olumsuz</span>\nS + am/is/are + not + V-ing   He <span class='k'>isn't working</span>\n\n<span class='c'>// Soru</span>\nAm/Is/Are + S + V-ing?        <span class='k'>Are</span> you <span class='k'>working</span>?",
      table:{head:["Fiil sonu","Kural","Örnek"],rows:[
        ["-e","e düşer","write → writing, make → making"],
        ["tek ünlü + tek ünsüz (vurgulu)","ünsüz ikilenir","run → running, begin → beginning"],
        ["-ie","-ying","lie → lying, die → dying"],
        ["-y","değişmez","study → studying, play → playing"]]}},
    {h:"Usage", list:["<strong>Şu an olan</strong> — konuşma anında devam eden eylem","<strong>Geçici durum</strong> — bu dönem geçerli ama kalıcı değil","<strong>Değişen süreç</strong> — getting, becoming, improving","<strong>Planlanmış gelecek</strong> — takvime girmiş, kişisel düzenleme","<strong>always + continuous</strong> — rahatsızlık/şikâyet vurgusu"],
      ex:[["Be quiet, the baby <span class='hl'>is sleeping</span>.","Sessiz ol, bebek uyuyor. (şu an)"],
        ["I <span class='hl'>am staying</span> with my aunt this month.","Bu ay teyzemde kalıyorum. (geçici)"],
        ["The climate <span class='hl'>is getting</span> warmer every year.","İklim her yıl ısınıyor. (değişim)"],
        ["We <span class='hl'>are meeting</span> the supplier on Friday.","Cuma günü tedarikçiyle görüşüyoruz. (planlı gelecek)"],
        ["He <span class='hl'>is always losing</span> his keys!","Sürekli anahtarlarını kaybediyor! (şikâyet)"]]},
    {h:"Present Simple ile fark", table:{head:["","Present Simple","Present Continuous"],rows:[
      ["Anlam","Kalıcı, düzenli, genel","Geçici, şu anki, sınırlı süre"],
      ["Örnek","I <strong>work</strong> in a hospital. (mesleğim)","I <strong>am working</strong> in a hospital. (şu dönem)"],
      ["Zaman ifadeleri","always, usually, every day","now, at the moment, today, this week"],
      ["State verbs","✅ I like it.","❌ I am liking it."]]}},
    {h:"State verbs — continuous almayan fiiller", p:["Bu fiiller eylem değil <strong>durum</strong> anlatır ve normalde -ing almaz:"],
      list:["<strong>Düşünce:</strong> know, believe, understand, remember, mean, doubt","<strong>Duygu:</strong> like, love, hate, want, need, prefer","<strong>Duyu:</strong> see, hear, smell, taste, seem, appear","<strong>Sahiplik/ilişki:</strong> have, own, belong, contain, consist, cost"],
      ex:[["I <span class='hl'>have</span> two cars. (sahiplik)","İki arabam var. — continuous olmaz"],["I <span class='hl'>am having</span> lunch. (eylem)","Öğle yemeği yiyorum. — burada <em>have</em> eylemdir, olur"],["This soup <span class='hl'>tastes</span> salty.","Bu çorba tuzlu. (durum)"],["The chef <span class='hl'>is tasting</span> the soup.","Şef çorbayı tadıyor. (eylem)"]],
      callout:{t:"Nüans",b:"Bazı state verb'ler eylem anlamı kazandığında continuous olabilir: <em>think</em> (fikir = state / düşünmek = action), <em>see</em> (görmek = state / görüşmek = action), <em>have</em> (sahip olmak = state / yemek-içmek-vakit geçirmek = action)."}},
    {h:"Common Mistakes", pairs:[
      ["I am work now.","I am working now.","<em>be</em> + <strong>V-ing</strong> zorunlu."],
      ["I am wanting a coffee.","I want a coffee.","<em>want</em> state verb'dür."],
      ["Every Monday I am going to the gym.","Every Monday I go to the gym.","Düzenli tekrar → Present Simple."],
      ["She is livving in Bursa.","She is living in Bursa.","<em>live</em> tek heceli ama vurgu kuralı gereği ikilenmez."]]}
  ],
  related:["present-simple","future-going-to","adverbs"]
},
{
  id:"present-perfect", title:"Present Perfect", tr:"Yakın Geçmiş / Tamamlanmış Şimdi", level:"B1", tags:["tense","present","perfect"],
  intro:"Present Perfect, <strong>geçmişte gerçekleşmiş ama şimdiyle bağı olan</strong> eylemleri anlatır. Türkçede birebir karşılığı yoktur; bu yüzden Türk öğrenciler için en zor zamandır. Anahtar soru şudur: <em>\"Ne zaman olduğu mu önemli, yoksa şimdiki sonucu mu?\"</em> Şimdiki sonuç önemliyse Present Perfect kullanılır.",
  sections:[
    {h:"Form", code:"<span class='c'>// Olumlu</span>\nS + have/has + V3      I <span class='k'>have finished</span> / She <span class='k'>has finished</span>\n\n<span class='c'>// Olumsuz</span>\nS + haven't/hasn't + V3   They <span class='k'>haven't arrived</span>\n\n<span class='c'>// Soru</span>\nHave/Has + S + V3?        <span class='k'>Have</span> you <span class='k'>eaten</span>?"},
    {h:"Dört temel kullanım", table:{head:["Kullanım","Anlam","Tipik işaret"],rows:[
      ["<strong>Experience</strong>","Hayat boyu deneyim, tarih verilmez","ever, never, before, twice"],
      ["<strong>Result</strong>","Geçmişteki eylemin şu anki sonucu","just, already, yet"],
      ["<strong>Unfinished time</strong>","Devam eden süre içinde","for, since, this week, today"],
      ["<strong>Recent news</strong>","Yeni gerçekleşmiş haber","just, recently, lately"]]},
      ex:[["I <span class='hl'>have been</span> to Italy twice.","İtalya'ya iki kez gittim. (deneyim — ne zaman önemsiz)"],
        ["She <span class='hl'>has lost</span> her passport.","Pasaportunu kaybetti. (sonuç: şu an pasaportu yok)"],
        ["We <span class='hl'>have lived</span> here since 2015.","2015'ten beri burada yaşıyoruz. (devam eden süre)"],
        ["The president <span class='hl'>has resigned</span>.","Cumhurbaşkanı istifa etti. (yeni haber)"],
        ["<span class='hl'>Have</span> you <span class='hl'>ever eaten</span> sushi?","Hiç suşi yedin mi?"],
        ["I <span class='hl'>haven't finished</span> the report <span class='hl'>yet</span>.","Raporu henüz bitirmedim."]]},
    {h:"for / since ayrımı", p:["İkisi de süre anlatır ama farklı şeyi ölçer: <code>for</code> <strong>süre uzunluğu</strong>, <code>since</code> <strong>başlangıç noktası</strong>."],
      table:{head:["for + süre","since + başlangıç"],rows:[
        ["for three years","since 2021"],["for six months","since March"],["for a long time","since I was a child"],["for ten minutes","since this morning"]]},
      ex:[["He has worked here <span class='hl'>for</span> five years.","Beş yıldır burada çalışıyor."],["He has worked here <span class='hl'>since</span> 2020.","2020'den beri burada çalışıyor."]]},
    {h:"Present Perfect vs Past Simple", p:["Bu ayrım sınavların en sevdiği konudur. Kural nettir: <strong>bitmiş bir zaman ifadesi varsa Past Simple</strong>, yoksa ve şimdiyle bağ varsa Present Perfect."],
      table:{head:["Present Perfect","Past Simple"],rows:[
        ["Zaman belirtilmez","Zaman belirtilir"],
        ["I <strong>have seen</strong> that film.","I <strong>saw</strong> that film last night."],
        ["Süre devam ediyor: this week, today","Süre bitti: yesterday, in 2019, ago"],
        ["She <strong>has written</strong> three books. (hayatta)","Shakespeare <strong>wrote</strong> 37 plays. (öldü)"],
        ["<em>ever, never, just, already, yet, so far</em>","<em>yesterday, last…, …ago, in 1999, when</em>"]]},
      callout:{t:"Uyarı",b:"<code>when</code> ile soru sorulduğunda Present Perfect kullanılamaz: ❌ <em>When have you arrived?</em> → ✅ <em>When did you arrive?</em> Çünkü <em>when</em> zaten belirli bir zaman ister."}},
    {h:"been / gone farkı", ex:[["She <span class='hl'>has been</span> to Paris.","Paris'e gitmiş (ve dönmüş) — deneyim."],["She <span class='hl'>has gone</span> to Paris.","Paris'e gitti (hâlâ orada) — burada değil."]]},
    {h:"Common Mistakes", pairs:[
      ["I have seen him yesterday.","I saw him yesterday.","<em>yesterday</em> bitmiş zaman → Past Simple."],
      ["I am here since Monday.","I have been here since Monday.","<em>since</em> Present Perfect ister."],
      ["She has went home.","She has gone home.","<em>have</em> + V3 (gone), V2 değil."],
      ["How long do you know him?","How long have you known him?","Devam eden süre → Present Perfect."],
      ["I have finished it just now.","I finished it just now. / I have just finished it.","<em>just now</em> Past Simple ile kullanılır."]]}
  ],
  related:["past-simple","present-perfect-continuous","past-perfect"]
},
{
  id:"present-perfect-continuous", title:"Present Perfect Continuous", tr:"Süregelen Tamamlanmış Zaman", level:"B1", tags:["tense","present","perfect"],
  intro:"Present Perfect Continuous, geçmişte başlayıp <strong>şu ana kadar devam eden</strong> eylemi anlatır ve <strong>sürenin kendisini</strong> vurgular. Present Perfect sonuca bakar, bu yapı sürece bakar.",
  sections:[
    {h:"Form", code:"S + have/has + been + V-ing\n\nI <span class='k'>have been waiting</span> for an hour.\nShe <span class='k'>has been studying</span> all day.\nThey <span class='k'>haven't been sleeping</span> well.\n<span class='k'>Have</span> you <span class='k'>been running</span>?"},
    {h:"Usage", list:["<strong>Süre vurgusu</strong> — geçmişten şimdiye kesintisiz devam (for / since ile)","<strong>Görülebilir sonuç</strong> — eylem yeni bitti, izleri ortada","<strong>Tekrarlanan eylem</strong> — son dönemde defalarca","<strong>Şikâyet / rahatsızlık</strong> — sıklıkla olumsuz duygu taşır"],
      ex:[["I <span class='hl'>have been learning</span> English for three years.","Üç yıldır İngilizce öğreniyorum. (süre)"],
        ["Your eyes are red — <span class='hl'>have</span> you <span class='hl'>been crying</span>?","Gözlerin kızarmış — ağlıyor muydun? (görülebilir sonuç)"],
        ["She <span class='hl'>has been calling</span> me all week.","Bütün hafta beni aradı durdu. (tekrar)"],
        ["It <span class='hl'>has been raining</span> since Tuesday.","Salıdan beri yağmur yağıyor."]]},
    {h:"Present Perfect ile fark", table:{head:["Present Perfect","Present Perfect Continuous"],rows:[
      ["Sonuç / miktar önemli","Süreç / süre önemli"],
      ["I <strong>have written</strong> three emails. (bitti, sayı)","I <strong>have been writing</strong> emails all morning. (süreç)"],
      ["She <strong>has read</strong> the book. (bitirdi)","She <strong>has been reading</strong> the book. (hâlâ okuyor)"],
      ["Tamamlanmışlık","Tamamlanmamışlık ya da yeni bitmişlik"]]},
      callout:{t:"Not",b:"State verb'ler (know, be, have=sahiplik, like) bu yapıya girmez: ❌ <em>I have been knowing him for years</em> → ✅ <em>I have known him for years</em>."}},
    {h:"Common Mistakes", pairs:[
      ["I have been knowing her since 2010.","I have known her since 2010.","State verb continuous almaz."],
      ["I am waiting here for two hours.","I have been waiting here for two hours.","Geçmişten şimdiye süre → Present Perfect Continuous."],
      ["She has been read all day.","She has been reading all day.","<em>been</em> + V-ing zorunlu."]]}
  ],
  related:["present-perfect","past-perfect-continuous","present-continuous"]
},
{
  id:"past-simple", title:"Past Simple", tr:"Geçmiş Zaman", level:"A1", tags:["tense","past"],
  intro:"Past Simple, <strong>geçmişte başlayıp geçmişte bitmiş</strong> eylemleri anlatır. Anlatının (narrative) omurgasıdır: hikâyeler, biyografiler ve haberler bu zamanla kurulur.",
  sections:[
    {h:"Form", code:"<span class='c'>// Olumlu — düzenli fiil</span>\nS + V2 (-ed)          I <span class='k'>worked</span> / She <span class='k'>played</span>\n\n<span class='c'>// Olumlu — düzensiz fiil</span>\nS + V2                I <span class='k'>went</span> / She <span class='k'>wrote</span>\n\n<span class='c'>// Olumsuz</span>\nS + did not + V1      They <span class='k'>didn't go</span>\n\n<span class='c'>// Soru</span>\nDid + S + V1?         <span class='k'>Did</span> you <span class='k'>see</span> it?",
      callout:{t:"Kritik kural",b:"<code>did</code> cümlede varsa geçmişlik zaten yardımcı fiile yüklenmiştir; ana fiil <strong>yalın</strong> kalır. ❌ <em>Did you went?</em> → ✅ <em>Did you go?</em>"}},
    {h:"-ed yazım kuralları", table:{head:["Fiil sonu","Kural","Örnek"],rows:[
      ["-e","sadece <code>-d</code>","live → lived"],
      ["ünsüz + y","<code>-ied</code>","study → studied"],
      ["tek ünlü + tek ünsüz (vurgulu)","ünsüz ikilenir","stop → stopped, prefer → preferred"],
      ["-l (BrE)","ikilenir","travel → travelled"],
      ["diğer","<code>-ed</code>","watch → watched"]]}},
    {h:"En sık 25 düzensiz fiil", table:{head:["V1","V2","V3","Anlam"],rows:[
      ["be","was / were","been","olmak"],["go","went","gone","gitmek"],["do","did","done","yapmak"],["have","had","had","sahip olmak"],
      ["say","said","said","söylemek"],["make","made","made","yapmak/üretmek"],["take","took","taken","almak"],["come","came","come","gelmek"],
      ["see","saw","seen","görmek"],["know","knew","known","bilmek"],["get","got","got/gotten","almak/olmak"],["give","gave","given","vermek"],
      ["find","found","found","bulmak"],["think","thought","thought","düşünmek"],["tell","told","told","anlatmak"],["become","became","become","olmak"],
      ["leave","left","left","ayrılmak"],["feel","felt","felt","hissetmek"],["put","put","put","koymak"],["bring","brought","brought","getirmek"],
      ["begin","began","begun","başlamak"],["keep","kept","kept","tutmak"],["write","wrote","written","yazmak"],["stand","stood","stood","durmak"],["run","ran","run","koşmak"]]}},
    {h:"Usage", list:["Geçmişte belirli bir anda tamamlanmış eylem","Geçmişte tekrarlanan alışkanlık (used to ile eş anlamlı)","Ardışık olaylar zinciri — anlatı","Geçmişteki kalıcı durum"],
      ex:[["I <span class='hl'>bought</span> this laptop in 2022.","Bu dizüstünü 2022'de aldım."],
        ["She <span class='hl'>opened</span> the door, <span class='hl'>looked</span> around and <span class='hl'>left</span>.","Kapıyı açtı, etrafa baktı ve çıktı. (ardışık)"],
        ["We <span class='hl'>played</span> football every weekend when we were young.","Gençken her hafta sonu futbol oynardık."],
        ["<span class='hl'>Did</span> they <span class='hl'>tell</span> you the truth?","Sana gerçeği söylediler mi?"],
        ["He <span class='hl'>wasn't</span> at home last night.","Dün gece evde değildi."]]},
    {h:"Tipik zaman ifadeleri", p:["<code>yesterday</code>, <code>last night / week / year</code>, <code>two days ago</code>, <code>in 2010</code>, <code>when I was a child</code>, <code>then</code>, <code>at that time</code>"]},
    {h:"Common Mistakes", pairs:[
      ["I didn't saw him.","I didn't see him.","<em>did</em> varken V1."],
      ["She was went to Ankara.","She went to Ankara.","<em>be</em> + V2 diye bir yapı yok."],
      ["I have called you yesterday.","I called you yesterday.","<em>yesterday</em> → Past Simple."],
      ["Where you went?","Where did you go?","Soru yardımcı fiil gerektirir."]]}
  ],
  related:["past-continuous","present-perfect","past-perfect","used-to-would"]
},
{
  id:"past-continuous", title:"Past Continuous", tr:"Geçmişte Süregelen Zaman", level:"A2", tags:["tense","past"],
  intro:"Past Continuous, geçmişte <strong>belirli bir anda devam etmekte olan</strong> eylemi anlatır. Genellikle Past Simple ile birlikte kullanılır: uzun eylem arka plan, kısa eylem kesinti.",
  sections:[
    {h:"Form", code:"S + was/were + V-ing\n\nI / He / She / It  <span class='k'>was working</span>\nYou / We / They    <span class='k'>were working</span>\n\nHe <span class='k'>wasn't listening</span>.\n<span class='k'>Were</span> they <span class='k'>waiting</span>?"},
    {h:"Usage", list:["<strong>Kesintiye uğrayan eylem</strong> — <em>when</em> + Past Simple ile","<strong>Aynı anda süren iki eylem</strong> — <em>while</em> ile","<strong>Sahne kurma</strong> — hikâyede arka plan tasviri","<strong>Geçici geçmiş durum</strong>","<strong>always + continuous</strong> — geçmişteki rahatsız edici alışkanlık"],
      ex:[["I <span class='hl'>was cooking</span> when the phone rang.","Telefon çaldığında yemek yapıyordum. (kesinti)"],
        ["While she <span class='hl'>was studying</span>, her brother <span class='hl'>was playing</span> games.","O ders çalışırken kardeşi oyun oynuyordu. (paralel)"],
        ["It <span class='hl'>was raining</span> and the streets <span class='hl'>were getting</span> darker.","Yağmur yağıyordu ve sokaklar kararıyordu. (sahne)"],
        ["He <span class='hl'>was living</span> in London that summer.","O yaz Londra'da yaşıyordu. (geçici)"],
        ["She <span class='hl'>was always complaining</span> about the noise.","Sürekli gürültüden şikâyet ederdi."]]},
    {h:"when vs while", table:{head:["Bağlaç","Sonrasında gelen zaman","Örnek"],rows:[
      ["<code>when</code>","genellikle Past Simple (kısa eylem)","When he <strong>arrived</strong>, we were eating."],
      ["<code>while</code>","genellikle Past Continuous (uzun eylem)","While we <strong>were eating</strong>, he arrived."],
      ["<code>as</code>","Past Continuous","As I <strong>was leaving</strong>, it started to rain."]]}},
    {h:"Common Mistakes", pairs:[
      ["While I was walking, I was seeing an accident.","While I was walking, I saw an accident.","Ani/kısa eylem Past Simple olmalı."],
      ["I was knowing the answer.","I knew the answer.","State verb continuous almaz."],
      ["They was playing outside.","They were playing outside.","<em>they</em> → <em>were</em>."]]}
  ],
  related:["past-simple","past-perfect","present-continuous"]
},
{
  id:"past-perfect", title:"Past Perfect", tr:"Geçmişin Geçmişi", level:"B1", tags:["tense","past","perfect"],
  intro:"Past Perfect, geçmişteki <strong>iki olaydan önce olanı</strong> işaretler. Tek başına nadiren kullanılır; her zaman başka bir geçmiş referans noktası vardır.",
  sections:[
    {h:"Form", code:"S + had + V3     (tüm şahıslarda aynı)\n\nI <span class='k'>had left</span> before she arrived.\nThey <span class='k'>hadn't finished</span> when we got there.\n<span class='k'>Had</span> you <span class='k'>seen</span> him before?"},
    {h:"Zaman çizgisi", p:["İki geçmiş olay varsa: <strong>önce olan → Past Perfect</strong>, <strong>sonra olan → Past Simple</strong>."],
      code:"<span class='c'>// Zaman ekseni</span>\n[had eaten] ────► [arrived] ────► NOW\n     ↑                  ↑\n Past Perfect      Past Simple\n\nWhen I <span class='k'>arrived</span>, they <span class='k'>had</span> already <span class='k'>eaten</span>.\n<span class='c'>// Ben varmadan önce yemişlerdi.</span>"},
    {h:"Usage", list:["Geçmişte bir olaydan önce tamamlanmış eylem","<em>after / before / by the time / already / never…before</em> ile","Reported speech'te Past Simple ve Present Perfect'in geriye kayması","Type 3 Conditional ve <em>wish</em> yapılarında"],
      ex:[["The train <span class='hl'>had left</span> by the time we reached the station.","İstasyona vardığımızda tren kalkmıştı."],
        ["She told me she <span class='hl'>had seen</span> the film before.","Filmi daha önce gördüğünü söyledi. (reported)"],
        ["I <span class='hl'>had never tasted</span> Indian food until last week.","Geçen haftaya kadar hiç Hint yemeği tatmamıştım."],
        ["If he <span class='hl'>had studied</span>, he would have passed.","Çalışsaydı geçerdi. (Type 3)"],
        ["After they <span class='hl'>had signed</span> the contract, they celebrated.","Sözleşmeyi imzaladıktan sonra kutlama yaptılar."]]},
    {h:"Ne zaman gerekmez", p:["Olaylar <code>after</code> / <code>before</code> ile zaten sıralanmışsa Past Simple yeterlidir: <em>After he finished work, he went home.</em> Past Perfect zorunlu değildir — ama yanlış da değildir."],
      callout:{t:"Sık hata kaynağı",b:"Türkçedeki \"-mıştı\" her zaman Past Perfect değildir. Karşılaştırma noktası yoksa Past Simple kullanılır: <em>I saw that film.</em> (O filmi görmüştüm.)"}},
    {h:"Common Mistakes", pairs:[
      ["I had gone to school yesterday.","I went to school yesterday.","Referans noktası yok → Past Simple."],
      ["When I arrived, he already left.","When I arrived, he had already left.","Önce olan eylem Past Perfect olmalı."],
      ["He had wrote the letter.","He had written the letter.","<em>had</em> + V3."]]}
  ],
  related:["past-simple","past-perfect-continuous","reported-speech","conditionals"]
},
{
  id:"past-perfect-continuous", title:"Past Perfect Continuous", tr:"Geçmişte Süregelmiş Tamamlanmış Zaman", level:"B2", tags:["tense","past","perfect"],
  intro:"Past Perfect Continuous, geçmişteki bir andan <strong>önce bir süre devam etmiş</strong> eylemi anlatır. Süre ve sebep-sonuç ilişkisi vurgulanır.",
  sections:[
    {h:"Form", code:"S + had + been + V-ing\n\nShe <span class='k'>had been working</span> there for ten years before she resigned.\nThey <span class='k'>hadn't been talking</span> long when the fight started.\n<span class='k'>Had</span> you <span class='k'>been waiting</span> long?"},
    {h:"Usage", list:["Geçmişteki bir noktaya kadar süren eylem (for / since ile)","Geçmişteki bir durumun sebebini açıklama","Kesintiye uğrayan uzun süreçli eylem"],
      ex:[["He <span class='hl'>had been driving</span> for six hours when he finally stopped.","Sonunda durduğunda altı saattir araba kullanıyordu."],
        ["The ground was wet because it <span class='hl'>had been raining</span>.","Yerler ıslaktı çünkü yağmur yağmıştı. (sebep)"],
        ["She was tired — she <span class='hl'>had been studying</span> all night.","Yorgundu — bütün gece ders çalışmıştı."],
        ["We <span class='hl'>had been living</span> in Izmir before we moved to Bursa.","Bursa'ya taşınmadan önce İzmir'de yaşıyorduk."]]},
    {h:"Past Perfect ile fark", table:{head:["Past Perfect","Past Perfect Continuous"],rows:[
      ["Tamamlanmışlık / sonuç","Süreç / süre"],
      ["She <strong>had written</strong> three reports.","She <strong>had been writing</strong> reports all day."],
      ["When I arrived, he <strong>had left</strong>. (gitmişti)","When I arrived, he <strong>had been waiting</strong> for an hour. (bekliyordu)"]]}},
    {h:"Common Mistakes", pairs:[
      ["He had been knowing her for years.","He had known her for years.","State verb."],
      ["She had been worked all day.","She had been working all day.","<em>been</em> + V-ing."]]}
  ],
  related:["past-perfect","present-perfect-continuous","past-continuous"]
},
{
  id:"future-will", title:"Future — Will", tr:"Will ile Gelecek", level:"A2", tags:["tense","future","modal"],
  intro:"<code>will</code>, geleceğe dair <strong>anlık kararları, tahminleri, sözleri ve tekliflerin</strong> ifadesidir. Konuşma anında oluşan gelecek düşüncesidir — planlanmış değil.",
  sections:[
    {h:"Form", code:"S + will + V1        I <span class='k'>will help</span> you. → I<span class='k'>'ll</span> help you.\nS + won't + V1       He <span class='k'>won't come</span>.\nWill + S + V1?       <span class='k'>Will</span> you <span class='k'>join</span> us?",
      callout:{t:"Not",b:"<code>will</code> bir modal fiildir: tüm şahıslarda aynıdır, <em>-s</em> almaz, arkasından her zaman V1 gelir. ❌ <em>He wills come</em> / ❌ <em>He will comes</em>."}},
    {h:"Usage", table:{head:["Kullanım","Örnek"],rows:[
      ["<strong>Anlık karar</strong>","The phone is ringing — I'll get it."],
      ["<strong>Tahmin (kanıtsız)</strong>","I think it will rain tomorrow."],
      ["<strong>Söz verme</strong>","I'll call you as soon as I land."],
      ["<strong>Teklif / rica</strong>","Will you help me with this box?"],
      ["<strong>Kararlılık / reddetme</strong>","I won't accept these terms."],
      ["<strong>Gelecekteki gerçek</strong>","She will be 30 next month."]]},
      ex:[["Don't worry, I <span class='hl'>will</span> take care of it.","Merak etme, ben halledeceğim. (anlık karar)"],
        ["I think Türkiye <span class='hl'>will win</span> the match.","Bence Türkiye maçı kazanır. (tahmin)"],
        ["The door <span class='hl'>won't</span> open.","Kapı açılmıyor. (direnç / reddetme)"],
        ["<span class='hl'>Will</span> you <span class='hl'>pass</span> me the salt?","Tuzu uzatır mısın? (rica)"]]},
    {h:"will vs going to", table:{head:["will","be going to"],rows:[
      ["Anlık karar: I'll have the soup.","Önceden verilmiş karar: I'm going to order the soup."],
      ["Kanıtsız tahmin: It will be a good year.","Kanıtlı tahmin: Look at those clouds — it's going to rain."],
      ["Söz, teklif, rica","Plan, niyet"]]}},
    {h:"Zaman cümlelerinde will kullanılmaz", p:["<code>when, after, before, as soon as, until, if</code> ile başlayan yan cümlede <strong>will kullanılmaz</strong>; Present Simple kullanılır."],
      ex:[["I'll call you when I <span class='hl'>arrive</span>.","Varınca seni ararım. (❌ when I will arrive)"],["We'll start as soon as everyone <span class='hl'>is</span> here.","Herkes gelir gelmez başlarız."]]},
    {h:"Common Mistakes", pairs:[
      ["I will to help you.","I will help you.","Modal sonrası <em>to</em> yok."],
      ["When I will see him, I'll tell him.","When I see him, I'll tell him.","Zaman cümlesinde will olmaz."],
      ["He will comes tomorrow.","He will come tomorrow.","Modal sonrası V1."]]}
  ],
  related:["future-going-to","modal-verbs","future-continuous","conditionals"]
},
{
  id:"future-going-to", title:"Future — Going To", tr:"Going To ile Gelecek", level:"A2", tags:["tense","future"],
  intro:"<code>be going to</code>, <strong>önceden verilmiş kararları (niyet)</strong> ve <strong>şu anki kanıta dayanan tahminleri</strong> anlatır. Konuşmadan önce zaten kafanda olan gelecektir.",
  sections:[
    {h:"Form", code:"S + am/is/are + going to + V1\n\nI <span class='k'>am going to start</span> a new job.\nShe <span class='k'>isn't going to accept</span> the offer.\n<span class='k'>Are</span> you <span class='k'>going to tell</span> him?"},
    {h:"Usage", list:["<strong>Niyet / plan</strong> — karar konuşmadan önce verilmiş","<strong>Kanıta dayalı tahmin</strong> — şu an görülen delil geleceği işaret ediyor"],
      ex:[["We <span class='hl'>are going to buy</span> a house next year.","Gelecek yıl ev alacağız. (plan)"],
        ["Look at the sky — it <span class='hl'>is going to snow</span>.","Gökyüzüne bak — kar yağacak. (kanıt)"],
        ["I <span class='hl'>am going to study</span> medicine.","Tıp okuyacağım. (niyet)"],
        ["He's driving too fast; he <span class='hl'>is going to crash</span>.","Çok hızlı gidiyor; kaza yapacak."]]},
    {h:"going to vs Present Continuous", p:["İkisi de gelecek plan anlatır; fark kesinlik derecesindedir. <strong>Present Continuous</strong> takvime girmiş, düzenlemesi yapılmış planlar içindir; <strong>going to</strong> niyet düzeyinde kalabilir."],
      ex:[["I<span class='hl'>'m meeting</span> the dentist at 3 p.m.","Saat 3'te dişçiyle görüşüyorum. (randevu alınmış)"],["I<span class='hl'>'m going to see</span> a dentist soon.","Yakında bir dişçiye gideceğim. (niyet)"]]},
    {h:"Common Mistakes", pairs:[
      ["I am going to shopping.","I am going shopping. / I am going to shop.","<em>going to</em> + V1; <em>go shopping</em> kalıbı ayrıdır."],
      ["She going to call you.","She is going to call you.","<em>be</em> düşürülemez."],
      ["I am going to can help.","I will be able to help.","Modal sonrası modal gelmez."]]}
  ],
  related:["future-will","present-continuous","future-continuous"]
},
{
  id:"future-continuous", title:"Future Continuous", tr:"Gelecekte Süregelen Zaman", level:"B2", tags:["tense","future"],
  intro:"Future Continuous, gelecekteki <strong>belirli bir anda devam ediyor olacak</strong> eylemi anlatır. Ayrıca kibar soru sormanın da yoludur.",
  sections:[
    {h:"Form", code:"S + will be + V-ing\n\nThis time tomorrow I <span class='k'>will be flying</span> to Berlin.\nThey <span class='k'>won't be working</span> on Sunday.\n<span class='k'>Will</span> you <span class='k'>be using</span> the car tonight?"},
    {h:"Usage", list:["Gelecekte bir anda süregelen eylem","Gelecekte planlanmış rutin/beklenen eylem","Kibar soru — karşı tarafın planını öğrenme (baskı kurmadan)"],
      ex:[["At 8 p.m. tonight we <span class='hl'>will be having</span> dinner.","Bu akşam 8'de yemek yiyor olacağız."],
        ["Don't call at nine — I <span class='hl'>will be driving</span>.","Dokuzda arama — araba kullanıyor olacağım."],
        ["<span class='hl'>Will</span> you <span class='hl'>be joining</span> us for lunch?","Öğle yemeğine bize katılacak mısınız? (kibar)"],
        ["This time next year she <span class='hl'>will be studying</span> in Germany.","Gelecek yıl bu zamanlar Almanya'da okuyor olacak."]]},
    {h:"Common Mistakes", pairs:[
      ["I will be go there.","I will be going there.","<em>will be</em> + V-ing."],
      ["Tomorrow at ten I will work.","Tomorrow at ten I will be working.","Belirli anda süregelen eylem."]]}
  ],
  related:["future-will","future-perfect","present-continuous"]
},
{
  id:"future-perfect", title:"Future Perfect", tr:"Gelecekte Tamamlanmış Zaman", level:"B2", tags:["tense","future","perfect"],
  intro:"Future Perfect, gelecekteki <strong>belirli bir ana kadar tamamlanmış olacak</strong> eylemi anlatır. Neredeyse her zaman <code>by</code> ile birlikte kullanılır.",
  sections:[
    {h:"Form", code:"S + will have + V3\n\nBy 2030 I <span class='k'>will have finished</span> my PhD.\nShe <span class='k'>won't have arrived</span> by then.\n<span class='k'>Will</span> they <span class='k'>have completed</span> the project by June?"},
    {h:"Usage", p:["Bitiş noktası belirten ifadelerle kullanılır: <code>by tomorrow</code>, <code>by next year</code>, <code>by the time…</code>, <code>before…</code>, <code>in two weeks' time</code>."],
      ex:[["By the time you wake up, I <span class='hl'>will have left</span>.","Sen uyandığında ben gitmiş olacağım."],
        ["They <span class='hl'>will have built</span> the bridge by December.","Aralığa kadar köprüyü bitirmiş olacaklar."],
        ["In ten years he <span class='hl'>will have paid</span> off the loan.","On yıl içinde krediyi ödemiş olacak."]]},
    {h:"Common Mistakes", pairs:[
      ["By June I will finish the report.","By June I will have finished the report.","<em>by</em> + gelecek nokta → Future Perfect."],
      ["By the time you will come, I will have gone.","By the time you come, I will have gone.","Zaman cümlesinde will yok."]]}
  ],
  related:["future-perfect-continuous","future-continuous","present-perfect"]
},
{
  id:"future-perfect-continuous", title:"Future Perfect Continuous", tr:"Gelecekte Süregelmiş Tamamlanmış Zaman", level:"C1", tags:["tense","future","perfect"],
  intro:"Future Perfect Continuous, gelecekteki bir ana kadar <strong>ne kadar süredir devam ediyor olacağını</strong> anlatır. En az kullanılan zamandır ama süre vurgusu gerektiğinde başka alternatifi yoktur.",
  sections:[
    {h:"Form", code:"S + will have been + V-ing\n\nBy next month, I <span class='k'>will have been working</span> here for five years.\nShe <span class='k'>won't have been waiting</span> long.\n<span class='k'>Will</span> you <span class='k'>have been living</span> abroad for a decade by then?"},
    {h:"Usage", ex:[["In August we <span class='hl'>will have been living</span> in this flat for ten years.","Ağustosta bu dairede on yıldır yaşıyor olacağız."],
      ["By the time the train arrives, I <span class='hl'>will have been standing</span> here for an hour.","Tren geldiğinde bir saattir burada bekliyor olacağım."],
      ["Next year she <span class='hl'>will have been teaching</span> for two decades.","Gelecek yıl yirmi yıldır öğretmenlik yapıyor olacak."]],
      callout:{t:"Ne zaman kullanılmaz",b:"State verb'lerle kullanılmaz: ❌ <em>I will have been knowing him for years</em> → ✅ <em>I will have known him for years</em> (Future Perfect)."}},
    {h:"Common Mistakes", pairs:[
      ["By 2030 I will have been worked here for 10 years.","By 2030 I will have been working here for 10 years.","<em>been</em> + V-ing."],
      ["By June I will be working here for 5 years.","By June I will have been working here for 5 years.","Süre + gelecek nokta → Future Perfect Continuous."]]}
  ],
  related:["future-perfect","present-perfect-continuous"]
},
{
  id:"passive-voice", title:"Passive Voice", tr:"Edilgen Çatı", level:"B1", tags:["verb","passive"],
  intro:"Passive Voice, eylemi <strong>yapanın değil, eylemden etkilenenin</strong> öne çıkarıldığı yapıdır. Türkçedeki \"-il / -in\" ekinin karşılığıdır: <em>yazıldı, kırıldı, gönderiliyor</em>. Akademik ve resmî yazının omurgasıdır.",
  sections:[
    {h:"Form", p:["Formül tüm zamanlarda aynıdır: <strong>be fiili (zamana göre çekilir) + V3</strong>. Değişen tek şey <em>be</em>'nin hâlidir."],
      code:"<span class='c'>// Active → Passive dönüşümü</span>\nActive:   The chef  <span class='k'>cooked</span>  the meal.\n           (özne)    (fiil)   (nesne)\n              ↓         ↓        ↓\nPassive:  The meal <span class='k'>was cooked</span> (by the chef).\n           (yeni özne)  (be+V3)   (fail — isteğe bağlı)"},
    {h:"Tüm zamanlarda passive", table:{head:["Tense","Active","Passive"],rows:[
      ["Present Simple","They <strong>clean</strong> the office.","The office <strong>is cleaned</strong>."],
      ["Present Continuous","They <strong>are cleaning</strong> it.","It <strong>is being cleaned</strong>."],
      ["Past Simple","They <strong>cleaned</strong> it.","It <strong>was cleaned</strong>."],
      ["Past Continuous","They <strong>were cleaning</strong> it.","It <strong>was being cleaned</strong>."],
      ["Present Perfect","They <strong>have cleaned</strong> it.","It <strong>has been cleaned</strong>."],
      ["Past Perfect","They <strong>had cleaned</strong> it.","It <strong>had been cleaned</strong>."],
      ["Future Will","They <strong>will clean</strong> it.","It <strong>will be cleaned</strong>."],
      ["Future Perfect","They <strong>will have cleaned</strong> it.","It <strong>will have been cleaned</strong>."],
      ["Going to","They <strong>are going to clean</strong> it.","It <strong>is going to be cleaned</strong>."],
      ["Modal","They <strong>must clean</strong> it.","It <strong>must be cleaned</strong>."],
      ["Modal perfect","They <strong>should have cleaned</strong> it.","It <strong>should have been cleaned</strong>."]]},
      callout:{t:"Not",b:"Present Perfect Continuous ve Future Continuous'un passive'i pratikte kullanılmaz (<em>has been being cleaned</em> kulağa yanlış gelir). Bu durumda aktif cümle tercih edilir."}},
    {h:"Ne zaman passive kullanılır", list:["<strong>Faili bilmiyoruz:</strong> My bike was stolen.","<strong>Fail önemsiz:</strong> The road is being repaired.","<strong>Fail açık/genel:</strong> He was arrested. (polis tarafından, söylemeye gerek yok)","<strong>Nesne odaklı vurgu:</strong> The Mona Lisa was painted by da Vinci.","<strong>Resmî/tarafsız üslup:</strong> The samples were analysed in three stages.","<strong>Sorumluluğu gizleme:</strong> Mistakes were made."],
      ex:[["This bridge <span class='hl'>was built</span> in 1973.","Bu köprü 1973'te inşa edildi."],
        ["Your application <span class='hl'>is being reviewed</span>.","Başvurunuz inceleniyor."],
        ["The results <span class='hl'>will be announced</span> on Monday.","Sonuçlar pazartesi açıklanacak."],
        ["All documents <span class='hl'>must be signed</span> before Friday.","Tüm belgeler cumadan önce imzalanmalı."],
        ["Nothing <span class='hl'>has been decided</span> yet.","Henüz hiçbir şeye karar verilmedi."]]},
    {h:"İki nesneli fiiller", p:["<code>give, send, offer, tell, show, teach, pay, lend</code> gibi fiillerin iki nesnesi vardır; ikisi de passive öznesi olabilir. İngilizce <strong>kişiyi öne almayı</strong> tercih eder."],
      ex:[["They gave <u>me</u> <u>a prize</u>. → <span class='hl'>I was given</span> a prize.","Bana bir ödül verildi. (tercih edilen)"],["→ <span class='hl'>A prize was given</span> to me.","Bir ödül bana verildi. (daha az yaygın)"]]},
    {h:"Passive olamayan fiiller", p:["Geçişsiz (intransitive — nesne almayan) fiiller passive olmaz: <code>happen, occur, arrive, come, go, sleep, die, rise, fall, exist</code>."],
      pairs:[["The accident was happened yesterday.","The accident happened yesterday.","<em>happen</em> nesne almaz, passive olamaz."],
        ["He was died in 1998.","He died in 1998.","<em>die</em> geçişsizdir."]]},
    {h:"Common Mistakes", pairs:[
      ["The letter was wrote by Ali.","The letter was written by Ali.","V3 gerekir, V2 değil."],
      ["The house is build now.","The house is being built now.","Present Continuous passive: <em>is being</em> + V3."],
      ["It has been happened.","It has happened.","Geçişsiz fiil."],
      ["This book was writing by her.","This book was written by her.","Passive'de V3, V-ing değil."]]}
  ],
  related:["causative","passive-infinitives-gerunds","reported-speech"]
},
{
  id:"causative", title:"Causative", tr:"Ettirgen Yapı", level:"B2", tags:["verb"],
  intro:"Causative, bir işi <strong>kendin yapmadığın, başkasına yaptırdığın</strong> durumları anlatır. Türkçedeki \"-tır / -dır\" ettirgen ekinin karşılığıdır: <em>saçımı kestirdim, arabayı tamir ettirdim</em>.",
  sections:[
    {h:"Form", code:"<span class='c'>// have / get + NESNE + V3  (kim yaptığı önemsiz)</span>\nS + have + O + V3      I <span class='k'>had</span> my car <span class='k'>repaired</span>.\nS + get + O + V3       I <span class='k'>got</span> my hair <span class='k'>cut</span>.\n\n<span class='c'>// have / get + KİŞİ + fiil  (kimin yaptığı söyleniyor)</span>\nS + have + kişi + V1        I <span class='k'>had</span> the mechanic <span class='k'>check</span> it.\nS + get + kişi + to + V1    I <span class='k'>got</span> the mechanic <span class='k'>to check</span> it.\n\n<span class='c'>// make / let</span>\nmake + kişi + V1       She <span class='k'>made</span> him <span class='k'>apologise</span>.  (zorlama)\nlet + kişi + V1        They <span class='k'>let</span> me <span class='k'>go</span> early.     (izin)"},
    {h:"have vs get vs make vs let", table:{head:["Yapı","Anlam","Örnek"],rows:[
      ["<code>have sth done</code>","Hizmet aldın, nötr","I had the walls painted."],
      ["<code>get sth done</code>","Aynı anlam, daha konuşma dili / çaba vurgusu","I got the walls painted."],
      ["<code>have sb do</code>","Yetki ile yaptırma","I had my assistant book the flight."],
      ["<code>get sb to do</code>","İkna ederek yaptırma","I got my brother to lend me his car."],
      ["<code>make sb do</code>","Zorlama","The teacher made us rewrite it."],
      ["<code>let sb do</code>","İzin verme","My parents let me stay out late."]]}},
    {h:"Examples", ex:[["We <span class='hl'>had</span> the roof <span class='hl'>fixed</span> last week.","Geçen hafta çatıyı tamir ettirdik."],
      ["She's going to <span class='hl'>get</span> her eyes <span class='hl'>tested</span>.","Gözlerini muayene ettirecek."],
      ["I <span class='hl'>had</span> the waiter <span class='hl'>bring</span> more water.","Garsona daha fazla su getirttim."],
      ["He <span class='hl'>got</span> his colleague <span class='hl'>to cover</span> his shift.","Meslektaşını vardiyasını devralmaya ikna etti."],
      ["Don't <span class='hl'>make</span> me <span class='hl'>repeat</span> myself.","Kendimi tekrar ettirme."],
      ["They didn't <span class='hl'>let</span> us <span class='hl'>take</span> photos.","Fotoğraf çekmemize izin vermediler."]]},
    {h:"Kötü deneyim anlatımı", p:["Causative aynı zamanda başına gelen olumsuz şeyleri anlatır — burada \"yaptırma\" yoktur:"],
      ex:[["He <span class='hl'>had</span> his phone <span class='hl'>stolen</span> on the bus.","Otobüste telefonu çalındı."],["She <span class='hl'>had</span> her flight <span class='hl'>cancelled</span>.","Uçuşu iptal edildi."]]},
    {h:"Common Mistakes", pairs:[
      ["I cut my hair yesterday.","I had my hair cut yesterday.","Kendin kesmediysen causative gerekir."],
      ["I had repaired my car by a mechanic.","I had my car repaired by a mechanic.","Nesne fiilden önce gelir."],
      ["She made me to wait.","She made me wait.","<em>make</em> sonrası <em>to</em> yok."],
      ["They let me to leave.","They let me leave.","<em>let</em> sonrası <em>to</em> yok."],
      ["I got him do it.","I got him to do it.","<em>get</em> + kişi + <em>to</em> + V1."]]}
  ],
  related:["passive-voice","modal-verbs","gerunds-infinitives"]
},
{
  id:"reported-speech", title:"Reported Speech", tr:"Dolaylı Anlatım", level:"B1", tags:["verb","clause"],
  intro:"Reported Speech, birinin söylediğini <strong>tırnak kullanmadan aktarma</strong> yoludur. Aktarma fiili geçmiş zamanda olduğunda cümledeki zamanlar bir adım geriye kayar (backshift).",
  sections:[
    {h:"Backshift tablosu", table:{head:["Direct speech","Reported speech"],rows:[
      ["Present Simple — <em>work</em>","Past Simple — <em>worked</em>"],
      ["Present Continuous — <em>am working</em>","Past Continuous — <em>was working</em>"],
      ["Past Simple — <em>worked</em>","Past Perfect — <em>had worked</em>"],
      ["Present Perfect — <em>have worked</em>","Past Perfect — <em>had worked</em>"],
      ["Past Perfect — <em>had worked</em>","Past Perfect (değişmez)"],
      ["will","would"],["can","could"],["may","might"],["must","had to / must"],
      ["should / could / might / would","değişmez"]]}},
    {h:"Zaman ve yer ifadeleri", table:{head:["Direct","Reported"],rows:[
      ["now","then"],["today","that day"],["tonight","that night"],["yesterday","the day before / the previous day"],
      ["tomorrow","the next day / the following day"],["last week","the week before"],["next month","the following month"],
      ["here","there"],["this","that"],["these","those"],["ago","before"]]}},
    {h:"Statements — düz cümle aktarımı", code:"S + said (that) + cümle\nS + told + kişi + (that) + cümle\n\n<span class='c'>// say sonrası nesne gelmez, tell sonrası kişi zorunludur</span>\nHe <span class='k'>said</span> (that) he was tired.        ✅\nHe <span class='k'>told me</span> (that) he was tired.     ✅\nHe <span class='k'>said me</span> that…                   ❌",
      ex:[["\"I am busy.\" → He said he <span class='hl'>was</span> busy.","\"Meşgulüm.\" → Meşgul olduğunu söyledi."],
        ["\"We have finished.\" → They said they <span class='hl'>had finished</span>.","Bitirdiklerini söylediler."],
        ["\"I'll call you.\" → She said she <span class='hl'>would</span> call me.","Beni arayacağını söyledi."],
        ["\"I saw him yesterday.\" → He said he <span class='hl'>had seen</span> him <span class='hl'>the day before</span>.","Onu bir önceki gün gördüğünü söyledi."]]},
    {h:"Questions — soru aktarımı", p:["Aktarılan soruda <strong>düz cümle sırası</strong> kullanılır: yardımcı fiil öne alınmaz, soru işareti yoktur."],
      code:"<span class='c'>// Wh- sorusu</span>\nS + asked (+kişi) + wh-word + S + V\n\"Where do you live?\" → She asked me <span class='k'>where I lived</span>.\n\n<span class='c'>// Yes/No sorusu → if / whether</span>\nS + asked (+kişi) + if/whether + S + V\n\"Do you smoke?\" → He asked <span class='k'>if I smoked</span>.",
      ex:[["\"What are you doing?\" → He asked what I <span class='hl'>was doing</span>.","Ne yaptığımı sordu."],["\"Have you eaten?\" → She asked <span class='hl'>whether I had eaten</span>.","Yiyip yemediğimi sordu."]]},
    {h:"Commands & requests — emir ve rica", code:"tell / ask / order / advise / warn + kişi + (not) to + V1\n\n\"Sit down.\"        → He <span class='k'>told me to sit</span> down.\n\"Please help me.\"  → She <span class='k'>asked me to help</span> her.\n\"Don't touch it.\"  → He <span class='k'>told me not to touch</span> it."},
    {h:"Backshift yapılmayan durumlar", list:["Aktarma fiili Present ise: <em>He says he is tired.</em>","Hâlâ geçerli genel gerçek: <em>She said that water boils at 100°C.</em>","Type 2/3 conditional ve <em>wish</em> yapıları değişmez","Past Perfect zaten en geride olduğu için değişmez"],
      callout:{t:"Nüans",b:"Modern İngilizcede hâlâ doğru olan bilgilerde backshift isteğe bağlıdır: <em>He said he lives in Ankara</em> (hâlâ yaşıyor) da doğrudur."}},
    {h:"Common Mistakes", pairs:[
      ["He said me he was late.","He told me he was late. / He said he was late.","<em>say</em> nesne almaz."],
      ["She asked me where did I live.","She asked me where I lived.","Aktarılan soruda düz sıra."],
      ["He told to me the news.","He told me the news.","<em>tell</em> sonrası <em>to</em> yok."],
      ["He said me to sit down.","He told me to sit down.","Emir aktarımında <em>tell</em>."]]}
  ],
  related:["indirect-questions","past-perfect","noun-clauses"]
},
{
  id:"conditionals", title:"Conditionals", tr:"Koşul Cümleleri", level:"A2–B1", tags:["verb","clause"],
  intro:"Conditionals, <strong>bir koşula bağlı sonuçları</strong> anlatır: \"eğer… ise…\". Dört temel tip vardır ve her biri farklı bir gerçeklik derecesi taşır: kesin gerçek, olası gelecek, hayalî şimdi, imkânsız geçmiş.",
  sections:[
    {h:"Dört tip tek tabloda", table:{head:["Tip","If-clause","Main clause","Gerçeklik"],rows:[
      ["<strong>Type 0</strong>","if + Present Simple","Present Simple","Her zaman doğru — genel gerçek"],
      ["<strong>Type 1</strong>","if + Present Simple","will / can / may + V1","Gerçekçi gelecek olasılığı"],
      ["<strong>Type 2</strong>","if + Past Simple","would / could / might + V1","Şimdiki hayalî durum"],
      ["<strong>Type 3</strong>","if + Past Perfect","would have + V3","Geçmişte olmamış — pişmanlık"]]}},
    {h:"Type 0 — Genel gerçek", code:"If + Present Simple, Present Simple\n\nIf you <span class='k'>heat</span> ice, it <span class='k'>melts</span>.\nIf I <span class='k'>drink</span> coffee at night, I <span class='k'>can't sleep</span>.",
      p:["Bu tipte <code>if</code> yerine <code>when</code> kullanılabilir; anlam değişmez."],
      ex:[["If water <span class='hl'>reaches</span> 100°C, it <span class='hl'>boils</span>.","Su 100 dereceye ulaşırsa kaynar."],["If you <span class='hl'>press</span> this button, the machine <span class='hl'>stops</span>.","Bu düğmeye basarsan makine durur."]]},
    {h:"Type 1 — Gerçekçi gelecek", code:"If + Present Simple, will + V1\n\nIf it <span class='k'>rains</span>, we <span class='k'>will stay</span> at home.\nIf you <span class='k'>study</span>, you <span class='k'>will pass</span>.",
      p:["<code>will</code> yerine <code>can, may, might, should, must</code> ya da emir kipi de gelebilir."],
      ex:[["If you <span class='hl'>finish</span> early, you <span class='hl'>can</span> leave.","Erken bitirirsen çıkabilirsin."],
        ["If he <span class='hl'>calls</span>, <span class='hl'>tell</span> him I'm out.","Ararsa dışarıda olduğumu söyle."],
        ["<span class='hl'>Unless</span> you hurry, you <span class='hl'>will miss</span> the train.","Acele etmezsen treni kaçıracaksın. (unless = if…not)"]]},
    {h:"Type 2 — Hayalî şimdi", code:"If + Past Simple, would + V1\n\nIf I <span class='k'>had</span> more time, I <span class='k'>would learn</span> Spanish.\nIf I <span class='k'>were</span> you, I <span class='k'>would accept</span> the offer.",
      p:["Bu yapıda <em>be</em> fiili tüm şahıslarda <code>were</code> olur (subjunctive kalıntısı). <em>If I was…</em> konuşma dilinde kabul edilir ama sınavda <code>were</code> güvenlidir."],
      ex:[["If I <span class='hl'>won</span> the lottery, I <span class='hl'>would buy</span> a boat.","Piyangoyu kazansam bir tekne alırdım."],
        ["If she <span class='hl'>spoke</span> French, she <span class='hl'>could work</span> in Paris.","Fransızca konuşsa Paris'te çalışabilirdi."],
        ["If I <span class='hl'>were</span> in your position, I <span class='hl'>wouldn't wait</span>.","Senin yerinde olsam beklemezdim."]]},
    {h:"Type 3 — İmkânsız geçmiş", code:"If + Past Perfect, would have + V3\n\nIf you <span class='k'>had told</span> me, I <span class='k'>would have helped</span>.\nIf we <span class='k'>hadn't missed</span> the flight, we <span class='k'>would have arrived</span> on time.",
      ex:[["If he <span class='hl'>had studied</span>, he <span class='hl'>would have passed</span>.","Çalışsaydı geçerdi. (çalışmadı, geçemedi)"],
        ["If they <span class='hl'>had left</span> earlier, they <span class='hl'>wouldn't have been</span> stuck in traffic.","Daha erken çıksalardı trafikte kalmazlardı."],
        ["I <span class='hl'>would have called</span> you if I <span class='hl'>had known</span>.","Bilseydim seni arardım."]]},
    {h:"Yazım kuralı — virgül", p:["<code>if</code> cümlesi <strong>başta</strong> ise virgül konur; <strong>sonda</strong> ise konmaz."],
      ex:[["If it rains<span class='hl'>,</span> I'll stay home.","(if önde → virgül var)"],["I'll stay home if it rains.","(if arkada → virgül yok)"]]},
    {h:"Common Mistakes", pairs:[
      ["If I will have time, I will call you.","If I have time, I will call you.","If-clause içinde <em>will</em> olmaz."],
      ["If I would be you, I would go.","If I were you, I would go.","Type 2'de <em>were</em>."],
      ["If he would have known, he would have come.","If he had known, he would have come.","Type 3'te if-clause = <em>had</em> + V3."],
      ["Unless you don't hurry, you'll be late.","Unless you hurry, you'll be late.","<em>unless</em> zaten olumsuzdur."]]}
  ],
  related:["mixed-conditionals","wish-if-only","subjunctive","future-will"]
},
{
  id:"mixed-conditionals", title:"Mixed Conditionals", tr:"Karışık Koşul Cümleleri", level:"B2", tags:["verb","clause"],
  intro:"Mixed Conditionals, koşul ile sonucun <strong>farklı zamanlarda</strong> olduğu cümlelerdir. Type 2 ve Type 3'ün parçaları birleştirilir.",
  sections:[
    {h:"İki temel kalıp", table:{head:["Kalıp","If-clause","Main clause","Anlam"],rows:[
      ["<strong>Geçmiş → Şimdi</strong>","if + had V3","would + V1","Geçmişteki bir şey olsaydı, şimdi farklı olurdu"],
      ["<strong>Şimdi → Geçmiş</strong>","if + Past Simple","would have + V3","Şimdiki durum farklı olsaydı, geçmişte farklı olurdu"]]}},
    {h:"Geçmiş sebep → şimdiki sonuç", code:"If + had + V3, would + V1\n\nIf I <span class='k'>had studied</span> medicine, I <span class='k'>would be</span> a doctor now.",
      ex:[["If she <span class='hl'>had taken</span> the job, she <span class='hl'>would live</span> in Berlin now.","O işi kabul etseydi şimdi Berlin'de yaşıyor olurdu."],
        ["If I <span class='hl'>hadn't missed</span> the train, I <span class='hl'>would be</span> at the office.","Treni kaçırmasaydım şimdi ofiste olurdum."],
        ["If they <span class='hl'>had saved</span> money, they <span class='hl'>wouldn't have</span> debts today.","Para biriktirselerdi bugün borçları olmazdı."]]},
    {h:"Şimdiki durum → geçmiş sonuç", code:"If + Past Simple, would have + V3\n\nIf I <span class='k'>were</span> more careful, I <span class='k'>wouldn't have broken</span> it.",
      ex:[["If he <span class='hl'>weren't</span> so shy, he <span class='hl'>would have asked</span> her out.","Bu kadar utangaç olmasa ona çıkma teklif ederdi."],
        ["If I <span class='hl'>spoke</span> Japanese, I <span class='hl'>would have applied</span> for that job.","Japonca bilseydim o işe başvururdum."]]},
    {h:"Common Mistakes", pairs:[
      ["If I had studied harder, I would have a better job now — I would have had.","If I had studied harder, I would have a better job now.","Sonuç şimdiye aitse <em>would</em> + V1."],
      ["If I would have known, I would be there.","If I had known, I would be there.","If-clause'da <em>would</em> olmaz."]]}
  ],
  related:["conditionals","wish-if-only","past-perfect"]
},
{
  id:"wish-if-only", title:"Wish / If Only", tr:"Dilek ve Pişmanlık", level:"B1", tags:["verb","clause"],
  intro:"<code>wish</code> ve <code>if only</code>, gerçekleşmemiş dilekleri ve pişmanlıkları anlatır. <code>if only</code> daha güçlü ve duygusaldır; yapı olarak ikisi aynıdır.",
  sections:[
    {h:"Üç zaman, üç anlam", table:{head:["Yapı","Zaman","Anlam"],rows:[
      ["wish + Past Simple","Şimdi","Şu anki durumdan memnuniyetsizlik"],
      ["wish + Past Perfect","Geçmiş","Geçmiş için pişmanlık"],
      ["wish + would + V1","Gelecek / davranış","Başkasının davranışından rahatsızlık"],
      ["wish + could + V1","Yetenek/imkân","Yapamamaktan yakınma"]]}},
    {h:"Examples", ex:[["I <span class='hl'>wish I had</span> more free time.","Keşke daha çok boş vaktim olsa. (yok)"],
      ["She <span class='hl'>wishes she were</span> taller.","Keşke daha uzun olsa."],
      ["I <span class='hl'>wish I had studied</span> harder at school.","Keşke okulda daha çok çalışsaydım. (pişmanlık)"],
      ["I <span class='hl'>wish you wouldn't interrupt</span> me.","Keşke sözümü kesmesen. (rahatsızlık)"],
      ["I <span class='hl'>wish I could come</span> to your wedding.","Keşke düğününe gelebilsem."],
      ["<span class='hl'>If only</span> we <span class='hl'>had left</span> earlier!","Keşke daha erken çıksaydık!"]]},
    {h:"wish + would kuralı", p:["<code>wish + would</code> kendi davranışın için kullanılmaz — kendi davranışını zaten değiştirebilirsin."],
      pairs:[["I wish I would be more organised.","I wish I were more organised.","Kendi durumun için <em>would</em> kullanılmaz."],
        ["I wish it would stop raining.","I wish it would stop raining.","✅ Doğru — kontrolün dışındaki bir şey."]]},
    {h:"hope ile fark", table:{head:["wish","hope"],rows:[
      ["Gerçek dışı, olmayacak","Gerçekçi, mümkün"],
      ["I wish I <strong>knew</strong> the answer. (bilmiyorum)","I hope you <strong>pass</strong> the exam. (geçebilirsin)"],
      ["Past tense ile","Present/Future tense ile"]]}},
    {h:"Common Mistakes", pairs:[
      ["I wish I have a car.","I wish I had a car.","Şimdiki dilek → Past Simple."],
      ["I wish I would have studied.","I wish I had studied.","Geçmiş pişmanlık → Past Perfect."],
      ["I wish you will call me.","I wish you would call me. / I hope you call me.","<em>wish</em> ile <em>will</em> kullanılmaz."]]}
  ],
  related:["conditionals","mixed-conditionals","subjunctive"]
},
{
  id:"subjunctive", title:"Subjunctive", tr:"Dilek Kipi", level:"C1", tags:["verb","formal"],
  intro:"Subjunctive, <strong>öneri, talep, ısrar ve zorunluluk</strong> bildiren fiillerden sonra kullanılan özel yapıdır: yan cümlede fiil <strong>çekilmez</strong>, yalın hâlde kalır. Resmî yazıda ve Amerikan İngilizcesinde yaygındır.",
  sections:[
    {h:"Form", code:"S + suggest/insist/demand/recommend + that + S + <span class='k'>V1</span>\n\nI suggest that he <span class='k'>go</span> immediately.     <span class='c'>// goes değil</span>\nThey demanded that she <span class='k'>be</span> present.     <span class='c'>// is/was değil</span>\nThe doctor recommended that he <span class='k'>not smoke</span>.  <span class='c'>// don't smoke değil</span>"},
    {h:"Subjunctive tetikleyen fiiller", p:["<code>suggest, recommend, propose, insist, demand, request, require, urge, advise, ask, command, order, prefer</code>"],
      ex:[["The board <span class='hl'>insisted that</span> the CEO <span class='hl'>resign</span>.","Yönetim kurulu CEO'nun istifa etmesinde ısrar etti."],
        ["I <span class='hl'>recommend that</span> you <span class='hl'>take</span> the earlier flight.","Erken uçuşu almanızı tavsiye ederim."],
        ["She <span class='hl'>requested that</span> the meeting <span class='hl'>be</span> postponed.","Toplantının ertelenmesini talep etti."]]},
    {h:"Sıfat + that kalıbı", p:["<code>It is essential / important / necessary / vital / crucial / advisable + that + S + V1</code>"],
      ex:[["It is essential that every student <span class='hl'>submit</span> the form.","Her öğrencinin formu teslim etmesi şarttır."],["It is vital that he <span class='hl'>be</span> informed today.","Bugün bilgilendirilmesi hayatidir."]]},
    {h:"Kalıplaşmış subjunctive ifadeler", p:["<code>God bless you</code> · <code>Long live the king</code> · <code>Be that as it may</code> · <code>Come what may</code> · <code>Suffice it to say</code> · <code>So be it</code>"]},
    {h:"Alternatif: should", p:["İngiliz İngilizcesinde subjunctive yerine <code>should + V1</code> kullanılabilir; anlam aynıdır."],
      ex:[["I suggest that he <span class='hl'>should go</span>. (BrE)","≡ I suggest that he go. (AmE)"]]},
    {h:"Common Mistakes", pairs:[
      ["I suggest him to go.","I suggest that he go. / I suggest going.","<em>suggest</em> nesne + to-infinitive almaz."],
      ["She insisted that he came.","She insisted that he come.","Subjunctive'de yalın fiil."],
      ["It is important that he doesn't be late.","It is important that he not be late.","Olumsuzluk <em>not</em> + V1."]]}
  ],
  related:["conditionals","wish-if-only","modal-verbs","noun-clauses"]
},
{
  id:"relative-clauses", title:"Relative Clauses", tr:"İlgi Cümleleri", level:"B1", tags:["clause"],
  intro:"Relative Clauses, bir isim hakkında <strong>ek bilgi veren yan cümlelerdir</strong>. Türkçede sıfat-fiil eklerinin (\"-en, -dığı\") yaptığı işi İngilizce <code>who / which / that</code> ile yapar.",
  sections:[
    {h:"Relative pronouns", table:{head:["Zamir","Kullanım","Örnek"],rows:[
      ["<code>who</code>","İnsan (özne/nesne)","The man <strong>who</strong> called you is my uncle."],
      ["<code>whom</code>","İnsan (nesne, resmî)","The candidate <strong>whom</strong> we interviewed…"],
      ["<code>which</code>","Nesne / hayvan","The book <strong>which</strong> I bought was cheap."],
      ["<code>that</code>","İnsan veya nesne (yalnız defining)","The car <strong>that</strong> he drives is old."],
      ["<code>whose</code>","İyelik","The girl <strong>whose</strong> bag was stolen…"],
      ["<code>where</code>","Yer","The hotel <strong>where</strong> we stayed…"],
      ["<code>when</code>","Zaman","The day <strong>when</strong> we met…"],
      ["<code>why</code>","Sebep","The reason <strong>why</strong> she left…"]]}},
    {h:"Defining — tanımlayıcı", p:["Cümleden çıkarılırsa <strong>hangi</strong> şeyden bahsedildiği anlaşılmaz. <strong>Virgül kullanılmaz</strong>, <code>that</code> kullanılabilir."],
      ex:[["The student <span class='hl'>who sits next to me</span> is from Konya.","Yanımda oturan öğrenci Konyalı. (hangi öğrenci? — zorunlu bilgi)"],
        ["I like books <span class='hl'>that make me think</span>.","Beni düşündüren kitapları severim."]]},
    {h:"Non-defining — tanımlayıcı olmayan", p:["Ek bilgi verir, çıkarılırsa cümle bozulmaz. <strong>Virgül zorunludur</strong>, <code>that</code> <strong>kullanılamaz</strong>."],
      ex:[["My father<span class='hl'>, who is 70,</span> still works.","Babam, ki 70 yaşında, hâlâ çalışıyor."],
        ["Ankara<span class='hl'>, which is the capital,</span> has a dry climate.","Başkent olan Ankara'nın iklimi kurudur."]],
      callout:{t:"Sınav kuralı",b:"Virgül varsa <code>that</code> yasaktır. ❌ <em>My father, that is 70,…</em>"}},
    {h:"Zamiri düşürme (contact clause)", p:["Relative pronoun <strong>nesne</strong> görevindeyse düşürülebilir; <strong>özne</strong> görevindeyse düşürülemez."],
      ex:[["The film (<span class='hl'>that</span>) we watched was boring.","Zamir nesne → düşebilir ✅"],["The man <span class='hl'>who</span> called me was angry.","Zamir özne → düşemez ❌"]]},
    {h:"Preposition + relative pronoun", ex:[["The person <span class='hl'>to whom</span> I spoke was helpful.","Resmî üslup"],["The person <span class='hl'>who</span> I spoke <span class='hl'>to</span> was helpful.","Günlük üslup (edat sonda)"],["The house <span class='hl'>in which</span> she grew up…","≡ The house she grew up <strong>in</strong>…"]]},
    {h:"Common Mistakes", pairs:[
      ["The man which helped me…","The man who helped me…","İnsan için <em>which</em> olmaz."],
      ["The book that I read it was good.","The book that I read was good.","Zamir zaten nesnedir, <em>it</em> tekrar edilmez."],
      ["My mother, that lives in Izmir,…","My mother, who lives in Izmir,…","Non-defining'de <em>that</em> yok."],
      ["The place where I was born there is small.","The place where I was born is small.","<em>where</em> varken <em>there</em> gereksiz."]]}
  ],
  related:["noun-clauses","participle-clauses","cleft-sentences"]
},
{
  id:"gerunds-infinitives", title:"Gerunds & Infinitives", tr:"-ing ve To-mastar", level:"B1", tags:["clause","verb"],
  intro:"Bir fiilden sonra ikinci fiil geldiğinde ya <code>-ing</code> ya <code>to + V1</code> gelir. Bu seçim <strong>ilk fiile bağlıdır</strong> ve ezberlenmesi gerekir; ama mantıklı bir örüntüsü de vardır: <em>to</em> geleceğe/niyete, <em>-ing</em> gerçekleşmiş/genel eyleme bakar.",
  sections:[
    {h:"Sadece -ing alan fiiller", p:["<code>enjoy, avoid, mind, finish, suggest, consider, imagine, deny, admit, risk, practise, miss, postpone, keep, quit, involve, recommend</code>"],
