      ex:[["I enjoy <span class='hl'>reading</span> before bed.","Yatmadan önce okumayı severim."],["He avoided <span class='hl'>answering</span> the question.","Soruyu cevaplamaktan kaçındı."],["Would you mind <span class='hl'>closing</span> the window?","Pencereyi kapatır mısınız?"]]},
    {h:"Sadece to-infinitive alan fiiller", p:["<code>want, need, decide, hope, plan, promise, offer, agree, refuse, manage, afford, learn, seem, appear, pretend, expect, fail, arrange</code>"],
      ex:[["She decided <span class='hl'>to leave</span> the company.","Şirketten ayrılmaya karar verdi."],["They can't afford <span class='hl'>to buy</span> a house.","Ev alacak güçleri yok."],["He promised <span class='hl'>to call</span> me back.","Beni geri arayacağına söz verdi."]]},
    {h:"Nesne + to-infinitive", p:["<code>want / ask / tell / advise / allow / encourage / expect / persuade / remind / warn + kişi + to + V1</code>"],
      ex:[["I want <span class='hl'>you to listen</span> carefully.","Dikkatle dinlemeni istiyorum."],["The doctor advised <span class='hl'>him to rest</span>.","Doktor ona dinlenmesini tavsiye etti."]]},
    {h:"Anlamı değişen fiiller", table:{head:["Fiil","+ -ing","+ to"],rows:[
      ["<strong>stop</strong>","stop smoking = sigarayı bırakmak","stop to smoke = sigara içmek için durmak"],
      ["<strong>remember</strong>","remember locking = kilitlediğini hatırlamak","remember to lock = kilitlemeyi unutmamak"],
      ["<strong>forget</strong>","forget meeting = tanıştığını unutmak","forget to meet = buluşmayı unutmak"],
      ["<strong>try</strong>","try restarting = deneme amaçlı yapmak","try to restart = çabalamak"],
      ["<strong>regret</strong>","regret saying = söylediğine pişman olmak","regret to say = üzülerek bildirmek"],
      ["<strong>mean</strong>","mean waiting = anlamına gelmek","mean to wait = niyet etmek"],
      ["<strong>go on</strong>","go on talking = aynı şeye devam","go on to talk = başka şeye geçmek"]]},
      ex:[["I <span class='hl'>stopped smoking</span> five years ago.","Beş yıl önce sigarayı bıraktım."],["I <span class='hl'>stopped to smoke</span> on the way.","Yolda sigara içmek için durdum."]]},
    {h:"Edat sonrası daima -ing", p:["Bir edattan (in, on, at, of, for, about, after, before, without, by) sonra fiil gelirse <strong>her zaman -ing</strong> olur."],
      ex:[["She is good <span class='hl'>at solving</span> problems.","Problem çözmekte iyidir."],["He left <span class='hl'>without saying</span> goodbye.","Vedalaşmadan gitti."],["I'm interested <span class='hl'>in learning</span> Arabic.","Arapça öğrenmekle ilgileniyorum."]],
      callout:{t:"Tuzak",b:"<code>look forward to</code>, <code>be used to</code>, <code>object to</code> yapılarındaki <em>to</em> edattır, mastar değil: ✅ <em>I look forward to hearing from you.</em>"}},
    {h:"Common Mistakes", pairs:[
      ["I enjoy to read.","I enjoy reading.","<em>enjoy</em> daima -ing alır."],
      ["I look forward to hear from you.","I look forward to hearing from you.","Buradaki <em>to</em> edattır."],
      ["He suggested to go out.","He suggested going out.","<em>suggest</em> -ing alır."],
      ["I'm interested to learn Arabic.","I'm interested in learning Arabic.","Edat + -ing."]]}
  ],
  related:["passive-infinitives-gerunds","phrasal-verbs","be-used-to"]
},
{
  id:"participle-clauses", title:"Participle Clauses", tr:"Ortaç Cümleleri", level:"B2", tags:["clause"],
  intro:"Participle Clauses, iki cümleyi <strong>bağlaç ve özne kullanmadan</strong> birleştirir. Yazılı ve akademik İngilizcede cümleyi kısaltmanın en güçlü yoludur.",
  sections:[
    {h:"Üç tür", table:{head:["Tür","Yapı","Anlam"],rows:[
      ["Present participle","V-ing","Aktif, eşzamanlı ya da sebep"],
      ["Past participle","V3","Pasif anlam"],
      ["Perfect participle","having + V3","Önce tamamlanmış eylem"]]}},
    {h:"Present participle (-ing)", code:"<span class='c'>// İki cümle</span>\nShe opened the door and saw the mess.\n<span class='c'>// Participle clause</span>\n<span class='k'>Opening</span> the door, she saw the mess.",
      ex:[["<span class='hl'>Feeling</span> tired, he went to bed early.","Yorgun hissettiği için erken yattı. (sebep)"],
        ["<span class='hl'>Walking</span> along the beach, we found a shell.","Sahilde yürürken bir deniz kabuğu bulduk. (eşzamanlı)"],
        ["The man <span class='hl'>standing</span> at the door is my boss.","Kapıda duran adam patronum. (relative clause kısaltması)"]]},
    {h:"Past participle (V3)", p:["Pasif anlam taşır: özne eylemi yapan değil, eylemden etkilenen taraftır."],
      ex:[["<span class='hl'>Written</span> in 1925, the novel still feels modern.","1925'te yazılmış olan roman hâlâ modern hissettiriyor."],
        ["<span class='hl'>Shocked</span> by the news, she sat down.","Haberden şok olmuş hâlde oturdu."],
        ["The documents <span class='hl'>signed</span> yesterday are on your desk.","Dün imzalanan belgeler masanda."]]},
    {h:"Perfect participle (having + V3)", p:["Ana eylemden <strong>önce</strong> tamamlanmış eylemi gösterir."],
      ex:[["<span class='hl'>Having finished</span> the report, he went home.","Raporu bitirdikten sonra eve gitti."],
        ["<span class='hl'>Having been warned</span> twice, he was dismissed.","İki kez uyarıldıktan sonra işten çıkarıldı. (pasif)"]]},
    {h:"Kritik kural — aynı özne", p:["Participle clause ile ana cümlenin <strong>öznesi aynı olmalıdır</strong>. Değilse \"dangling participle\" hatası oluşur."],
      pairs:[["Walking down the street, the building looked huge.","Walking down the street, I thought the building looked huge.","Bina yürümüyor — özne uyumsuz."],
        ["Having eaten dinner, the film started.","Having eaten dinner, we started the film.","Film yemek yemez."]]},
    {h:"Common Mistakes", pairs:[
      ["Being written in 1925, I liked the novel.","Written in 1925, the novel still appeals to me.","Özne uyumu."],
      ["Having finish the work, she left.","Having finished the work, she left.","<em>having</em> + V3."]]}
  ],
  related:["relative-clauses","adverbial-clauses","passive-voice"]
},
{
  id:"noun-clauses", title:"Noun Clauses", tr:"İsim Cümleleri", level:"B2", tags:["clause"],
  intro:"Noun Clause, cümle içinde <strong>isim görevi gören yan cümledir</strong>: özne, nesne ya da tümleç olabilir. <code>that</code>, <code>wh-</code> kelimeleri veya <code>whether/if</code> ile başlar.",
  sections:[
    {h:"Üç tür", table:{head:["Başlangıç","Örnek","Görev"],rows:[
      ["<code>that</code>","I know <strong>that he is right</strong>.","Nesne"],
      ["<code>wh-</code>","<strong>What he said</strong> surprised me.","Özne"],
      ["<code>whether / if</code>","I wonder <strong>whether it will rain</strong>.","Nesne"]]}},
    {h:"that-clause", p:["Konuşma dilinde <code>that</code> düşürülebilir; resmî yazıda korunur."],
      ex:[["I believe <span class='hl'>(that) she is telling the truth</span>.","Doğruyu söylediğine inanıyorum."],
        ["<span class='hl'>That he lied</span> is obvious.","Yalan söylediği açık. (özne — resmî)"],
        ["It is obvious <span class='hl'>that he lied</span>.","Yalan söylediği açık. (daha doğal — it ile)"],
        ["The problem is <span class='hl'>that we have no budget</span>.","Sorun şu ki bütçemiz yok. (tümleç)"]]},
    {h:"wh-clause", p:["Soru kelimesiyle başlar ama <strong>soru sırası kullanılmaz</strong> — düz cümle sırası korunur."],
      ex:[["I don't know <span class='hl'>where he lives</span>.","Nerede yaşadığını bilmiyorum. (❌ where does he live)"],
        ["<span class='hl'>What matters</span> is your attitude.","Önemli olan tavrındır."],
        ["Tell me <span class='hl'>why you did it</span>.","Bunu neden yaptığını söyle."],
        ["She explained <span class='hl'>how the system works</span>.","Sistemin nasıl çalıştığını açıkladı."]]},
    {h:"whether vs if", table:{head:["whether","if"],rows:[
      ["Her konumda kullanılabilir","Sadece fiil nesnesi olarak"],
      ["<strong>Whether</strong> we go is up to you. ✅","<em>If we go is up to you.</em> ❌"],
      ["whether or not ✅","if or not ❌"],
      ["Edat sonrası: about <strong>whether</strong> ✅","about if ❌"],
      ["to-infinitive öncesi: whether to go ✅","if to go ❌"]]}},
    {h:"Common Mistakes", pairs:[
      ["I don't know what does he want.","I don't know what he wants.","Noun clause'da soru sırası yok."],
      ["I asked if or not she was coming.","I asked whether or not she was coming.","<em>or not</em> ile <em>whether</em>."],
      ["That is important that you rest.","It is important that you rest.","Öznede <em>it</em> kullanılır."]]}
  ],
  related:["indirect-questions","reported-speech","relative-clauses","subjunctive"]
},
{
  id:"adverbial-clauses", title:"Adverbial Clauses", tr:"Zarf Cümleleri", level:"B2", tags:["clause"],
  intro:"Adverbial Clause, ana cümleye <strong>zaman, sebep, amaç, sonuç, koşul ya da zıtlık</strong> bilgisi ekleyen yan cümledir. Bir bağlaçla (subordinating conjunction) başlar.",
  sections:[
    {h:"Türler ve bağlaçları", table:{head:["Tür","Bağlaçlar","Örnek"],rows:[
      ["<strong>Time</strong>","when, while, as, before, after, until, since, as soon as","<em>As soon as</em> I arrive, I'll text you."],
      ["<strong>Reason</strong>","because, since, as, seeing that","We stayed in <em>because</em> it was raining."],
      ["<strong>Purpose</strong>","so that, in order that, in case","I left early <em>so that</em> I could catch the train."],
      ["<strong>Result</strong>","so…that, such…that","It was <em>so</em> cold <em>that</em> the pipes froze."],
      ["<strong>Concession</strong>","although, though, even though, whereas, while","<em>Although</em> he was tired, he kept working."],
      ["<strong>Condition</strong>","if, unless, provided that, as long as","You can go <em>as long as</em> you're back by ten."],
      ["<strong>Manner</strong>","as, as if, as though","She acts <em>as if</em> she owns the place."],
      ["<strong>Place</strong>","where, wherever","Sit <em>wherever</em> you like."]]}},
    {h:"so…that / such…that", code:"so + sıfat/zarf + that\nsuch + (a/an) + sıfat + isim + that\n\nIt was <span class='k'>so</span> hot <span class='k'>that</span> we stayed inside.\nIt was <span class='k'>such a</span> hot day <span class='k'>that</span> we stayed inside.",
      ex:[["The exam was <span class='hl'>so difficult that</span> half the class failed.","Sınav o kadar zordu ki sınıfın yarısı kaldı."],["He is <span class='hl'>such a</span> good teacher <span class='hl'>that</span> everyone respects him.","O kadar iyi bir öğretmen ki herkes ona saygı duyuyor."]]},
    {h:"although vs despite", p:["Anlam aynıdır ama <strong>gramer farklıdır</strong>: <code>although</code> cümle alır, <code>despite / in spite of</code> isim veya -ing alır."],
      ex:[["<span class='hl'>Although it was raining</span>, we went out.","cümle (özne + fiil)"],["<span class='hl'>Despite the rain</span>, we went out.","isim"],["<span class='hl'>In spite of being tired</span>, she finished.","-ing"]],
      callout:{t:"Sık hata",b:"❌ <em>Despite it was raining</em> · ❌ <em>Although the rain</em>. Yapıları karıştırma."}},
    {h:"Common Mistakes", pairs:[
      ["Although he was tired, but he kept working.","Although he was tired, he kept working.","İngilizcede iki bağlaç birlikte kullanılmaz."],
      ["Because it was late, so we left.","Because it was late, we left.","<em>because</em> + <em>so</em> birlikte olmaz."],
      ["I'll wait until you will come.","I'll wait until you come.","Zaman cümlesinde <em>will</em> yok."]]}
  ],
  related:["subordinating-conjunctions","linking-words","conditionals"]
},
{
  id:"cleft-sentences", title:"Cleft Sentences", tr:"Yarık Cümleler", level:"C1", tags:["clause","emphasis"],
  intro:"Cleft Sentences, bir cümleyi ikiye \"yararak\" belirli bir öğeyi <strong>vurgulama</strong> yoludur. Türkçede vurguyu ses tonuyla yaparız; İngilizce bunu yapısal olarak yapar.",
  sections:[
    {h:"It-cleft", code:"It + be + <span class='k'>vurgulanan öğe</span> + that/who + kalan cümle\n\n<span class='c'>// Nötr: Ali broke the window yesterday.</span>\n<span class='k'>It was Ali</span> who broke the window.        <span class='c'>// kişi vurgusu</span>\n<span class='k'>It was the window</span> that Ali broke.       <span class='c'>// nesne vurgusu</span>\n<span class='k'>It was yesterday</span> that Ali broke it.     <span class='c'>// zaman vurgusu</span>",
      ex:[["<span class='hl'>It was in 2019 that</span> we first met.","İlk kez 2019'da tanışmıştık."],["<span class='hl'>It is her attitude that</span> bothers me, not her words.","Beni rahatsız eden sözleri değil, tavrı."]]},
    {h:"Wh-cleft (pseudo-cleft)", code:"What + cümle + be + <span class='k'>vurgulanan öğe</span>\n\n<span class='k'>What I need</span> is a long holiday.\n<span class='k'>What he did</span> was (to) sell the company.",
      ex:[["<span class='hl'>What surprised me was</span> his honesty.","Beni şaşırtan dürüstlüğüydü."],["<span class='hl'>What we should do is</span> call the police.","Yapmamız gereken polisi aramak."]]},
    {h:"All-cleft ve diğerleri", ex:[["<span class='hl'>All I want is</span> a quiet evening.","Tek istediğim sakin bir akşam."],
      ["<span class='hl'>The reason why</span> she left <span class='hl'>was</span> the salary.","Ayrılma sebebi maaştı."],
      ["<span class='hl'>The place where</span> it happened <span class='hl'>was</span> the car park.","Olayın olduğu yer otoparktı."],
      ["<span class='hl'>The person who</span> called <span class='hl'>was</span> your sister.","Arayan kişi kız kardeşindi."]]},
    {h:"Common Mistakes", pairs:[
      ["It was Ali who did broke it.","It was Ali who broke it.","Tek çekimli fiil yeterli."],
      ["What I need is to a holiday.","What I need is a holiday.","Gereksiz <em>to</em>."]]}
  ],
  related:["inversion","emphasis","relative-clauses"]
},
{
  id:"inversion", title:"Inversion", tr:"Devrik Yapı", level:"C1", tags:["clause","emphasis","formal"],
  intro:"Inversion, özne ile yardımcı fiilin <strong>yer değiştirmesidir</strong>. Olumsuz ya da sınırlayıcı bir ifade cümle başına geldiğinde zorunlu olur. Resmî yazı ve edebî üslubun işaretidir.",
  sections:[
    {h:"Negatif zarflarla inversion", code:"<span class='k'>Negatif ifade</span> + yardımcı fiil + özne + ana fiil\n\nNever <span class='k'>have I seen</span> such chaos.\nRarely <span class='k'>does he complain</span>.\nNot only <span class='k'>did she win</span>, but she also broke the record.",
      p:["Tetikleyen ifadeler: <code>never, rarely, seldom, hardly, scarcely, no sooner, little, not only, under no circumstances, at no time, only then, only after, nowhere</code>"],
      ex:[["<span class='hl'>Never have I</span> been so embarrassed.","Hiç bu kadar utanmamıştım."],
        ["<span class='hl'>Hardly had</span> we sat down <span class='hl'>when</span> the phone rang.","Daha oturmuştuk ki telefon çaldı."],
        ["<span class='hl'>No sooner had</span> he left <span class='hl'>than</span> it started raining.","O gider gitmez yağmur başladı."],
        ["<span class='hl'>Under no circumstances should you</span> open this door.","Hiçbir koşulda bu kapıyı açmamalısın."],
        ["<span class='hl'>Only after the meeting did I</span> understand the risk.","Riski ancak toplantıdan sonra anladım."]]},
    {h:"Conditional inversion", p:["<code>if</code> düşürülüp yardımcı fiil öne alınabilir — resmî üslup:"],
      ex:[["<span class='hl'>Had I known</span>, I would have helped.","≡ If I had known…"],["<span class='hl'>Were I</span> in your position, I'd resign.","≡ If I were…"],["<span class='hl'>Should you need</span> assistance, call us.","≡ If you should need…"]]},
    {h:"so / such / neither / nor", ex:[["I was tired and <span class='hl'>so was she</span>.","Ben yorgundum, o da öyleydi."],
      ["He doesn't smoke and <span class='hl'>neither do I</span>.","O sigara içmez, ben de içmem."],
      ["<span class='hl'>So loud was the music that</span> we couldn't talk.","Müzik o kadar yüksekti ki konuşamadık."]]},
    {h:"Common Mistakes", pairs:[
      ["Never I have seen such a thing.","Never have I seen such a thing.","Inversion zorunlu."],
      ["Not only she sings, but she also dances.","Not only does she sing, but she also dances.","Yardımcı fiil öne alınır."],
      ["Hardly I had arrived when it started.","Hardly had I arrived when it started.","<em>hardly</em> + inversion."]]}
  ],
  related:["emphasis","cleft-sentences","negation","conditionals"]
},
{
  id:"modal-verbs", title:"Modal Verbs", tr:"Kiplik Fiiller", level:"A2–B2", tags:["modal","verb"],
  intro:"Modal fiiller (can, could, may, might, must, shall, should, will, would) eylemin kendisini değil, konuşanın <strong>eyleme bakışını</strong> anlatır: yetenek, olasılık, zorunluluk, izin, tavsiye. Türkçedeki \"-ebilir, -meli, -malı\" eklerinin karşılığıdır.",
  sections:[
    {h:"Modal fiillerin ortak kuralları", list:["Üçüncü tekil şahısta <code>-s</code> almaz: ❌ <em>she cans</em>","Arkasından her zaman <strong>V1</strong> gelir: ❌ <em>must to go</em>","Soru ve olumsuzda <em>do/does/did</em> kullanılmaz: <em>Can you? / She can't.</em>","İki modal arka arkaya gelmez: ❌ <em>will can</em> → ✅ <em>will be able to</em>","Zamanları yoktur; geçmiş için <code>modal + have + V3</code> ya da eşdeğer yapı kullanılır"]},
    {h:"Anlam haritası", table:{head:["Modal","Ana anlam","Örnek"],rows:[
      ["<code>can</code>","yetenek, izin, olasılık","I <strong>can</strong> swim. / <strong>Can</strong> I sit here?"],
      ["<code>could</code>","geçmiş yetenek, kibar rica, olasılık","She <strong>could</strong> read at four. / <strong>Could</strong> you help?"],
      ["<code>may</code>","izin (resmî), olasılık","<strong>May</strong> I come in? / It <strong>may</strong> rain."],
      ["<code>might</code>","daha düşük olasılık","He <strong>might</strong> be at home."],
      ["<code>must</code>","zorunluluk (içsel), güçlü tahmin","I <strong>must</strong> finish this. / You <strong>must</strong> be tired."],
      ["<code>have to</code>","zorunluluk (dışsal kural)","I <strong>have to</strong> wear a uniform."],
      ["<code>should / ought to</code>","tavsiye, beklenti","You <strong>should</strong> see a doctor."],
      ["<code>shall</code>","teklif (BrE), resmî gelecek","<strong>Shall</strong> we begin?"],
      ["<code>would</code>","kibarlık, hayalî durum, geçmiş alışkanlık","I <strong>would</strong> like a coffee."],
      ["<code>need to / needn't</code>","gereklilik / gereksizlik","You <strong>needn't</strong> come early."]]}},
    {h:"Zorunluluk: must vs have to vs mustn't vs don't have to", table:{head:["Yapı","Anlam","Örnek"],rows:[
      ["<code>must</code>","Konuşanın kendi kararı/kanaati","I must call my mother. (kendim istiyorum)"],
      ["<code>have to</code>","Dışarıdan gelen kural","I have to wear a helmet. (kural böyle)"],
      ["<code>mustn't</code>","<strong>Yasak</strong>","You mustn't smoke here. (yasak)"],
      ["<code>don't have to</code>","<strong>Gerek yok</strong>","You don't have to come. (istersen gelme)"]]},
      callout:{t:"En pahalı karışıklık",b:"<code>mustn't</code> = yasak, <code>don't have to</code> = gereksiz. İkisi zıt anlamlıdır. <em>You mustn't pay</em> (ödemek yasak) ≠ <em>You don't have to pay</em> (ödemene gerek yok)."}},
    {h:"Olasılık dereceleri", table:{head:["Kesinlik","Modal","Örnek"],rows:[
      ["%95 eminim (olumlu)","must","He <strong>must</strong> be at work. (Kesin işte.)"],
      ["%50","may / might / could","She <strong>might</strong> know the answer."],
      ["%95 eminim (olumsuz)","can't / couldn't","It <strong>can't</strong> be true! (İmkânsız.)"]]},
      ex:[["The lights are off — they <span class='hl'>must</span> be asleep.","Işıklar kapalı — uyuyor olmalılar."],["That <span class='hl'>can't</span> be Ali; he's in Izmir.","O Ali olamaz; İzmir'de."]]},
    {h:"Geçmiş: modal + have + V3", table:{head:["Yapı","Anlam","Örnek"],rows:[
      ["<code>must have V3</code>","Kesin çıkarım (geçmiş)","She must have forgotten. (Unutmuş olmalı.)"],
      ["<code>can't have V3</code>","İmkânsız çıkarım","He can't have seen us. (Bizi görmüş olamaz.)"],
      ["<code>might/may have V3</code>","Olasılık","They might have missed the bus."],
      ["<code>should have V3</code>","Yapılmadı ama yapılmalıydı","You should have told me. (Söylemeliydin.)"],
      ["<code>shouldn't have V3</code>","Yapıldı ama yapılmamalıydı","I shouldn't have said that."],
      ["<code>could have V3</code>","Mümkündü ama olmadı","We could have won the match."],
      ["<code>needn't have V3</code>","Yapıldı ama gerekmiyordu","You needn't have cooked; we ate out."]]},
      ex:[["I <span class='hl'>should have booked</span> the tickets earlier.","Biletleri daha erken almalıydım."],["He <span class='hl'>must have left</span> already.","Çoktan gitmiş olmalı."]]},
    {h:"Common Mistakes", pairs:[
      ["She must to finish it.","She must finish it.","Modal sonrası <em>to</em> yok (<em>ought to</em>, <em>have to</em> hariç)."],
      ["He cans speak English.","He can speak English.","Modal <em>-s</em> almaz."],
      ["I will can help you.","I will be able to help you.","İki modal yan yana gelmez."],
      ["You don't have to smoke here — it's forbidden.","You mustn't smoke here — it's forbidden.","Yasak → <em>mustn't</em>."],
      ["I must go yesterday.","I had to go yesterday.","<em>must</em>'ın geçmişi <em>had to</em>."]]}
  ],
  related:["causative","subjunctive","conditionals","negation"]
},
{
  id:"phrasal-verbs", title:"Phrasal Verbs", tr:"Öbek Fiiller", level:"B1", tags:["verb","vocabulary"],
  intro:"Phrasal verb, <strong>fiil + edat/zarf</strong> birleşiminden oluşan ve genellikle <strong>yeni bir anlam kazanan</strong> yapıdır. <em>Look</em> = bakmak, ama <em>look after</em> = bakmak (ilgilenmek), <em>look up</em> = (sözlükte) aramak, <em>look for</em> = aramak. Günlük konuşmanın belkemiğidir.",
  sections:[
    {h:"Dört tip", table:{head:["Tip","Nesne","Ayrılabilir mi","Örnek"],rows:[
      ["Intransitive","yok","—","The car <strong>broke down</strong>."],
      ["Transitive separable","var","✅ ayrılabilir","Turn <strong>the TV</strong> off. / Turn off <strong>the TV</strong>."],
      ["Transitive inseparable","var","❌ ayrılmaz","Look after <strong>the kids</strong>."],
      ["Three-word","var","❌ ayrılmaz","I look forward to <strong>it</strong>."]]},
      callout:{t:"Altın kural",b:"Nesne <strong>zamir</strong> ise (it, them, him) ayrılabilir phrasal verb'de <strong>zorunlu olarak ortaya girer</strong>: ✅ <em>Turn it off</em> · ❌ <em>Turn off it</em>."}},
    {h:"En sık 30 phrasal verb", table:{head:["Phrasal verb","Anlam","Örnek"],rows:[
      ["give up","bırakmak, vazgeçmek","He gave up smoking."],
      ["find out","öğrenmek, keşfetmek","I found out the truth."],
      ["look for","aramak","I'm looking for my keys."],
      ["look after","bakmak, ilgilenmek","She looks after her nephew."],
      ["look up","(sözlükte) aramak","Look it up online."],
      ["put off","ertelemek","They put off the meeting."],
      ["put up with","katlanmak","I can't put up with this noise."],
      ["take off","(uçak) kalkmak; çıkarmak","Take off your shoes."],
      ["turn down","reddetmek; kısmak","She turned down the offer."],
      ["turn up","gelmek, ortaya çıkmak","He turned up an hour late."],
      ["come across","tesadüfen karşılaşmak","I came across an old photo."],
      ["get on with","iyi geçinmek","I get on well with my boss."],
      ["get over","atlatmak","It took months to get over the flu."],
      ["carry on","devam etmek","Carry on working."],
      ["break down","bozulmak","The washing machine broke down."],
      ["bring up","yetiştirmek; gündeme getirmek","She was brought up in Izmir."],
      ["call off","iptal etmek","They called off the wedding."],
      ["cut down on","azaltmak","Cut down on sugar."],
      ["deal with","başa çıkmak","I'll deal with it tomorrow."],
      ["figure out","çözmek, anlamak","I can't figure out this error."],
      ["fill in / out","doldurmak (form)","Fill in the form."],
      ["go on","olmak, devam etmek","What's going on?"],
      ["hold on","beklemek","Hold on a second."],
      ["keep up with","ayak uydurmak","I can't keep up with the news."],
      ["make up","uydurmak; barışmak","He made up an excuse."],
      ["pick up","almak; öğrenmek","I'll pick you up at eight."],
      ["run out of","tükenmek","We've run out of milk."],
      ["set up","kurmak","They set up a company."],
      ["work out","antrenman; çözülmek","It worked out well."],
      ["end up","sonunda … olmak","We ended up walking home."]]}},
    {h:"Ayrılabilirlik örnekleri", ex:[["Please <span class='hl'>turn off</span> the lights. ✅","Nesne isim → ayrık ya da bitişik olur"],
      ["Please <span class='hl'>turn</span> the lights <span class='hl'>off</span>. ✅","Aynı anlam"],
      ["Please <span class='hl'>turn them off</span>. ✅","Zamir → ortaya girmek zorunda"],
      ["Please turn off them. ❌","Zamir sona atılamaz"]]},
    {h:"Common Mistakes", pairs:[
      ["I'm looking after my keys.","I'm looking for my keys.","<em>look after</em> = bakmak, <em>look for</em> = aramak."],
      ["Please pick up me at eight.","Please pick me up at eight.","Zamir ortaya girer."],
      ["I can't put up this noise.","I can't put up with this noise.","Üç kelimelik yapı eksik."],
      ["He gave up to smoke.","He gave up smoking.","Phrasal verb sonrası -ing."]]}
  ],
  related:["gerunds-infinitives","fixed-prepositions","word-formation"]
},
{
  id:"used-to-would", title:"Used To / Would", tr:"Geçmiş Alışkanlıklar", level:"A2", tags:["verb","past"],
  intro:"<code>used to</code> ve <code>would</code>, geçmişte düzenli yapılan ama <strong>artık yapılmayan</strong> şeyleri anlatır. Türkçedeki \"-erdi / -ardı\" ekinin karşılığıdır: <em>giderdik, oynardık</em>.",
  sections:[
    {h:"Form", code:"S + used to + V1        I <span class='k'>used to play</span> the guitar.\nS + didn't use to + V1  I <span class='k'>didn't use to like</span> coffee.\nDid + S + use to + V1?  <span class='k'>Did</span> you <span class='k'>use to</span> live here?",
      callout:{t:"Yazım",b:"Soru ve olumsuzda <code>did</code> zaten geçmişi taşıdığı için <strong>use to</strong> yazılır, <em>used to</em> değil."}},
    {h:"used to vs would", table:{head:["","used to","would"],rows:[
      ["Eylemler (actions)","✅ We used to go camping.","✅ We would go camping."],
      ["Durumlar (states)","✅ I used to have long hair.","❌ <em>I would have long hair.</em>"],
      ["İlk cümlede sahne kurma","✅","Genellikle <em>used to</em>'dan sonra gelir"]]},
      p:["<code>would</code> yalnızca <strong>tekrarlanan eylemler</strong> için kullanılır; durum fiilleriyle (be, have, know, like, live) kullanılamaz."],
      ex:[["I <span class='hl'>used to be</span> very shy.","Eskiden çok utangaçtım. (durum → would olmaz)"],
        ["Every summer we <span class='hl'>used to</span> visit my grandparents. We <span class='hl'>would</span> swim all day and <span class='hl'>would</span> sleep outside.","Her yaz büyükanne-babamı ziyaret ederdik. Bütün gün yüzer, dışarıda uyurduk."],
        ["He <span class='hl'>didn't use to</span> smoke.","Eskiden sigara içmezdi."]]},
    {h:"Past Simple ile fark", p:["<code>used to</code> mutlaka \"artık değil\" anlamı taşır; Past Simple bunu iddia etmez."],
      ex:[["I <span class='hl'>used to live</span> in Ankara.","Eskiden Ankara'da yaşardım (artık yaşamıyorum)."],["I <span class='hl'>lived</span> in Ankara for two years.","İki yıl Ankara'da yaşadım (nötr bilgi)."]]},
    {h:"Common Mistakes", pairs:[
      ["I use to go there every summer.","I used to go there every summer.","Olumluda <em>used</em>."],
      ["Did you used to smoke?","Did you use to smoke?","<em>did</em> varken <em>use</em>."],
      ["I would live in Izmir.","I used to live in Izmir.","Durum fiili ile <em>would</em> olmaz."],
      ["I am used to go to the gym every day (geçmiş kastediliyorsa).","I used to go to the gym every day.","<em>be used to</em> farklı bir yapıdır."]]}
  ],
  related:["be-used-to","past-simple","past-continuous"]
},
{
  id:"be-used-to", title:"Be Used To / Get Used To", tr:"Alışkın Olmak / Alışmak", level:"B1", tags:["verb"],
  intro:"Bu yapı <code>used to + V1</code> ile <strong>karıştırılan ama tamamen farklı</strong> bir kalıptır. <code>be used to</code> = alışkın olmak, <code>get used to</code> = alışma sürecinde olmak. Buradaki <em>to</em> bir <strong>edattır</strong>, mastar değildir; bu yüzden arkasından <strong>isim veya -ing</strong> gelir.",
  sections:[
    {h:"Üç yapının karşılaştırması", table:{head:["Yapı","Sonrası","Anlam","Örnek"],rows:[
      ["<code>used to</code>","V1","Eskiden yapardım (artık yapmıyorum)","I <strong>used to work</strong> nights."],
      ["<code>be used to</code>","V-ing / isim","Alışığım (zorlanmıyorum)","I <strong>am used to working</strong> nights."],
      ["<code>get used to</code>","V-ing / isim","Alışıyorum (süreç)","I <strong>am getting used to working</strong> nights."]]},
      callout:{t:"Test",b:"Arkasından <em>to</em>'dan sonra <strong>-ing</strong> gelebiliyorsa <em>be/get used to</em>'dur. <em>V1</em> geliyorsa geçmiş alışkanlık <em>used to</em>'dur."}},
    {h:"Zamanlarda çekim", code:"<span class='c'>// be used to — tüm zamanlarda be çekilir</span>\nI <span class='k'>am used to</span> the noise.\nShe <span class='k'>was used to</span> getting up early.\nThey <span class='k'>will be used to</span> it soon.\n\n<span class='c'>// get used to — süreç</span>\nI <span class='k'>am getting used to</span> the new system.\nHe <span class='k'>got used to</span> living alone.\nYou'll <span class='k'>get used to</span> it."},
    {h:"Examples", ex:[["I <span class='hl'>am used to</span> the traffic in Istanbul.","İstanbul trafiğine alışkınım."],
      ["She <span class='hl'>isn't used to</span> speaking in public.","Toplum önünde konuşmaya alışkın değil."],
      ["It took me a month to <span class='hl'>get used to</span> the time difference.","Saat farkına alışmam bir ay sürdü."],
      ["Are you <span class='hl'>getting used to</span> your new job?","Yeni işine alışıyor musun?"],
      ["He <span class='hl'>used to</span> smoke, but now he <span class='hl'>is used to</span> living without cigarettes.","Eskiden sigara içerdi, ama artık sigarasız yaşamaya alışkın."]]},
    {h:"Common Mistakes", pairs:[
      ["I am used to get up early.","I am used to getting up early.","Edat sonrası -ing."],
      ["I am used to work here for 5 years.","I have worked here for 5 years.","Süre anlatımı farklı yapıdır."],
      ["I used to the weather here.","I am used to the weather here.","<em>be</em> düşürülemez."]]}
  ],
  related:["used-to-would","gerunds-infinitives","fixed-prepositions"]
},
{
  id:"emphasis", title:"Emphasis", tr:"Vurgu Yapıları", level:"C1", tags:["emphasis"],
  intro:"İngilizcede vurgu, Türkçedeki gibi kelime sırasını değiştirerek değil, <strong>özel yapılar ekleyerek</strong> yapılır: yardımcı fiil ekleme, cümle başına öğe alma, yoğunlaştırıcı kullanma.",
  sections:[
    {h:"Emphatic do/does/did", p:["Olumlu cümlede yardımcı fiil normalde kullanılmaz; eklenirse <strong>ısrar/karşı çıkma</strong> vurgusu doğar. Ana fiil V1 kalır."],
      ex:[["I <span class='hl'>do</span> like your idea.","Fikrini gerçekten beğeniyorum."],

{
  id:"question-formation", title:"Question Formation", tr:"Soru Kurma", level:"A1", tags:["question"],
  intro:"İngilizcede soru kurmanın tek bir mantığı vardır: <strong>yardımcı fiil özneden önce gelir</strong>. Türkçedeki \"mı/mi\" ekinin yerini bu yer değiştirme (inversion) alır.",
  sections:[
    {h:"Yes/No soruları", code:"<span class='c'>// be fiili varsa: be öne geçer</span>\n<span class='k'>Are</span> you ready?      <span class='k'>Was</span> she at home?\n\n<span class='c'>// modal varsa: modal öne geçer</span>\n<span class='k'>Can</span> you swim?       <span class='k'>Should</span> I call him?\n\n<span class='c'>// yardımcı fiil varsa: o öne geçer</span>\n<span class='k'>Have</span> you finished?  <span class='k'>Will</span> they come?\n\n<span class='c'>// hiçbiri yoksa: do / does / did eklenir</span>\n<span class='k'>Do</span> you work here?   <span class='k'>Does</span> he know?   <span class='k'>Did</span> they leave?"},
    {h:"Wh- soruları", table:{head:["Soru kelimesi","Sorduğu","Örnek"],rows:[
      ["what","şey","What do you want?"],["who","kişi","Who called you?"],["where","yer","Where did you go?"],
      ["when","zaman","When does it start?"],["why","sebep","Why are you late?"],["how","yöntem","How did you find it?"],
      ["which","seçenek","Which car is yours?"],["whose","sahiplik","Whose bag is this?"],
      ["how much / many","miktar","How many people came?"],["how long","süre","How long have you waited?"],
      ["how often","sıklık","How often do you travel?"],["how far","mesafe","How far is the airport?"]]}},
    {h:"Subject vs object soruları", p:["Soru kelimesi <strong>öznenin yerini tutuyorsa</strong> yardımcı fiil kullanılmaz — cümle düz sıradadır."],
      code:"<span class='c'>// Object question — yardımcı fiil var</span>\n<span class='k'>Who did</span> you see?      → I saw <span class='k'>Ali</span>.\n\n<span class='c'>// Subject question — yardımcı fiil YOK</span>\n<span class='k'>Who saw</span> you?          → <span class='k'>Ali</span> saw me.",
      ex:[["<span class='hl'>What happened</span>?","Ne oldu? (özne sorusu — did yok)"],["<span class='hl'>What did</span> you <span class='hl'>do</span>?","Ne yaptın? (nesne sorusu — did var)"],["<span class='hl'>Who broke</span> the window?","Camı kim kırdı?"],["<span class='hl'>Who did</span> you <span class='hl'>call</span>?","Kimi aradın?"]]},
    {h:"Edatlı sorular", ex:[["<span class='hl'>Who</span> are you talking <span class='hl'>to</span>?","Kiminle konuşuyorsun? (günlük)"],["<span class='hl'>To whom</span> are you talking?","(çok resmî)"],["<span class='hl'>What</span> are you looking <span class='hl'>for</span>?","Ne arıyorsun?"]]},
    {h:"Common Mistakes", pairs:[
      ["Where you are going?","Where are you going?","Yardımcı fiil özneden önce."],
      ["What means this word?","What does this word mean?","<em>mean</em> için <em>does</em> gerekir."],
      ["Who did call you?","Who called you?","Özne sorusunda <em>did</em> yok."],
      ["Do you can help me?","Can you help me?","Modal varken <em>do</em> kullanılmaz."],
      ["How much people were there?","How many people were there?","Sayılabilir → <em>many</em>."]]}
  ],
  related:["indirect-questions","question-tags","negation","noun-clauses"]
},
{
  id:"question-tags", title:"Question Tags", tr:"Ekli Sorular", level:"B1", tags:["question"],
  intro:"Question tag, cümlenin sonuna eklenen kısa sorudur: <em>…, isn't it?</em> Türkçedeki \"…değil mi?\" karşılığıdır. Onay almak ya da sohbeti sürdürmek için kullanılır.",
  sections:[
    {h:"Temel kural", p:["Cümle <strong>olumluysa tag olumsuz</strong>, cümle <strong>olumsuzsa tag olumlu</strong> olur. Tag'de cümledeki yardımcı fiil ve özne zamiri tekrar edilir."],
      code:"You are tired, <span class='k'>aren't you</span>?\nYou aren't tired, <span class='k'>are you</span>?\nShe works here, <span class='k'>doesn't she</span>?\nThey didn't come, <span class='k'>did they</span>?\nHe has left, <span class='k'>hasn't he</span>?\nYou can swim, <span class='k'>can't you</span>?"},
    {h:"Özel durumlar", table:{head:["Cümle","Tag","Not"],rows:[
      ["I am right,","aren't I?","<em>amn't</em> yoktur"],
      ["Let's go,","shall we?","teklif"],
      ["Open the door,","will you? / would you?","emir"],
      ["Don't be late,","will you?","olumsuz emir"],
      ["There is a problem,","isn't there?","<em>there</em> özne gibi davranır"],
      ["Nobody called,","did they?","olumsuz anlamlı özne → olumlu tag"],
      ["Nothing happened,","did it?","<em>nothing</em> olumsuzdur"],
      ["Everyone agreed,","didn't they?","<em>everyone</em> → <em>they</em>"],
      ["I have a car,","haven't I? / don't I?","BrE / AmE farkı"]]}},
    {h:"Examples", ex:[["It's cold today, <span class='hl'>isn't it</span>?","Bugün hava soğuk, değil mi?"],
      ["You haven't seen my phone, <span class='hl'>have you</span>?","Telefonumu görmedin, değil mi?"],
      ["Let's take a break, <span class='hl'>shall we</span>?","Ara verelim, olur mu?"],
      ["She rarely complains, <span class='hl'>does she</span>?","Nadiren şikâyet eder, değil mi? (<em>rarely</em> olumsuzdur)"],
      ["I'm late, <span class='hl'>aren't I</span>?","Geç kaldım, değil mi?"]]},
    {h:"Common Mistakes", pairs:[
      ["You are coming, isn't it?","You are coming, aren't you?","Tag özneyle uyumlu olmalı."],
      ["He can swim, can he?","He can swim, can't he?","Olumlu cümle → olumsuz tag."],
      ["Let's go, will we?","Let's go, shall we?","<em>Let's</em> → <em>shall we</em>."]]}
  ],
  related:["question-formation","negation","indirect-questions"]
},
{
  id:"indirect-questions", title:"Indirect Questions", tr:"Dolaylı Sorular", level:"B2", tags:["question","clause"],
  intro:"Indirect Question, soruyu <strong>kibar bir giriş cümlesinin içine yerleştirme</strong> yoludur. Kritik kural: içerideki soru <strong>düz cümle sırasına döner</strong> — yardımcı fiil öne alınmaz.",
  sections:[
    {h:"Yapı", code:"<span class='c'>// Direct</span>\nWhere <span class='k'>is</span> the station?\n\n<span class='c'>// Indirect — düz sıra</span>\nCould you tell me where the station <span class='k'>is</span>?\nDo you know where the station <span class='k'>is</span>?\nI wonder where the station <span class='k'>is</span>.",
      p:["Yes/No sorusu dolaylılaştırılırken <code>if</code> veya <code>whether</code> eklenir."]},
    {h:"Yaygın giriş kalıpları", p:["<code>Could you tell me…</code> · <code>Do you know…</code> · <code>I wonder…</code> · <code>Would you mind telling me…</code> · <code>Have you any idea…</code> · <code>I'd like to know…</code> · <code>Can you explain…</code>"]},
    {h:"Examples", ex:[["Could you tell me <span class='hl'>where the meeting room is</span>?","Toplantı odasının nerede olduğunu söyler misiniz?"],
      ["Do you know <span class='hl'>what time the shop closes</span>?","Dükkânın saat kaçta kapandığını biliyor musunuz?"],
      ["I wonder <span class='hl'>if she got my message</span>.","Mesajımı alıp almadığını merak ediyorum."],
      ["Would you mind telling me <span class='hl'>how much it costs</span>?","Ne kadar tuttuğunu söyler misiniz?"],
      ["I'd like to know <span class='hl'>whether the room is available</span>.","Odanın müsait olup olmadığını öğrenmek istiyorum."]]},
    {h:"Noktalama", p:["Giriş cümlesi soru ise (<em>Do you know…?</em>) soru işareti konur; ifade ise (<em>I wonder…</em>) <strong>nokta</strong> konur."],
      ex:[["Do you know where he lives<span class='hl'>?</span>","Soru girişi → soru işareti"],["I wonder where he lives<span class='hl'>.</span>","İfade girişi → nokta"]]},
    {h:"Common Mistakes", pairs:[
      ["Could you tell me where is the bank?","Could you tell me where the bank is?","Düz cümle sırası."],
      ["Do you know what does he want?","Do you know what he wants?","<em>does</em> düşer, fiil çekilir."],
      ["I wonder that he is coming.","I wonder whether he is coming.","<em>wonder</em> + whether/if."]]}
  ],
  related:["question-formation","reported-speech","noun-clauses"]
},
{

    {h:"Common Mistakes", pairs:[

{

{

  intro:"Zamirler ismin yerini tutar. İngilizcede özne zamiri <strong>düşürülemez</strong> — Türkçedeki gibi \"geldi\" denemez, \"he came\" denir. Bu, Türk öğrencilerin ilk yıl en çok unuttuğu kuraldır.",

    {h:"Zamir tablosu", table:{head:["Subject","Object","Possessive adj.","Possessive pron.","Reflexive"],rows:[
      ["I","me","my","mine","myself"],["you","you","your","yours","yourself"],
      ["he","him","his","his","himself"],["she","her","her","hers","herself"],
      ["it","it","its","—","itself"],["we","us","our","ours","ourselves"],
      ["you (pl.)","you","your","yours","yourselves"],["they","them","their","theirs","themselves"]]}},
    {h:"Possessive adjective vs pronoun", p:["<code>my / your / his</code> isimden <strong>önce</strong> gelir; <code>mine / yours / his</code> ismin <strong>yerine</strong> geçer."],
      ex:[["This is <span class='hl'>my</span> car.","Bu benim arabam. (+ isim)"],["This car is <span class='hl'>mine</span>.","Bu araba benim. (isimsiz)"],["<span class='hl'>Their</span> house is bigger than <span class='hl'>ours</span>.","Onların evi bizimkinden büyük."]]},
    {h:"Reflexive pronouns — dönüşlü zamirler", list:["Özne ile nesne aynı kişiyse: <em>She cut herself.</em>","Vurgu için: <em>I did it myself.</em>","<code>by + reflexive</code> = yalnız başına: <em>He lives by himself.</em>"],
      ex:[["I taught <span class='hl'>myself</span> to code.","Kendi kendime kod yazmayı öğrendim."],["Enjoy <span class='hl'>yourself</span>!","İyi eğlenceler!"],["They painted the house <span class='hl'>themselves</span>.","Evi kendileri boyadılar."]],
      callout:{t:"Dikkat",b:"Bazı fiiller İngilizcede reflexive almaz: ❌ <em>I feel myself tired</em> → ✅ <em>I feel tired</em>. Aynı şekilde: concentrate, relax, meet, wash (genellikle)."}},
    {h:"Belirsiz zamirler", table:{head:["","-body / -one","-thing","-where"],rows:[
      ["some-","somebody, someone","something","somewhere"],
      ["any-","anybody, anyone","anything","anywhere"],
      ["no-","nobody, no one","nothing","nowhere"],
      ["every-","everybody, everyone","everything","everywhere"]]},
      p:["Bunlar <strong>tekil</strong> fiil alır ama modern kullanımda geri gönderme zamiri <code>they</code> olabilir."],
      ex:[["<span class='hl'>Everybody is</span> here.","Herkes burada. (tekil fiil)"],["<span class='hl'>Someone</span> left <span class='hl'>their</span> bag.","Biri çantasını bırakmış. (singular they)"],["Is there <span class='hl'>anything</span> I can do?","Yapabileceğim bir şey var mı?"]]},
    {h:"it — özel kullanımlar", ex:[["<span class='hl'>It</span> is raining.","Yağmur yağıyor. (hava)"],["<span class='hl'>It</span> is 7 o'clock.","Saat yedi. (zaman)"],["<span class='hl'>It</span> is difficult to explain.","Açıklamak zor. (dummy subject)"],["<span class='hl'>It</span> was Ali who called.","Arayan Ali'ydi. (cleft)"]],
      callout:{t:"Kritik",b:"İngilizce cümle öznesiz olmaz. ❌ <em>Is raining</em> · ❌ <em>Is difficult</em> → <em>it</em> zorunludur."}},
    {h:"Common Mistakes", pairs:[
      ["Is very cold today.","It is very cold today.","Özne zorunlu."],
      ["Me and my friend went out.","My friend and I went out.","Özne konumunda <em>I</em>."],
      ["This book is my.","This book is mine.","Possessive pronoun."],
      ["He hurt himselves.","He hurt himself.","Tekil reflexive."],
      ["Its a good idea.","It's a good idea.","<em>it's</em> = it is; <em>its</em> = iyelik."]]}
  ],
  related:["possessives","determiners","quantifiers"]
},
{
  id:"possessives", title:"Possessives", tr:"İyelik Yapıları", level:"A2", tags:["noun"],
  intro:"İngilizcede sahiplik iki yolla kurulur: <code>'s</code> (Saxon genitive) ve <code>of</code> yapısı. Hangisinin kullanılacağı büyük ölçüde <strong>sahibin canlı olup olmamasına</strong> bağlıdır.",
  sections:[
    {h:"'s kullanımı", table:{head:["Durum","Kural","Örnek"],rows:[
      ["Tekil isim","<code>'s</code>","the boy<strong>'s</strong> bike"],
      ["-s ile biten çoğul","<code>'</code>","the boys<strong>'</strong> bikes"],
      ["-s ile bitmeyen çoğul","<code>'s</code>","the children<strong>'s</strong> toys"],
      ["-s ile biten özel ad","<code>'s</code> veya <code>'</code>","James<strong>'s</strong> car / James<strong>'</strong> car"],
      ["Ortak sahiplik","son isme","Ali and Ayşe<strong>'s</strong> house (ortak ev)"],
      ["Ayrı sahiplik","her isme","Ali<strong>'s</strong> and Ayşe<strong>'s</strong> cars (ayrı arabalar)"]]}},
    {h:"'s mi of mu?", table:{head:["<code>'s</code> kullanılır","<code>of</code> kullanılır"],rows:[
      ["İnsan: my sister's job","Cansız: the roof <strong>of</strong> the house"],
      ["Hayvan: the dog's tail","Soyut: the importance <strong>of</strong> education"],
      ["Ülke/kurum: Turkey's economy","Uzun tamlama: the name <strong>of</strong> the man I met"],
      ["Zaman: today's news, a week's holiday","Parça-bütün: the end <strong>of</strong> the film"]]},
      ex:[["This is <span class='hl'>Ali's</span> phone.","Bu Ali'nin telefonu."],["The <span class='hl'>colour of</span> the wall is odd.","Duvarın rengi tuhaf."],["It's <span class='hl'>a day's</span> work.","Bir günlük iş."]]},
    {h:"Double possessive", p:["<code>of + 's</code> birlikte kullanılabilir; \"birçoğundan biri\" anlamı verir."],
      ex:[["He is <span class='hl'>a friend of mine</span>.","O bir arkadaşım. (birçok arkadaşımdan biri)"],["That's <span class='hl'>a painting of Picasso's</span>.","Bu Picasso'nun tablolarından biri."]]},
    {h:"Yerler ve dükkânlar", p:["<code>'s</code> tek başına yer bildirir: <em>the butcher's</em> (kasap), <em>the doctor's</em> (doktorun muayenehanesi), <em>Ali's</em> (Ali'nin evi/dükkânı)."],
      ex:[["I'm going to <span class='hl'>the dentist's</span>.","Dişçiye gidiyorum."],["We had dinner at <span class='hl'>Maria's</span>.","Maria'da yemek yedik."]]},
    {h:"Common Mistakes", pairs:[
      ["The car of my brother is new.","My brother's car is new.","İnsan sahiplik → <em>'s</em>."],
      ["The childrens' toys","The children's toys","<em>children</em> zaten çoğul."],
      ["It's colour is red.","Its colour is red.","<em>its</em> = iyelik, kesme işareti yok."],
      ["This is a friend of me.","This is a friend of mine.","Double possessive."]]}
  ],
  related:["pronouns","plural-nouns","determiners"]
},
{
  id:"quantifiers", title:"Quantifiers", tr:"Niceleyiciler", level:"A2–B1", tags:["noun","determiner"],
  intro:"Quantifier, ismin <strong>miktarını</strong> belirtir. Seçim, ismin sayılabilir olup olmamasına ve cümlenin olumlu/olumsuz/soru olmasına bağlıdır.",
  sections:[
    {h:"Sayılabilirliğe göre seçim", table:{head:["Countable","Uncountable","Her ikisi"],rows:[
      ["many","much","a lot of / lots of"],
      ["few / a few","little / a little","some / any"],
      ["several","a great deal of","plenty of"],
      ["a number of","an amount of","most / all / no"],
      ["each / every","—","enough"]]}},
    {h:"much / many / a lot of", p:["<code>much</code> ve <code>many</code> genellikle <strong>olumsuz ve soru</strong> cümlelerde; olumlu cümlelerde <code>a lot of</code> tercih edilir."],
      ex:[["Do you have <span class='hl'>many</span> friends here?","Burada çok arkadaşın var mı?"],
        ["I don't have <span class='hl'>much</span> time.","Fazla vaktim yok."],
        ["She has <span class='hl'>a lot of</span> experience.","Çok deneyimi var. (olumlu → a lot of)"],
        ["<span class='hl'>How much</span> does it cost? / <span class='hl'>How many</span> people came?","Ne kadar? / Kaç kişi?"]]},
    {h:"few / a few / little / a little", table:{head:["Yapı","Anlam","Ton"],rows:[
      ["<code>a few</code> + çoğul","birkaç (yeterli)","olumlu: <em>I have a few friends.</em>"],
      ["<code>few</code> + çoğul","çok az (yetersiz)","olumsuz: <em>Few people came.</em>"],
      ["<code>a little</code> + uncountable","biraz (yeterli)","olumlu: <em>We have a little time.</em>"],
      ["<code>little</code> + uncountable","çok az (yetersiz)","olumsuz: <em>There is little hope.</em>"]]},
      callout:{t:"Kritik nüans",b:"<em>a</em> harfi anlamı tersine çevirir: <em>a few friends</em> = birkaç arkadaşım var (iyi), <em>few friends</em> = neredeyse hiç arkadaşım yok (kötü)."}},
    {h:"some / any", table:{head:["some","any"],rows:[
      ["Olumlu cümleler: I have some money.","Olumsuz: I don't have any money."],
      ["Teklif/rica (beklenen cevap evet): Would you like some tea?","Sorular: Do you have any questions?"],
      ["—","Olumlu \"herhangi\": Any student can apply."]]}},
    {h:"all / most / both / none / each / every", table:{head:["Quantifier","Kullanım","Örnek"],rows:[
      ["all (of)","tümü","All (of) the students passed."],
      ["most (of)","çoğu","Most people agree."],
      ["both (of)","ikisi de","Both (of) my parents are teachers."],
      ["none of","hiçbiri","None of them replied."],
      ["each","tek tek","Each student has a laptop."],
      ["every","genel bütün","Every child needs sleep."],
      ["either / neither","ikisinden biri / hiçbiri","Neither answer is correct."]]},
      p:["<code>of</code> kullanımı: belirli bir gruptan bahsediliyorsa <em>of the / of my / of them</em> gerekir: <em>most <strong>of the</strong> students</em> ama <em>most students</em> (genel)."]},
    {h:"Common Mistakes", pairs:[
      ["I have much friends.","I have a lot of friends. / many friends","<em>much</em> sayılamazlarla."],
      ["Most of people like music.","Most people like music.","Genel ifade → <em>of</em> yok."],
      ["Every students must attend.","Every student must attend.","<em>every</em> + tekil isim."],
      ["I don't have some money.","I don't have any money.","Olumsuzda <em>any</em>."]]}
  ],
  related:["countable-uncountable","determiners","articles"]
},
{
  id:"articles", title:"Articles", tr:"Tanımlıklar (a / an / the)", level:"A1", tags:["noun","determiner"],
  intro:"Article, ismin <strong>belirli mi belirsiz mi</strong> olduğunu gösterir. Türkçede karşılığı olmadığı için (\"bir\" kısmen <em>a</em>'dır, <em>the</em>'nin karşılığı yoktur) Türk öğrencilerin en uzun süre hata yaptığı konudur.",
  sections:[
    {h:"Üç seçenek", table:{head:["Article","Ne zaman","Örnek"],rows:[
      ["<code>a / an</code>","Belirsiz, tekil sayılabilir; ilk kez bahsediliyor","I saw <strong>a</strong> dog."],
      ["<code>the</code>","Belirli; dinleyen hangisi olduğunu biliyor","<strong>The</strong> dog was barking."],
      ["<code>∅</code> (zero)","Genel anlam, çoğul veya uncountable","<strong>Dogs</strong> are loyal."]]}},
    {h:"a mı an mi", p:["Yazıya değil <strong>sese</strong> bakılır: ünlü <em>sesle</em> başlıyorsa <code>an</code>."],
      ex:[["<span class='hl'>a</span> university, <span class='hl'>a</span> European, <span class='hl'>a</span> one-way street","Yazımda ünlü ama sesi /ju/, /w/ → a"],["<span class='hl'>an</span> hour, <span class='hl'>an</span> honest man, <span class='hl'>an</span> MBA","Yazımda ünsüz ama sesi ünlü → an"]]},
    {h:"the kullanılan durumlar", list:["İkinci kez bahsedilen şey","Tek olan şeyler: the sun, the moon, the internet","Superlative ve sıra sayıları: the best, the first","Belirli bir grup: the students in my class","Nehir, deniz, dağ sırası, çoğul ülke: the Nile, the Alps, the Netherlands, the USA","Milletler ve gruplar: the Turks, the rich","Müzik aletleri: play the piano","Bazı kalıplar: in the morning, on the left, at the moment"]},
    {h:"the kullanılmayan durumlar", list:["Genel çoğul ve uncountable: <em>Cats are independent. Water is life.</em>","Yemek adları: <em>have breakfast, at lunch</em>","Dil ve akademik dersler: <em>speak English, study physics</em>","Çoğu ülke, şehir, cadde: <em>Turkey, Ankara, Oxford Street</em>","Ev/iş/okul/hastane kurumsal anlamda: <em>go to school, be in hospital</em>","Sporlar ve oyunlar: <em>play football, play chess</em>","Zaman kalıpları: <em>at night, by car, next week, last year</em>"],
      ex:[["He goes to <span class='hl'>school</span> by bus.","Okula (öğrenci olarak) gidiyor."],["He went to <span class='hl'>the school</span> to meet the teacher.","Okul binasına gitti."],["I love <span class='hl'>music</span>.","Müziği severim. (genel)"],["I love <span class='hl'>the music</span> in this film.","Bu filmdeki müziği severim. (belirli)"]]},
    {h:"Karşılaştırmalı örnekler", ex:[["<span class='hl'>A</span> woman called you. <span class='hl'>The</span> woman said it was urgent.","Bir kadın aradı. Kadın acil olduğunu söyledi."],
      ["<span class='hl'>Life</span> is short.","Hayat kısadır. (genel)"],
      ["<span class='hl'>The life</span> of a soldier is hard.","Bir askerin hayatı zordur. (belirli)"],
      ["She plays <span class='hl'>the</span> violin and <span class='hl'>∅</span> tennis.","Keman çalar ve tenis oynar."]]},
    {h:"Common Mistakes", pairs:[
      ["I am student.","I am a student.","Tekil sayılabilir isim article ister."],
      ["The life is beautiful.","Life is beautiful.","Genel anlam → zero article."],
      ["I go to the work at 8.","I go to work at 8.","<em>work</em> kalıbında article yok."],
      ["She plays piano.","She plays the piano.","Müzik aleti → <em>the</em>."],
      ["I visited the Turkey.","I visited Turkey.","Tekil ülke adı → article yok."]]}
  ],
  related:["determiners","countable-uncountable","quantifiers"]
},
{
  id:"adjectives", title:"Adjectives", tr:"Sıfatlar", level:"A2–B1", tags:["adjective"],
  intro:"Sıfat, ismi niteler. İngilizcede sıfatlar <strong>çoğul olmaz</strong> ve genellikle ismin <strong>önünde</strong> yer alır: <em>three big houses</em> (❌ <em>bigs</em>).",
  sections:[
    {h:"İki konum", table:{head:["Konum","Yapı","Örnek"],rows:[
      ["<strong>Attributive</strong>","sıfat + isim","an <strong>interesting</strong> book"],
      ["<strong>Predicative</strong>","be/seem/look + sıfat","The book is <strong>interesting</strong>."]]},
      p:["Bazı sıfatlar yalnızca predicative kullanılır: <code>afraid, alive, alone, asleep, awake, glad, ill, ready, sorry</code>. ❌ <em>an asleep baby</em> → ✅ <em>a sleeping baby</em>."],
      ex:[["This is an <span class='hl'>interesting</span> book.","Bu ilginç bir kitap. (attributive — isimden önce)"],
        ["The book is <span class='hl'>interesting</span>.","Kitap ilginç. (predicative — be'den sonra)"],
        ["My uncle is <span class='hl'>asleep</span> on the sofa.","Amcam kanepede uyuyor. (yalnızca predicative)"],
        ["Look at that <span class='hl'>sleeping</span> cat.","Şu uyuyan kediye bak. (asleep yerine sleeping — isimden önce)"]]},
    {h:"-ed / -ing sıfatları", p:["<code>-ing</code> sıfatı <strong>sebebi</strong>, <code>-ed</code> sıfatı <strong>hissi</strong> anlatır. Türk öğrencilerin klasik hatası buradadır."],
      table:{head:["-ing (sebep)","-ed (his)"],rows:[
        ["The film is bor<strong>ing</strong>.","I am bor<strong>ed</strong>."],
        ["The news was shock<strong>ing</strong>.","We were shock<strong>ed</strong>."],
        ["This job is tir<strong>ing</strong>.","I feel tir<strong>ed</strong>."],
        ["interesting / confusing / exciting","interested / confused / excited"]]},
      pairs:[["I am very boring in this lesson.","I am very bored in this lesson.","<em>boring</em> derseniz \"sıkıcı bir insanım\" demiş olursunuz."]]},
    {h:"Sıfat + edat kalıpları", table:{head:["Kalıp","Örnek"],rows:[
      ["good / bad <strong>at</strong>","She is good at maths."],["interested <strong>in</strong>","I'm interested in history."],
      ["afraid / scared <strong>of</strong>","He is afraid of dogs."],["proud <strong>of</strong>","We are proud of you."],
      ["responsible <strong>for</strong>","Who is responsible for this?"],["famous <strong>for</strong>","Bursa is famous for its kebab."],
      ["married <strong>to</strong>","She is married to a doctor."],["similar <strong>to</strong>","This is similar to mine."],
      ["different <strong>from</strong>","Mine is different from yours."],["angry <strong>with</strong> (kişi) / <strong>about</strong> (şey)","I'm angry with him about the delay."]]}},
    {h:"Karşılaştırma biçimleri", p:["Detay için <a href='#/comparison'>Comparison</a> sayfasına bak. Kısaca: tek heceli → <code>-er / -est</code>; iki heceden fazla → <code>more / most</code>."]},
    {h:"Common Mistakes", pairs:[
      ["They are two smalls rooms.","They are two small rooms.","Sıfat çoğul olmaz."],
      ["I am interesting in music.","I am interested in music.","His → -ed."],
      ["She is a woman beautiful.","She is a beautiful woman.","Sıfat isimden önce."],
      ["He is good in English.","He is good at English.","Sabit edat: <em>good at</em>."]]}
  ],
  related:["order-of-adjectives","comparison","adverbs","fixed-prepositions"]
},
