{
  id:"adverbs", title:"Adverbs", tr:"Zarflar", level:"B1", tags:["adverb"],
  intro:"Zarf; fiili, sıfatı veya başka bir zarfı niteler. Sorusu: <em>nasıl, ne zaman, nerede, ne sıklıkla, ne kadar?</em> İngilizcede zarfın <strong>cümledeki yeri anlamı değiştirebilir</strong>.",
  sections:[
    {h:"Türler", table:{head:["Tür","Soru","Örnek"],rows:[
      ["Manner — biçim","nasıl?","carefully, quickly, well, badly"],
      ["Time — zaman","ne zaman?","yesterday, soon, now, later"],
      ["Place — yer","nerede?","here, there, upstairs, abroad"],
      ["Frequency — sıklık","ne sıklıkla?","always, often, rarely, never"],
      ["Degree — derece","ne kadar?","very, quite, extremely, almost"],
      ["Certainty — kesinlik","ne kadar kesin?","probably, definitely, perhaps"]]}},
    {h:"Sıfattan zarf yapımı", table:{head:["Kural","Örnek"],rows:[
      ["genel: + <code>-ly</code>","quick → quickly, careful → carefully"],
      ["ünsüz + y → <code>-ily</code>","happy → happily, easy → easily"],
      ["-le → <code>-ly</code>","simple → simply, terrible → terribly"],
      ["-ic → <code>-ically</code>","automatic → automatically"],
      ["Değişmeyen","fast, hard, late, early, high, near, straight"],
      ["Düzensiz","good → <strong>well</strong>"]]},
      callout:{t:"Tuzak",b:"<code>hardly</code> ≠ <code>hard</code>. <em>He works hard</em> = çok çalışır; <em>He hardly works</em> = neredeyse hiç çalışmaz. Aynı şekilde <em>lately</em> = son zamanlarda, <em>late</em> = geç."}},
    {h:"Cümledeki yer", table:{head:["Zarf türü","Yer","Örnek"],rows:[
      ["Frequency","ana fiilden önce, <em>be</em>'den sonra","She <strong>often</strong> travels. / She is <strong>often</strong> late."],
      ["Manner","fiilden veya nesneden sonra","He speaks English <strong>fluently</strong>."],
      ["Time / Place","genellikle cümle sonunda","We met <strong>at the café yesterday</strong>."],
      ["Degree","nitelediği kelimeden önce","It's <strong>very</strong> hot."],
      ["Comment","cümle başında","<strong>Fortunately</strong>, nobody was hurt."]]},
      p:["Birden fazla zarf sonda ise sıra: <strong>Manner → Place → Time</strong> (MPT)."],
      ex:[["She sang <span class='hl'>beautifully at the concert last night</span>.","biçim → yer → zaman"],["He drove <span class='hl'>carefully to the airport this morning</span>.","Aynı sıra"]]},
    {h:"Sıfat mı zarf mı", ex:[["She is a <span class='hl'>careful</span> driver.","Sıfat — ismi niteler"],["She drives <span class='hl'>carefully</span>.","Zarf — fiili niteler"],["The soup tastes <span class='hl'>good</span>.","Duyu fiilinden sonra sıfat"],["She sings <span class='hl'>well</span>.","Eylem fiilinden sonra zarf"]]},
    {h:"Common Mistakes", pairs:[
      ["He speaks English good.","He speaks English well.","Fiil → zarf."],
      ["She always is late.","She is always late.","<em>be</em>'den sonra."],
      ["I go often to the gym.","I often go to the gym.","Sıklık zarfı ana fiilden önce."],
      ["He drives very fastly.","He drives very fast.","<em>fast</em> zaten zarftır."]]}
  ],
  related:["adjectives","comparison","linking-words","emphasis"]
},
{
  id:"comparison", title:"Comparison", tr:"Karşılaştırma", level:"A2–B1", tags:["adjective","adverb"],
  intro:"Karşılaştırma üç derecede yapılır: eşitlik (<em>as…as</em>), üstünlük (<em>-er / more</em>) ve en üstünlük (<em>-est / most</em>).",
  sections:[
    {h:"Kurallar", table:{head:["Hece","Comparative","Superlative","Örnek"],rows:[
      ["Tek heceli","<code>-er</code>","<code>-est</code>","tall → taller → the tallest"],
      ["Tek heceli (ünlü+ünsüz)","ünsüz ikilenir","","big → bigger → the biggest"],
      ["İki heceli, -y","<code>-ier</code>","<code>-iest</code>","happy → happier → the happiest"],
      ["İki heceli (diğer)","<code>more</code>","<code>most</code>","careful → more careful → the most careful"],
      ["Üç+ heceli","<code>more</code>","<code>most</code>","expensive → more expensive → the most expensive"]]}},
    {h:"Düzensiz karşılaştırmalar", table:{head:["Sıfat/Zarf","Comparative","Superlative"],rows:[
      ["good / well","better","the best"],["bad / badly","worse","the worst"],
      ["far","farther / further","the farthest / furthest"],["little","less","the least"],
      ["much / many","more","the most"],["old","older / elder","the oldest / eldest"]]}},
    {h:"as…as — eşitlik", code:"as + sıfat/zarf + as        She is <span class='k'>as tall as</span> her brother.\nnot as/so + sıfat + as     It isn't <span class='k'>as cold as</span> yesterday.\ntwice / half + as…as       This costs <span class='k'>twice as much as</span> that.",
      ex:[["He runs <span class='hl'>as fast as</span> a professional.","Profesyonel kadar hızlı koşar."],["This exam wasn't <span class='hl'>as difficult as</span> the last one.","Bu sınav geçen sefer kadar zor değildi."]]},
    {h:"Comparative kalıpları", ex:[["My flat is <span class='hl'>smaller than</span> yours.","Dairem seninkinden küçük."],
      ["She is <span class='hl'>much more</span> experienced <span class='hl'>than</span> me.","Benden çok daha deneyimli. (<em>much</em> ile pekiştirme)"],
      ["The <span class='hl'>more</span> you practise, the <span class='hl'>better</span> you get.","Ne kadar pratik yaparsan o kadar iyi olursun."],
      ["Prices are getting <span class='hl'>higher and higher</span>.","Fiyatlar giderek yükseliyor."],
      ["This is <span class='hl'>the best</span> coffee I have <span class='hl'>ever</span> had.","Bu şimdiye kadar içtiğim en iyi kahve."]]},
    {h:"Pekiştiriciler", p:["Comparative'i güçlendirme: <code>much, far, a lot, considerably, significantly</code>. Zayıflatma: <code>a bit, slightly, a little</code>. ❌ <em>very bigger</em> denmez."]},
    {h:"Common Mistakes", pairs:[
      ["She is more taller than me.","She is taller than me.","Çift karşılaştırma."],
      ["This is the most best option.","This is the best option.","<em>best</em> zaten superlative."],
      ["He is more old than her.","He is older than her.","Tek heceli → <em>-er</em>."],
      ["It's the biggest city of Turkey.","It's the biggest city in Turkey.","Superlative + <em>in</em> (yer)."],
      ["as tall than me","as tall as me","<em>as…as</em> kalıbı."]]}
  ],
  related:["adjectives","adverbs","order-of-adjectives"]
},
{
  id:"determiners", title:"Determiners", tr:"Belirleyiciler", level:"B2", tags:["determiner","noun"],
  intro:"Determiner, isim öbeğinin başında gelerek ismin <strong>hangi/ne kadar</strong> olduğunu belirtir. Article, possessive, demonstrative ve quantifier'ların hepsi determiner ailesindendir. Kritik kural: <strong>aynı slotta iki central determiner olamaz</strong>.",
  sections:[
    {h:"Üç konum", table:{head:["Konum","Örnekler","Not"],rows:[
      ["<strong>Predeterminer</strong>","all, both, half, twice, such, what","central'dan önce"],
      ["<strong>Central determiner</strong>","a/an, the, this/that, my/your, some/any, no, each/every","yalnızca <strong>bir</strong> tane"],
      ["<strong>Postdeterminer</strong>","one/two…, first/next/last, many, few, several, other","central'dan sonra"]]},
      code:"<span class='k'>all</span>      <span class='k'>the</span>       <span class='k'>three</span>   students\npredet.  central   postdet.   isim\n\n<span class='k'>both</span> <span class='k'>my</span> <span class='k'>other</span> brothers\n<span class='k'>half</span> <span class='k'>the</span> <span class='k'>first</span> chapter"},
    {h:"İki central determiner çakışması", p:["Türkçede \"benim bu kitabım\" mümkündür; İngilizcede değildir. Çözüm <code>of</code> yapısıdır."],
      pairs:[["my this book","this book of mine","İki central determiner yan yana gelemez."],
        ["a my friend","a friend of mine","Double possessive gerekir."],
        ["the your car","your car","Biri seçilmelidir."]]},
    {h:"Demonstratives — işaret sıfatları", table:{head:["","Yakın","Uzak"],rows:[["Tekil","this","that"],["Çoğul","these","those"]]},
      ex:[["<span class='hl'>This</span> book is mine; <span class='hl'>that</span> one is yours.","Bu kitap benim; şu seninki."],["<span class='hl'>These</span> days everything is online.","Bu günlerde her şey çevrimiçi."]]},
    {h:"each vs every", table:{head:["each","every"],rows:[
      ["Tek tek, bireysel","Bütünsel, genel"],
      ["İki veya daha fazla","Üç veya daha fazla"],
      ["Zamir olabilir: <em>Each of them…</em>","Zamir olamaz: ❌ <em>Every of them</em>"],
      ["Each student got a certificate.","Every student must attend."]]}},
    {h:"Common Mistakes", pairs:[
      ["All the my friends came.","All my friends came.","<em>the</em> + <em>my</em> çakışır."],
      ["Every of us has a role.","Each of us has a role.","<em>every of</em> yapısı yoktur."],
      ["These kind of problems","This kind of problem / These kinds of problems","Uyum hatası."]]}
  ],
  related:["articles","quantifiers","possessives","pronouns"]
},
{
  id:"prepositions-time", title:"Prepositions of Time", tr:"Zaman Edatları", level:"A1–B1", tags:["preposition"],
  intro:"Zaman edatları, bir olayın <strong>ne zaman</strong> olduğunu belirtir. Temel üçlü <code>in / on / at</code> bir <strong>huni mantığı</strong> izler: geniş zaman diliminden dar zaman noktasına.",
  sections:[
    {h:"in / on / at hunisi", code:"<span class='k'>in</span>  → uzun dilimler   (yüzyıl, yıl, ay, mevsim, günün bölümü)\n<span class='k'>on</span>  → belirli günler   (gün adı, tarih, özel gün)\n<span class='k'>at</span>  → nokta zamanlar  (saat, öğün, kalıplar)",
      table:{head:["Edat","Kullanım","Örnekler"],rows:[
        ["<code>in</code>","yüzyıl / yıl / ay / mevsim / günün bölümü / süre sonu","in 2026, in July, in summer, in the morning, in two hours"],
        ["<code>on</code>","gün / tarih / özel gün / belirli sabah-akşam","on Monday, on 5 May, on my birthday, on Friday evening"],
        ["<code>at</code>","saat / öğün / kalıp / tatil dönemi","at 7 o'clock, at noon, at night, at the weekend (BrE), at Christmas"]]}},
    {h:"Diğer önemli zaman edatları", table:{head:["Edat","Anlam","Örnek"],rows:[
      ["<code>for</code>","süre uzunluğu","for three years"],
      ["<code>since</code>","başlangıç noktası","since 2020"],
      ["<code>during</code>","bir süre boyunca (isimle)","during the meeting"],
      ["<code>while</code>","bir süre boyunca (cümleyle)","while I was working"],
      ["<code>by</code>","en geç … kadar","by Friday (cumaya kadar)"],
      ["<code>until / till</code>","… kadar (süreklilik)","until Friday (cumaya dek sürer)"],
      ["<code>from … to/until</code>","aralık","from 9 to 5"],
      ["<code>before / after</code>","önce / sonra","before lunch, after work"],
      ["<code>ago</code>","… önce (geçmişten geriye)","two days ago"],
      ["<code>in</code>","… sonra (şimdiden ileriye)","in two days"],
      ["<code>within</code>","… içinde","within a week"]]}},
    {h:"by vs until", p:["Bu ikisi en sık karıştırılan çifttir: <code>by</code> bir <strong>son teslim anı</strong>, <code>until</code> bir <strong>süreklilik sonu</strong> bildirir."],
      ex:[["Send the report <span class='hl'>by</span> Friday.","Raporu en geç cumaya kadar gönder. (tek seferlik eylem)"],["I will be here <span class='hl'>until</span> Friday.","Cumaya kadar burada olacağım. (süregelen)"]]},
    {h:"Edat kullanılmayan durumlar", p:["<code>next, last, this, every, all, tomorrow, yesterday, today</code> ile edat kullanılmaz."],
      pairs:[["I'll see you on next Monday.","I'll see you next Monday.","<em>next</em> ile edat yok."],
        ["In yesterday I was busy.","Yesterday I was busy.","<em>yesterday</em> ile edat yok."]]},
    {h:"Examples", ex:[["The meeting is <span class='hl'>on</span> Tuesday <span class='hl'>at</span> 10 <span class='hl'>in</span> the morning.","Toplantı salı sabah 10'da."],
      ["She has been ill <span class='hl'>since</span> Monday.","Pazartesiden beri hasta."],
      ["We travelled <span class='hl'>for</span> six hours.","Altı saat yol gittik."],
      ["He fell asleep <span class='hl'>during</span> the film.","Film sırasında uyuyakaldı."],
      ["I finished the course <span class='hl'>two months ago</span>.","Kursu iki ay önce bitirdim."]]},
    {h:"Common Mistakes", pairs:[
      ["I was born in 5 June.","I was born on 5 June.","Tarih → <em>on</em>."],
      ["See you in Monday.","See you on Monday.","Gün adı → <em>on</em>."],
      ["I have lived here since three years.","I have lived here for three years.","Süre → <em>for</em>."],
      ["I will finish until Friday.","I will finish by Friday.","Son teslim → <em>by</em>."]]}
  ],
  related:["prepositions-place","fixed-prepositions","present-perfect"]
},
{
  id:"prepositions-place", title:"Prepositions of Place & Movement", tr:"Yer ve Hareket Edatları", level:"A1–B1", tags:["preposition"],
  intro:"Yer edatları bir şeyin <strong>nerede</strong> olduğunu, hareket edatları <strong>nereye doğru</strong> gittiğini anlatır. Yine <code>in / on / at</code> üçlüsü temel yapıdır.",
  sections:[
    {h:"in / on / at — yer", table:{head:["Edat","Mantık","Örnekler"],rows:[
      ["<code>in</code>","kapalı alan, sınırlı bölge","in the box, in Ankara, in Turkey, in the car, in bed"],
      ["<code>on</code>","yüzey, çizgi, katman","on the table, on the wall, on the bus, on the second floor"],
      ["<code>at</code>","nokta, adres, etkinlik","at the door, at the bus stop, at 12 Oxford St, at the concert"]]},
      ex:[["He is <span class='hl'>in</span> the kitchen.","Mutfakta. (kapalı alan)"],["The keys are <span class='hl'>on</span> the desk.","Anahtarlar masanın üstünde."],["I'll meet you <span class='hl'>at</span> the entrance.","Girişte buluşuruz."]]},
    {h:"Konum edatları", table:{head:["Edat","Anlam","Örnek"],rows:[
      ["above / over","üstünde (temassız)","The lamp is above the table."],
      ["under / below","altında","The cat is under the chair."],
      ["between","iki şey arasında","between the bank and the café"],
      ["among","çoğul arasında","among the trees"],
      ["in front of","önünde","in front of the building"],
      ["behind","arkasında","behind the door"],
      ["next to / beside","yanında","next to the window"],
      ["near / close to","yakınında","near the station"],
      ["opposite","karşısında","opposite the pharmacy"],
      ["inside / outside","içinde / dışında","inside the house"],
      ["around","etrafında","around the corner"]]}},
    {h:"Hareket edatları", table:{head:["Edat","Anlam","Örnek"],rows:[
      ["to","-e doğru","I'm going to the airport."],
      ["into","içine","She walked into the room."],
      ["out of","içinden dışarı","He got out of the car."],
      ["onto","üstüne","The cat jumped onto the roof."],
      ["off","üstünden","She fell off the bike."],
      ["through","içinden geçerek","We drove through the tunnel."],
      ["across","karşıdan karşıya","He swam across the river."],
      ["along","boyunca","Walk along the river."],
      ["towards","-e doğru","He came towards me."],
      ["past","yanından geçerek","Go past the bank."],
      ["up / down","yukarı / aşağı","climb up the stairs"]]}},
    {h:"Ulaşım araçları", p:["<code>by</code> + araç (article yok): <em>by car, by bus, by plane, by train</em> — ama <strong>on foot</strong>. Araca <strong>binmiş hâldeyken</strong>: <em>in a car / taxi</em> ama <em>on a bus / train / plane</em>."],
      ex:[["I go to work <span class='hl'>by bus</span>.","İşe otobüsle giderim."],["I was <span class='hl'>on the bus</span> when you called.","Aradığında otobüsteydim."],["We came <span class='hl'>on foot</span>.","Yürüyerek geldik."]]},
    {h:"Kurumlarda article farkı", table:{head:["Article'sız (işlev)","Article'lı (bina)"],rows:[
      ["go to school (öğrenci olarak)","go to the school (binaya)"],
      ["be in hospital (hasta olarak)","be at the hospital (ziyaret)"],
      ["go to prison (mahkûm)","go to the prison (ziyaret)"],
      ["be at university (öğrenci)","be at the university (bina)"]]}},
    {h:"Common Mistakes", pairs:[
      ["I live in 15 Atatürk Street.","I live at 15 Atatürk Street.","Tam adres → <em>at</em>."],
      ["She arrived to Istanbul.","She arrived in Istanbul.","<em>arrive in</em> (şehir) / <em>arrive at</em> (nokta)."],
      ["I go to home.","I go home.","<em>home</em> ile <em>to</em> yok."],
      ["He is in the bus.","He is on the bus.","Toplu taşıma → <em>on</em>."]]}
  ],
  related:["prepositions-time","fixed-prepositions","articles"]
},
{
  id:"fixed-prepositions", title:"Fixed Prepositions", tr:"Sabit Edat Kullanımları", level:"B2", tags:["preposition","vocabulary"],
  intro:"Bazı edatlar anlamdan değil, <strong>kelimenin kendisinden</strong> gelir. <em>depend</em> her zaman <em>on</em> alır; mantık aranmaz, kalıp olarak öğrenilir. Bunlar sınavların ve doğal kullanımın en ayırt edici noktasıdır.",
  sections:[
    {h:"Verb + preposition", table:{head:["Kalıp","Anlam","Örnek"],rows:[
      ["depend <strong>on</strong>","bağlı olmak","It depends on the weather."],
      ["belong <strong>to</strong>","ait olmak","This belongs to me."],
      ["apologise <strong>to</strong> sb <strong>for</strong> sth","özür dilemek","He apologised to me for the delay."],
      ["apply <strong>for</strong>","başvurmak","She applied for the job."],
      ["believe <strong>in</strong>","inanmak","I believe in hard work."],
      ["complain <strong>about</strong>","şikâyet etmek","They complained about the noise."],
      ["concentrate <strong>on</strong>","odaklanmak","Concentrate on your studies."],
      ["insist <strong>on</strong>","ısrar etmek","He insisted on paying."],
      ["succeed <strong>in</strong>","başarmak","She succeeded in convincing them."],
      ["consist <strong>of</strong>","oluşmak","The team consists of five members."],
      ["suffer <strong>from</strong>","(hastalık) çekmek","He suffers from asthma."],
      ["accuse sb <strong>of</strong>","suçlamak","They accused him of lying."],
      ["blame sb <strong>for</strong>","suçlamak","Don't blame me for this."],
      ["congratulate sb <strong>on</strong>","tebrik etmek","Congratulations on your promotion!"],
      ["prevent sb <strong>from</strong>","engellemek","Nothing prevents you from trying."],
      ["remind sb <strong>of</strong>","hatırlatmak","You remind me of my brother."],
      ["translate <strong>from…into</strong>","çevirmek","translated from Turkish into English"]]}},
    {h:"Edat almayan tuzak fiiller", p:["Bu fiiller Türkçede edat gerektirdiği için sık hata yapılır; İngilizcede <strong>doğrudan nesne</strong> alırlar:"],
      pairs:[["I called to my mother.","I called my mother.","<em>call</em> edat almaz."],
        ["Please answer to my question.","Please answer my question.","<em>answer</em> edat almaz."],
        ["We discussed about the plan.","We discussed the plan.","<em>discuss</em> edat almaz."],
        ["He married with a doctor.","He married a doctor.","<em>marry</em> edat almaz (ama <em>be married to</em>)."],
        ["I entered to the room.","I entered the room.","<em>enter</em> edat almaz."]]},
    {h:"Adjective + preposition", table:{head:["Kalıp","Örnek"],rows:[
      ["aware <strong>of</strong>","I'm aware of the risk."],["capable <strong>of</strong>","She is capable of more."],
      ["keen <strong>on</strong>","He's keen on cycling."],["dependent <strong>on</strong>","dependent on aid"],
      ["satisfied <strong>with</strong>","satisfied with the result"],["disappointed <strong>with/in</strong>","disappointed with the service"],
      ["suitable <strong>for</strong>","suitable for beginners"],["addicted <strong>to</strong>","addicted to sugar"],
      ["guilty <strong>of</strong>","guilty of fraud"],["typical <strong>of</strong>","typical of him"]]}},
    {h:"Noun + preposition", table:{head:["Kalıp","Örnek"],rows:[
      ["reason <strong>for</strong>","the reason for the delay"],["solution <strong>to</strong>","a solution to the problem"],
      ["increase / decrease <strong>in</strong>","an increase in prices"],["effect <strong>on</strong>","an effect on health"],
      ["attitude <strong>to/towards</strong>","her attitude to work"],["demand <strong>for</strong>","demand for housing"],
      ["difficulty <strong>in</strong>","difficulty in breathing"],["advantage <strong>of</strong>","the advantage of remote work"]]}},
    {h:"Sık kullanılan kalıp ifadeler", p:["<code>in fact</code> · <code>in general</code> · <code>on purpose</code> · <code>on time</code> (tam saatinde) · <code>in time</code> (yetişerek) · <code>at last</code> · <code>by mistake</code> · <code>in charge of</code> · <code>on behalf of</code> · <code>in touch with</code> · <code>at risk</code> · <code>under pressure</code>"],
      ex:[["The train arrived <span class='hl'>on time</span>.","Tren tam saatinde geldi."],["We got there <span class='hl'>in time</span> for the film.","Filme yetişecek şekilde vardık."]]},
    {h:"Common Mistakes", pairs:[
      ["It depends of you.","It depends on you.","Sabit kalıp."],
      ["I'm interested about art.","I'm interested in art.","Sabit kalıp."],
      ["Listen the teacher.","Listen to the teacher.","<em>listen</em> edat ister."],
      ["Explain me the rule.","Explain the rule to me.","<em>explain to sb</em>."]]}
  ],
  related:["prepositions-time","prepositions-place","phrasal-verbs","adjectives"]
},
{
  id:"coordinating-conjunctions", title:"Coordinating Conjunctions", tr:"Eşgüdümlü Bağlaçlar (FANBOYS)", level:"A1–B1", tags:["conjunction"],
  intro:"Eşgüdümlü bağlaçlar, <strong>eşit değerdeki</strong> iki öğeyi (kelime, öbek veya bağımsız cümle) birleştirir. Yedi tanedir ve <strong>FANBOYS</strong> ile hatırlanır.",
  sections:[
    {h:"FANBOYS", table:{head:["Harf","Bağlaç","Anlam","Örnek"],rows:[
      ["<strong>F</strong>","for","çünkü (resmî)","He stayed home, for he was ill."],
      ["<strong>A</strong>","and","ve","She sings and dances."],
      ["<strong>N</strong>","nor","ne de","He doesn't smoke, nor does he drink."],
      ["<strong>B</strong>","but","ama","It's small but comfortable."],
      ["<strong>O</strong>","or","veya","Tea or coffee?"],
      ["<strong>Y</strong>","yet","yine de","He's rich, yet unhappy."],
      ["<strong>S</strong>","so","bu yüzden","It was late, so we left."]]}},
    {h:"Noktalama kuralı", p:["İki <strong>bağımsız cümleyi</strong> birleştirirken bağlaçtan <strong>önce virgül</strong> konur. Sadece iki öbek/kelime birleşiyorsa virgül konmaz."],
      ex:[["I called her<span class='hl'>,</span> but she didn't answer.","İki tam cümle → virgül var"],["I called her but got no answer.","Tek özne, iki fiil → virgül yok"]],
      callout:{t:"Comma splice",b:"İki bağımsız cümle <strong>yalnızca virgülle</strong> birleştirilemez: ❌ <em>It was late, we left.</em> → ✅ <em>It was late, so we left.</em> ya da noktalı virgül: <em>It was late; we left.</em>"}},
    {h:"Paralellik kuralı", p:["<code>and / or / but</code> ile birleşen öğeler <strong>aynı dilbilgisel formda</strong> olmalıdır."],
      pairs:[["She likes swimming, running and to cycle.","She likes swimming, running and cycling.","Üçü de -ing olmalı."],
        ["He is smart, hardworking and has ambition.","He is smart, hardworking and ambitious.","Üçü de sıfat olmalı."]]},
    {h:"Correlative conjunctions — ikili bağlaçlar", table:{head:["Kalıp","Örnek"],rows:[
      ["both … and","Both Ali and Ayşe passed."],
      ["either … or","Either you call him or I will."],
      ["neither … nor","Neither the manager nor the staff knew."],
      ["not only … but also","Not only did she apologise, but she also paid."],
      ["whether … or","I don't know whether to stay or go."]]},
      p:["Fiil uyumu <strong>en yakın özneye</strong> göre yapılır: <em>Neither the students nor the teacher <strong>was</strong> ready.</em>"]},
    {h:"Common Mistakes", pairs:[
      ["Although it was late, but we continued.","Although it was late, we continued.","İki bağlaç birlikte kullanılmaz."],
      ["He neither called or wrote.","He neither called nor wrote.","<em>neither … nor</em>."],
      ["I like tea, I don't like coffee.","I like tea, but I don't like coffee.","Comma splice."]]}
  ],
  related:["subordinating-conjunctions","linking-words","ellipsis-substitution"]
},
{
  id:"subordinating-conjunctions", title:"Subordinating Conjunctions", tr:"Bağımlı Bağlaçlar", level:"B1–B2", tags:["conjunction","clause"],
  intro:"Bağımlı bağlaçlar, bir yan cümleyi ana cümleye bağlar. Yan cümle <strong>tek başına anlamlı değildir</strong>: <em>because it was raining</em> — bu tam bir cümle değildir.",

const BY_ID = {};
TOPICS.forEach(t => BY_ID[t.id] = t);
const ORDER = GROUPS.flatMap(g => g.ids).filter(id => BY_ID[id]);
const GROUP_OF = {};
GROUPS.forEach(g => g.ids.forEach(id => GROUP_OF[id] = g.title));

const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');
const tocEl = document.getElementById('toc');
const searchEl = document.getElementById('search');

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

function buildSidebar(filter){
  const q = (filter||'').trim().toLowerCase();
  sidebar.innerHTML = '';
  let hits = 0;
  GROUPS.forEach((g, gi) => {
    const items = g.ids.filter(id => {
      const t = BY_ID[id];
      if(!t) return false;
      if(!q) return true;
      return (t.title + ' ' + t.tr + ' ' + (t.tags||[]).join(' ') + ' ' + g.title).toLowerCase().includes(q);
    });
    if(!items.length) return;
    hits += items.length;
    const wrap = document.createElement('div');
    wrap.className = 'nav-group';
    const btn = document.createElement('button');
    btn.innerHTML = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>' +
      '<span>' + g.title + '</span><span class="count">' + items.length + '</span>';
    btn.addEventListener('click', () => wrap.classList.toggle('collapsed'));
    const ul = document.createElement('ul');
    items.forEach(id => {
      const t = BY_ID[id];
      const li = document.createElement('li');
      li.innerHTML = '<a href="#/' + id + '" data-id="' + id + '">' + t.title + '</a>';
      ul.appendChild(li);
    });
    wrap.appendChild(btn); wrap.appendChild(ul);
    sidebar.appendChild(wrap);
  });
  if(!hits){
    sidebar.innerHTML = '<p class="nav-empty">Eşleşen konu yok. Farklı bir kelime dene.</p>';
  }
  markActive();
}

function markActive(){
  const id = currentId();
  sidebar.querySelectorAll('a[data-id]').forEach(a => a.classList.toggle('active', a.dataset.id === id));
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function renderSection(s){
  let h = '';
  const anchor = slug(s.h);
  h += '<h2 id="' + anchor + '">' + s.h + '</h2>';
  if(s.p){ (Array.isArray(s.p) ? s.p : [s.p]).forEach(p => h += '<p>' + p + '</p>'); }
  if(s.code){ h += '<pre><code>' + s.code + '</code></pre>'; }
  if(s.list){ h += '<ul class="body">' + s.list.map(i => '<li>' + i + '</li>').join('') + '</ul>'; }
  if(s.table){
    h += '<div class="tablewrap"><table class="grid"><thead><tr>' +
      s.table.head.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' +
      s.table.rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
      '</tbody></table></div>';
  }
  if(s.ex){
    h += '<div class="ex"><div class="ex-head"><span>English</span><span>Türkçe</span></div>' +
      s.ex.map(e => '<div class="ex-row"><div class="ex-en">' + e[0] + '</div><div class="ex-tr">' + e[1] + '</div></div>').join('') +
      '</div>';
  }
  if(s.pairs){
    h += s.pairs.map(p => '<div class="pair"><div class="no"><span class="tag">Yanlış</span>' + p[0] +
      '</div><div class="yes"><span class="tag">Doğru</span>' + p[1] +
      (p[2] ? '<span class="why">' + p[2] + '</span>' : '') + '</div></div>').join('');
  }
  if(s.cards){
    h += '<div class="cards">' + s.cards.map(c =>
      '<a href="#/' + c[0] + '"><b>' + c[1] + '</b><span>' + c[2] + '</span></a>').join('') + '</div>';
  }
  if(s.callout){
    h += '<div class="callout' + (s.callout.t && /uyar|hata|dikkat|tuzak|kritik|disiplin/i.test(s.callout.t) ? ' warn' : '') +
      '"><span class="ct">' + s.callout.t + '</span><p>' + s.callout.b + '</p></div>';
  }
  return h;
}

function renderTopic(id){
  const t = BY_ID[id];
  if(!t){ content.innerHTML = '<h1>404</h1><p>Bu konu bulunamadı.</p>'; tocEl.innerHTML = ''; return; }
  const group = GROUP_OF[id] || '';
  let h = '<div class="crumbs"><span>Docs</span><span class="sep">/</span><span>' + group + '</span><span class="sep">/</span><span>' + t.title + '</span></div>';
  h += '<h1>' + t.title + '</h1>';
  h += '<p class="subtitle">' + t.tr + '</p>';
  h += '<div class="badges"><span class="badge level">' + t.level + '</span>' +
    (t.tags || []).map(x => '<span class="badge">' + x + '</span>').join('') + '</div>';
  h += '<p>' + t.intro + '</p>';
  h += t.sections.map(renderSection).join('');
  if(t.related && t.related.length){
    h += '<h2 id="related">Related</h2><div class="related">' +
      t.related.filter(r => BY_ID[r]).map(r => '<a href="#/' + r + '">' + BY_ID[r].title + '</a>').join('') + '</div>';
  }
  const i = ORDER.indexOf(id);
  const prev = i > 0 ? BY_ID[ORDER[i-1]] : null;
  const next = i > -1 && i < ORDER.length - 1 ? BY_ID[ORDER[i+1]] : null;
  h += '<div class="pager">' +
    (prev ? '<a href="#/' + prev.id + '"><span>Önceki</span><b>' + prev.title + '</b></a>' : '<span></span>') +
    (next ? '<a class="next" href="#/' + next.id + '"><span>Sonraki</span><b>' + next.title + '</b></a>' : '<span></span>') +
    '</div>';
  content.innerHTML = h;
  buildToc();
  window.scrollTo(0, 0);
  document.title = t.title + ' — English Grammar Docs';
}

function buildToc(){
  const hs = [...content.querySelectorAll('h2')];
  if(!hs.length){ tocEl.innerHTML = ''; return; }
  tocEl.innerHTML = '<h4>On this page</h4>' +
    hs.map(h => '<a href="#' + h.id + '" data-anchor="' + h.id + '">' + h.textContent + '</a>').join('');
  tocEl.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', ev => {
      ev.preventDefault();
      const el = document.getElementById(a.dataset.anchor);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

const tocObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if(e.isIntersecting){
      tocEl.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.anchor === e.target.id));
    }
  });
}, {rootMargin:'-80px 0px -70% 0px'});

function observeHeadings(){
  content.querySelectorAll('h2').forEach(h => tocObserver.observe(h));
}

function currentId(){
  const m = location.hash.match(/^#\/(.+)$/);
  return m ? m[1] : ORDER[0];
}

function route(){
  const id = currentId();
  renderTopic(id);
  observeHeadings();
  markActive();
  closeMenu();
}

// ---------- interactions ----------
const sidebarEl = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
function closeMenu(){ sidebarEl.classList.remove('open'); backdrop.classList.remove('open'); }
document.getElementById('menuBtn').addEventListener('click', () => {
  sidebarEl.classList.toggle('open');
  backdrop.classList.toggle('open', sidebarEl.classList.contains('open'));
});
backdrop.addEventListener('click', closeMenu);

searchEl.addEventListener('input', () => buildSidebar(searchEl.value));

const themeBtn = document.getElementById('themeBtn');
function storedTheme(){ try { return localStorage.getItem('egd-theme'); } catch(e){ return null; } }
function applyTheme(v){
  if(v) document.documentElement.setAttribute('data-theme', v);
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme(storedTheme());
themeBtn.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = isDark ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('egd-theme', next); } catch(e){}
});

document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); }
  else if(e.key === 'Escape'){ searchEl.value = ''; buildSidebar(''); searchEl.blur(); closeMenu(); }
  else if(document.activeElement !== searchEl && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    const i = ORDER.indexOf(currentId());
    const j = e.key === 'ArrowLeft' ? i - 1 : i + 1;
    if(j >= 0 && j < ORDER.length) location.hash = '#/' + ORDER[j];
  }
});

window.addEventListener('hashchange', route);
buildSidebar('');
route();
</script>
</body>
</html>
