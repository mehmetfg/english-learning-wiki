<style>

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);}
header{background:#1e293b;color:white;padding:16px 24px;}
header h1{font-size:1.3rem;font-weight:700;}
header p{font-size:0.8rem;opacity:0.7;margin-top:4px;}
.stats-bar{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;}
.stat{background:rgba(255,255,255,0.1);border-radius:20px;padding:4px 12px;font-size:0.8rem;}
.controls{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:10;}
#search{border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:0.88rem;width:200px;outline:none;}
#search:focus{border-color:var(--accent);}
.pills{display:flex;gap:4px;flex-wrap:wrap;}
.pill{border:1px solid var(--border);background:var(--bg);border-radius:20px;
  padding:4px 11px;font-size:0.78rem;cursor:pointer;transition:all 0.15s;font-weight:500;}
.pill.active{background:#1e293b;color:white;border-color:#1e293b;}
.pill.lv.A1.active{background:var(--A1);border-color:var(--A1);}
.pill.lv.A2.active{background:var(--A2);border-color:var(--A2);}
.pill.lv.B1.active{background:var(--B1);border-color:var(--B1);}
.pill.lv.B2.active{background:var(--B2);border-color:var(--B2);}
.pill.lv.C1.active{background:var(--C1);border-color:var(--C1);}
#count{font-size:0.8rem;color:var(--muted);margin-left:auto;}
.tabs-nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:0;}
.tnav{padding:11px 18px;font-size:0.88rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);}
.tnav.active{color:var(--accent);border-bottom-color:var(--accent);}
.main{padding:20px 24px;}
/* PV TABLE */
.pv-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.pv-table th{background:#f1f5f9;padding:10px 14px;text-align:left;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);}
.pv-table td{padding:10px 14px;border-top:1px solid var(--border);font-size:0.87rem;vertical-align:top;}
.pv-table tr:hover{background:#f8fafc;}
.pv-table tr.learned-row{opacity:0.5;}
.pv{font-weight:700;color:var(--text);}
.base-tag{display:inline-block;background:#f1f5f9;border-radius:4px;padding:1px 6px;font-size:0.72rem;color:var(--muted);margin-left:4px;}
.sep-tag{display:inline-block;background:#dbeafe;border-radius:4px;padding:1px 6px;font-size:0.68rem;color:#1d4ed8;margin-left:4px;}
.badge{font-size:0.68rem;font-weight:700;padding:2px 6px;border-radius:8px;color:white;white-space:nowrap;}
.ex-text{font-style:italic;color:var(--muted);font-size:0.82rem;margin-top:3px;}
.row-actions{display:flex;gap:6px;white-space:nowrap;}
.btn-sm{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;
  font-size:0.72rem;cursor:pointer;transition:all 0.15s;font-weight:600;}
.btn-sm:hover{background:var(--A1);color:white;border-color:var(--A1);}
.btn-sm.done{background:var(--A1);color:white;border-color:var(--A1);}
.btn-speak-sm{background:none;border:1px solid var(--border);border-radius:6px;
  padding:3px 6px;font-size:0.78rem;cursor:pointer;}
.group-header{background:#f1f5f9;padding:8px 14px;font-size:0.82rem;font-weight:700;
  color:var(--text);border-top:2px solid var(--border);}
/* CHUNKS */
.chunks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.chunk-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
.chunk-pv{font-weight:700;font-size:1rem;color:var(--accent);margin-bottom:6px;}
.chunk-list{list-style:none;}
.chunk-list li{font-size:0.85rem;padding:4px 0;border-bottom:1px solid #f1f5f9;color:var(--text);}
.chunk-list li:last-child{border-bottom:none;}
.chunk-list li span{color:var(--muted);font-size:0.78rem;display:block;}
/* GUIDE */
.guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.guide-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;}
.guide-card h3{font-size:0.95rem;font-weight:700;margin-bottom:8px;color:var(--text);}
.guide-card p,.guide-card li{font-size:0.83rem;color:var(--muted);line-height:1.6;}
.guide-card ul{padding-left:16px;}
.tip-box{background:#eff6ff;border-left:4px solid var(--B1);padding:10px 14px;
  border-radius:0 8px 8px 0;font-size:0.83rem;color:#1d4ed8;margin-bottom:12px;}
.empty{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>

// ─── APP STATE ────────────────────────────────────────────────────────────────
const BASES = [...new Set(PVS.map(p=>p.base))].sort();
let state = {
  tab: "list",
  base: "all",
  level: "all",
  filter: "all",
  search: "",
  learned: JSON.parse(localStorage.getItem("pv_learned")||"{}"),
  starred: JSON.parse(localStorage.getItem("pv_starred")||"{}")
};
function save(){
  localStorage.setItem("pv_learned",JSON.stringify(state.learned));
}
function toggleLearned(id){ state.learned[id]=!state.learned[id]; save(); render(); }
function speak(text){ const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=0.8;
  window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }
function lvColor(l){ return {A1:"#22c55e",A2:"#16a34a",B1:"#3b82f6",B2:"#a855f7",C1:"#f97316",C2:"#ef4444"}[l]||"#94a3b8"; }

function getVisible(){
  return PVS.filter(p=>{
    if(state.base!=="all" && p.base!==state.base) return false;
    if(state.level!=="all" && p.l!==state.level) return false;
    if(state.filter==="learned" && !state.learned[p.id]) return false;
    if(state.filter==="unlearned" && state.learned[p.id]) return false;
    if(state.search){
      const q=state.search.toLowerCase();
      return p.pv.includes(q)||p.d.toLowerCase().includes(q)||p.ex.toLowerCase().includes(q);
    }
    return true;
  });
}

function buildStats(){
  const ln=PVS.filter(p=>state.learned[p.id]).length;
  document.getElementById("stats-bar").innerHTML=`
    <span class="stat">🔗 ${PVS.length} phrasal verbs</span>
    <span class="stat">✅ ${ln} learned</span>
    <span class="stat">💬 ${CHUNKS.length} chunk sets</span>
    <span class="stat">${Math.round(ln/PVS.length*100)}% complete</span>
  `;
}

function buildPills(){
  const bp=document.getElementById("base-pills");
  bp.innerHTML=["all",...BASES].map(b=>`
    <button class="pill ${state.base===b?"active":""}" data-base="${b}">${b==="all"?"All Verbs":b}</button>
  `).join("");
  bp.querySelectorAll(".pill").forEach(p=>p.addEventListener("click",()=>{state.base=p.dataset.base;render();}));

  const lp=document.getElementById("level-pills");
  lp.innerHTML=["all","A1","A2","B1","B2","C1","C2"].map(l=>`
    <button class="pill lv ${l} ${state.level===l?"active":""}" data-lv="${l}">${l==="all"?"All Levels":l}</button>
  `).join("");
  lp.querySelectorAll(".pill").forEach(p=>p.addEventListener("click",()=>{state.level=p.dataset.lv;render();}));

  document.querySelectorAll("#filter-pills .pill").forEach(p=>
    p.addEventListener("click",()=>{state.filter=p.dataset.f;render();}));
}

function renderList(){
  const vis=getVisible();
  document.getElementById("count").textContent=`${vis.length} results`;
  if(!vis.length) return`<div class="empty">No phrasal verbs found.</div>`;
  // Group by base
  const groups={};
  vis.forEach(p=>{ if(!groups[p.base]) groups[p.base]=[]; groups[p.base].push(p); });
  let html=`<table class="pv-table"><thead><tr>
    <th>Phrasal Verb</th><th>Definition</th><th>Example</th><th>Level</th><th>Actions</th>
  </tr></thead><tbody>`;
  for(const base of Object.keys(groups).sort()){
    html+=`<tr><td colspan="5" class="group-header">▸ ${base.toUpperCase()}</td></tr>`;
    groups[base].forEach(p=>{
      const ln=!!state.learned[p.id];
      html+=`<tr class="${ln?"learned-row":""}">
        <td><span class="pv">${p.pv}</span>
          ${p.sep?'<span class="sep-tag">SEP</span>':''}</td>
        <td>${p.d}</td>
        <td><span class="ex-text">${p.ex}</span></td>
        <td><span class="badge" style="background:${lvColor(p.l)}">${p.l}</span></td>
        <td><div class="row-actions">
          <button class="btn-speak-sm" onclick="speak('${p.pv.replace(/'/g,"\\'")}')">🔊</button>
          <button class="btn-sm ${ln?"done":""}" onclick="toggleLearned(${p.id})">
            ${ln?"✓":"Learn"}
          </button>
        </div></td>
      </tr>`;
    });
  }
  html+=`</tbody></table>`;
  return html;
}

function renderChunks(){
  return`<div class="chunks-grid">${CHUNKS.map(c=>`
    <div class="chunk-card">
      <div class="chunk-pv">🔗 ${c.pv}</div>
      <ul class="chunk-list">
        ${c.sentences.map(s=>`<li>${s.s}<span>${s.t}</span></li>`).join("")}
      </ul>
    </div>
  `).join("")}</div>`;
}

function renderGuide(){
  return`<div>
    <div class="tip-box">💡 <strong>Separable (SEP)</strong>: The object can go between the verb and particle — <em>turn off the light</em> = <em>turn the light off</em>. But with pronouns, you MUST separate: <em>turn it off</em> ✓ (NOT: turn off it ✗)</div>
    <div class="guide-grid">
      <div class="guide-card">
        <h3>🔵 What is a Phrasal Verb?</h3>
        <p>A phrasal verb = verb + particle (preposition or adverb). The meaning is often idiomatic — very different from the literal meaning of the words.</p>
        <ul>
          <li><strong>run</strong> = koşmak</li>
          <li><strong>run out of</strong> = tükenmek</li>
          <li><strong>run into</strong> = tesadüfen karşılaşmak</li>
        </ul>
      </div>
      <div class="guide-card">
        <h3>✂️ Separable vs Inseparable</h3>
        <ul>
          <li><strong>Separable</strong>: verb + object + particle<br><em>Pick up the book</em> = <em>Pick the book up</em></li>
          <li><strong>Inseparable</strong>: verb + particle always together<br><em>Look after the baby</em> ✓ (never: look the baby after)</li>
          <li>With pronouns: ALWAYS separate — <em>pick it up</em></li>
        </ul>
      </div>
      <div class="guide-card">
        <h3>🎨 Register</h3>
        <p>Phrasal verbs are typically <strong>informal/neutral</strong>. In formal writing, use single-word equivalents:</p>
        <ul>
          <li>put off → <strong>postpone</strong></li>
          <li>find out → <strong>discover</strong></li>
          <li>carry out → <strong>conduct/execute</strong></li>
          <li>give up → <strong>abandon/relinquish</strong></li>
          <li>look into → <strong>investigate</strong></li>
        </ul>
      </div>
      <div class="guide-card">
        <h3>🧩 Multiple Meanings</h3>
        <p>Most phrasal verbs have 2–4 meanings. Context is key:</p>
        <ul>
          <li><strong>pick up</strong> = collect / learn casually / improve / answer phone</li>
          <li><strong>go off</strong> = alarm rings / food goes bad / explode</li>
          <li><strong>make up</strong> = invent / reconcile / constitute / cosmetics</li>
        </ul>
      </div>
      <div class="guide-card">
        <h3>📚 Learning Strategy</h3>
        <ul>
          <li>Learn in <strong>base verb groups</strong> (all GET phrasal verbs together)</li>
          <li>Learn with <strong>example sentences</strong>, not just definitions</li>
          <li>Focus on the <strong>most frequent</strong> first: get, put, take, come, go</li>
          <li>Notice phrasal verbs in <strong>real context</strong> — films, podcasts, books</li>
          <li>Use the <strong>Chunks tab</strong> for natural sentence patterns</li>
        </ul>
      </div>
      <div class="guide-card">
        <h3>🏆 Top 10 Most Common</h3>
        <ul>
          <li>1. get up / get on / get over</li>
          <li>2. look after / look forward to</li>
          <li>3. take off / take on</li>
          <li>4. put off / put up with</li>
          <li>5. come up with</li>
          <li>6. find out</li>
          <li>7. work out</li>
          <li>8. go on / go through</li>
          <li>9. give up / give in</li>
          <li>10. turn out / turn up</li>
        </ul>
      </div>
    </div>
  </div>`;
}

function render(){
  buildStats(); buildPills();
  document.querySelectorAll("#filter-pills .pill").forEach(p=>
    p.classList.toggle("active",p.dataset.f===state.filter));
  const m=document.getElementById("main");
  if(state.tab==="list") m.innerHTML=renderList();
  else if(state.tab==="chunks") m.innerHTML=renderChunks();
  else m.innerHTML=renderGuide();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.querySelectorAll(".tnav").forEach(t=>t.addEventListener("click",()=>{
  state.tab=t.dataset.tab;
  document.querySelectorAll(".tnav").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  render();
}));
document.getElementById("search").addEventListener("input",e=>{state.search=e.target.value;render();});
buildPills();
render();
</script>
