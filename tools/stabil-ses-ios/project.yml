name: StabilSes
options:
  bundleIdPrefix: com.mehmetfg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  StabilSes:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Stabil Ses
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetfg.stabilses
    dependencies:
      - target: DfkiVoice

  DfkiVoice:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Resources/tr_TR-dfki-medium.onnx
        buildPhase: resources
      - path: Resources/tokens.txt
        buildPhase: resources
      - path: Resources/espeak-ng-data
        type: folder
        buildPhase: resources
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Dfki Stabil
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).AudioUnitFactory"
          NSExtensionAttributes:
            AudioComponents:
              - type: ausp
                subtype: dfki
                manufacturer: MFGx
                name: "Mehmet: Dfki Stabil"
                description: Türkçe stabil erkek sesi (Piper dfki)
                version: 1
                sandboxSafe: true
                factoryFunction: "$(PRODUCT_MODULE_NAME).AudioUnitFactory"
                tags: [Speech Synthesizer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetfg.stabilses.dfki
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridging-Header.h
        OTHER_LDFLAGS: ["-lc++"]
    dependencies:
      - framework: Frameworks/sherpa-onnx.xcframework
        embed: false
      - framework: Frameworks/onnxruntime.xcframework
        embed: false
      - sdk: CoreML.framework
      - sdk: libc++.tbd
