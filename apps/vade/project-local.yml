# Ücretsiz Apple hesabı için: iCloud ve push yetkileri olmadan derler.
# Veriler sadece o cihazda tutulur (senkron yok). Ücretli hesapta project.yml kullan.
include:
  - project.yml
targets:
  Vade:
    settings:
      base:
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Vade/Support/Vade-iOS-Local.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Vade/Support/Vade-iOS-Local.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Vade/Support/Vade-macOS-Local.entitlements
